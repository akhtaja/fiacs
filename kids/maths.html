<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧮 Maths Fun!</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',Tahoma,sans-serif;
    background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
    background-attachment:fixed;
    min-height:100vh;
    padding:15px;
    overflow-x:hidden;
}

/* Animated glow */
.bg-glow{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
    background:
        radial-gradient(ellipse 500px 500px at 30% 20%, rgba(161,140,209,.2) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 70% 70%, rgba(251,194,235,.15) 0%, transparent 70%),
        radial-gradient(ellipse 350px 350px at 50% 50%, rgba(102,126,234,.1) 0%, transparent 70%);
    animation:glowShift 8s ease-in-out infinite alternate;
}
@keyframes glowShift{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}

h1{
    position:relative;z-index:1;
    text-align:center;
    font-size:2.5rem;
    margin:50px 0 15px;
    background:linear-gradient(135deg,#fff,#f0e6ff,#fbc2eb);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    font-weight:800;
    letter-spacing:-1px;
}

.container{
    max-width:500px;
    margin:0 auto;
    position:relative;
    z-index:1;
}

/* Sidebar */
.menu-toggle{
    position:fixed;top:15px;left:15px;z-index:100;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;
    width:44px;height:44px;font-size:22px;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.2);transition:transform .2s,background .2s;
    backdrop-filter:blur(10px);
}
.menu-toggle:hover{transform:scale(1.1);background:rgba(255,255,255,.15)}
.sidebar{
    position:fixed;top:0;left:-260px;width:250px;height:100%;
    background:rgba(15,12,41,.97);backdrop-filter:blur(20px);
    z-index:99;padding:70px 20px 20px;
    box-shadow:4px 0 30px rgba(0,0,0,.4);
    transition:left .3s ease;border-radius:0 20px 20px 0;
    border-right:1px solid rgba(255,255,255,.1);
}
.sidebar.open{left:0}
.sidebar a{
    display:block;padding:14px 16px;margin:6px 0;
    border-radius:12px;text-decoration:none;
    font-size:15px;font-weight:600;color:rgba(255,255,255,.7);transition:background .2s,color .2s;
}
.sidebar a:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}

/* Card */
.card{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:30px;
    box-shadow:0 15px 50px rgba(0,0,0,.2);
    text-align:center;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,.1);
    position:relative;
    overflow:hidden;
}

.card::before{
    content:'';position:absolute;inset:0;border-radius:24px;padding:2px;
    background:linear-gradient(135deg,rgba(255,255,255,.15),rgba(255,255,255,.03),rgba(161,140,209,.2));
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
}

/* Problem display */
.problem{
    font-size:3.5rem;
    font-weight:bold;
    color:#fff;
    margin:20px 0;
    animation:popIn .3s ease;
    text-shadow:0 2px 15px rgba(102,126,234,.4);
}

.visual{
    font-size:1.8rem;
    margin:15px 0;
    line-height:1.6;
    min-height:50px;
    color:rgba(255,255,255,.8);
}

/* Answer options */
.options{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    margin:20px 0;
}

.option{
    background:rgba(255,255,255,.08);
    color:#fff;
    border:2px solid rgba(255,255,255,.15);
    border-radius:16px;
    padding:20px;
    font-size:2rem;
    font-weight:bold;
    cursor:pointer;
    transition:transform .2s,box-shadow .2s,border-color .2s,background .2s;
    box-shadow:0 4px 15px rgba(0,0,0,.2);
}

.option:hover{
    transform:scale(1.05) translateY(-2px);
    border-color:rgba(102,126,234,.5);
    background:rgba(102,126,234,.15);
    box-shadow:0 8px 25px rgba(102,126,234,.3);
}
.option:active{transform:scale(.95)}

.option.correct{
    background:rgba(67,233,123,.2)!important;
    border-color:#43e97b!important;
    color:#43e97b!important;
    box-shadow:0 0 25px rgba(67,233,123,.3)!important;
}

.option.wrong{
    background:rgba(255,82,82,.2)!important;
    border-color:#ff5252!important;
    color:#ff5252!important;
    animation:shake .4s ease;
}

/* Score & streak */
.score-bar{
    display:flex;
    justify-content:center;
    gap:12px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.score-item{
    background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    backdrop-filter:blur(10px);
    padding:8px 16px;
    border-radius:12px;
    font-size:1rem;
    font-weight:bold;
    color:rgba(255,255,255,.8);
}

/* Difficulty */
.difficulty{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
    flex-wrap:wrap;
}

.diff-btn{
    background:rgba(255,255,255,.06);
    color:rgba(255,255,255,.6);
    border:1px solid rgba(255,255,255,.1);
    border-radius:12px;
    padding:8px 14px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:all .2s;
}

.diff-btn:hover{background:rgba(255,255,255,.1);color:#fff}
.diff-btn.active{
    background:rgba(102,126,234,.2);
    border-color:rgba(102,126,234,.5);
    color:#fff;
    box-shadow:0 0 15px rgba(102,126,234,.2);
}

/* Feedback */
.feedback{
    font-size:1.4rem;
    font-weight:bold;
    min-height:40px;
    margin:10px 0;
}

.feedback.correct{color:#43e97b}
.feedback.wrong{color:#ff5252}

/* Floaters */
.floaters{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.floater{position:absolute;opacity:.1;animation:floatAcross linear infinite}
@keyframes floatAcross{from{transform:translateX(-50px) rotate(0deg)}to{transform:translateX(calc(100vw + 50px)) rotate(360deg)}}

/* Particles */
.particle{
    position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;
    opacity:0;pointer-events:none;z-index:0;animation:particleFloat linear infinite;
}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh)}10%{opacity:.3}90%{opacity:.3}100%{opacity:0;transform:translateY(-20px)}}

@keyframes popIn{
    0%{transform:scale(.5);opacity:0}
    60%{transform:scale(1.1)}
    100%{transform:scale(1);opacity:1}
}

@keyframes shake{
    0%,100%{transform:translateX(0)}
    25%{transform:translateX(-8px)}
    75%{transform:translateX(8px)}
}

/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{
    position:absolute;width:10px;height:10px;border-radius:2px;
    animation:confettiFall 1.2s ease forwards;
}
@keyframes confettiFall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}
}

/* Stats panel */
.stats-panel{
    background:rgba(255,255,255,.06);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:24px;
    box-shadow:0 15px 50px rgba(0,0,0,.2);
    text-align:center;
    margin-bottom:20px;
    border:1px solid rgba(255,255,255,.1);
}

.stats-panel h3{
    font-size:1rem;
    color:rgba(255,255,255,.6);
    margin-bottom:15px;
    text-transform:uppercase;
    letter-spacing:1px;
    font-size:12px;
}

.stats-grid{
    display:grid;
    grid-template-columns:1fr 1fr 1fr;
    gap:12px;
    align-items:center;
}

.stat-box{text-align:center}

.stat-number{
    font-size:2rem;
    font-weight:bold;
    color:#fff;
    display:block;
}

.stat-label{
    font-size:.7rem;
    color:rgba(255,255,255,.4);
    text-transform:uppercase;
    letter-spacing:1px;
    font-weight:600;
}

.accuracy-ring{
    position:relative;
    width:80px;
    height:80px;
    margin:0 auto;
}

.accuracy-ring svg{
    transform:rotate(-90deg);
    width:80px;
    height:80px;
}

.accuracy-ring .ring-bg{
    fill:none;
    stroke:rgba(255,255,255,.1);
    stroke-width:8;
}

.accuracy-ring .ring-fill{
    fill:none;
    stroke:#667eea;
    stroke-width:8;
    stroke-linecap:round;
    transition:stroke-dashoffset .5s ease, stroke .3s;
}

.accuracy-text{
    position:absolute;
    top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-size:1.1rem;
    font-weight:bold;
    color:#fff;
}

@media(max-width:400px){
    h1{font-size:2rem;margin-top:40px}
    .problem{font-size:2.5rem}
    .option{font-size:1.5rem;padding:15px}
    .stats-grid{grid-template-columns:1fr}
    .stat-number{font-size:1.6rem}
    .score-item{padding:6px 12px;font-size:.9rem}
}
</style>
</head>

<body>

<div class="bg-glow"></div>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="/kids/">🏝️ Adventure Quest</a>
    <a href="/kids/counting.html">🔢 Counting</a>
    <a href="/kids/learning.html" class="active">📚 Learning</a>
    <a href="/kids/kindness.html">🫂 Be Kind</a>
    <a href="/games/">🎮 Games</a>
    <a href="/sos/">🚨 SOS Police</a>
</div>

<div class="floaters">
    <div class="floater" style="top:12%;animation-duration:22s;font-size:30px">➕</div>
    <div class="floater" style="top:45%;animation-duration:28s;animation-delay:5s;font-size:26px">➖</div>
    <div class="floater" style="top:75%;animation-duration:24s;animation-delay:10s;font-size:28px">✖️</div>
    <div class="floater" style="top:30%;animation-duration:30s;animation-delay:8s;font-size:24px">➗</div>
    <div class="floater" style="top:85%;animation-duration:26s;animation-delay:3s;font-size:30px">✨</div>
    <div class="floater" style="top:60%;animation-duration:34s;animation-delay:12s;font-size:22px">🌟</div>
    <div class="floater" style="top:20%;animation-duration:36s;animation-delay:15s;font-size:20px">💫</div>
</div>

<div class="container">
    <h1>🧮 Maths Fun!</h1>

    <div class="confetti-container" id="confetti"></div>

    <div class="score-bar">
        <span class="score-item">⭐ <span id="score">0</span></span>
        <span class="score-item">🔥 <span id="streak">0</span></span>
        <span class="score-item">✅ <span id="total">0</span>/<span id="attempts">0</span></span>
    </div>

    <div class="difficulty">
        <button class="diff-btn active" onclick="setDifficulty('easy')">😊 Easy</button>
        <button class="diff-btn" onclick="setDifficulty('medium')">🤔 Medium</button>
        <button class="diff-btn" onclick="setDifficulty('hard')">🔥 Hard</button>
        <button class="diff-btn" onclick="setDifficulty('expert')">🧠 Expert</button>
    </div>

    <div class="card">
        <div class="visual" id="visual"></div>
        <div class="problem" id="problem"></div>
        <div class="feedback" id="feedback"></div>
        <div class="options" id="options"></div>
    </div>

    <div class="stats-panel" id="stats-panel">
        <h3>📊 Session Stats</h3>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-number" id="stat-correct">0</span>
                <span class="stat-label">Correct</span>
            </div>
            <div class="stat-box">
                <div class="accuracy-ring">
                    <svg viewBox="0 0 36 36">
                        <circle class="ring-bg" cx="18" cy="18" r="14"/>
                        <circle class="ring-fill" id="ring-fill" cx="18" cy="18" r="14"
                            stroke-dasharray="88" stroke-dashoffset="88"/>
                    </svg>
                    <span class="accuracy-text" id="stat-percent">0%</span>
                </div>
                <span class="stat-label">Accuracy</span>
            </div>
            <div class="stat-box">
                <span class="stat-number" id="stat-attempted">0</span>
                <span class="stat-label">Attempted</span>
            </div>
        </div>
    </div>
</div>

<script>

function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

// Particles
for(let i=0;i<15;i++){
    const p=document.createElement('div');
    p.className='particle';
    p.style.left=Math.random()*100+'%';
    p.style.animationDuration=(8+Math.random()*12)+'s';
    p.style.animationDelay=Math.random()*10+'s';
    p.style.width=(2+Math.random()*3)+'px';
    p.style.height=p.style.width;
    document.body.appendChild(p);
}

let score=0, streak=0, total=0, attempts=0;
let currentAnswer=0;
let difficulty='easy';
let waiting=false;

// --- AUDIO ---
function makeWav(freq,duration,type){
    const sampleRate=8000;
    const samples=Math.floor(sampleRate*duration);
    const buffer=new ArrayBuffer(44+samples*2);
    const view=new DataView(buffer);
    const str=(s,o)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    str('RIFF',0);view.setUint32(4,36+samples*2,true);str('WAVE',8);
    str('fmt ',12);view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
    str('data',36);view.setUint32(40,samples*2,true);
    for(let i=0;i<samples;i++){
        const t=i/sampleRate;
        const env=Math.max(0,1-t/duration);
        let val=type==='sine'?Math.sin(2*Math.PI*freq*t):(Math.sin(2*Math.PI*freq*t)>0?1:-1);
        view.setInt16(44+i*2,val*env*16000,true);
    }
    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}

const correctAudio=new Audio(makeWav(880,.25,'sine'));
const wrongAudio=new Audio(makeWav(200,.2,'square'));

let _iosUnlocked=false;
function iosUnlock(){
    if(_iosUnlocked) return;
    _iosUnlocked=true;
    [correctAudio,wrongAudio].forEach(a=>{
        a.volume=0;
        a.play().then(()=>{a.pause();a.currentTime=0;a.volume=1;}).catch(()=>{});
    });
    setTimeout(()=>{[correctAudio,wrongAudio].forEach(a=>{a.volume=1;});},200);
}
document.addEventListener('touchstart',iosUnlock,{once:true});
document.addEventListener('click',iosUnlock,{once:true});

function playCorrect(){ correctAudio.currentTime=0;correctAudio.play().catch(()=>{}); }
function playWrong(){ wrongAudio.currentTime=0;wrongAudio.play().catch(()=>{}); }

// --- CONFETTI ---
function fireConfetti(){
    const container=document.getElementById('confetti');
    const colors=['#667eea','#764ba2','#fbc2eb','#43e97b','#ffd700','#ff5252'];
    for(let i=0;i<20;i++){
        const piece=document.createElement('div');
        piece.className='confetti-piece';
        piece.style.left=(30+Math.random()*40)+'%';
        piece.style.top=(20+Math.random()*20)+'%';
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.setProperty('--dx',(Math.random()*200-100)+'px');
        piece.style.setProperty('--dy',(Math.random()*300+80)+'px');
        piece.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(piece);
    }
    setTimeout(()=>{container.innerHTML='';},1300);
}

const ranges={
    easy:{max:10,ops:['+']},
    medium:{max:15,ops:['+','-']},
    hard:{max:12,ops:['+','-','×']},
    expert:{max:12,ops:['+','-','×','÷']}
};

function setDifficulty(d){
    difficulty=d;
    document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.diff-btn').forEach(b=>{
        if(b.textContent.toLowerCase().includes(d)) b.classList.add('active');
    });
    newProblem();
}

function rand(min,max){
    return Math.floor(Math.random()*(max-min+1))+min;
}

function newProblem(){
    waiting=false;
    const r=ranges[difficulty];
    const op=r.ops[Math.floor(Math.random()*r.ops.length)];
    let a,b,answer;

    if(op==='+'){
        a=rand(1,r.max);
        b=rand(1,r.max);
        answer=a+b;
    } else if(op==='-'){
        a=rand(2,r.max);
        b=rand(1,a);
        answer=a-b;
    } else if(op==='×'){
        a=rand(1,r.max);
        b=rand(1,10);
        answer=a*b;
    } else if(op==='÷'){
        b=rand(1,10);
        answer=rand(1,r.max);
        a=b*answer;
    }

    currentAnswer=answer;

    // Visual representation
    let vis='';
    if(op==='+' && a<=12 && b<=12){
        vis='🟡'.repeat(a)+' + '+'🟡'.repeat(b);
    } else if(op==='-' && a<=12 && b<=12){
        vis='🔵'.repeat(a)+' - '+'🔵'.repeat(b);
    } else if(op==='×' && a<=6 && b<=6){
        let groups=[];
        for(let i=0;i<b;i++) groups.push('🟢'.repeat(a));
        vis=groups.join(' · ');
    } else if(op==='÷' && a<=20){
        vis='🟠'.repeat(a)+' ÷ '+b;
    }

    document.getElementById('problem').textContent=`${a} ${op} ${b} = ?`;
    document.getElementById('problem').style.animation='none';
    void document.getElementById('problem').offsetWidth;
    document.getElementById('problem').style.animation='popIn .3s ease';
    document.getElementById('visual').textContent=vis;
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='feedback';

    // Generate options
    const options=new Set([answer]);
    while(options.size<4){
        let wrong=answer+rand(-3,3);
        if(wrong<0) wrong=rand(0,answer+5);
        if(wrong!==answer) options.add(wrong);
    }

    const shuffled=[...options].sort(()=>Math.random()-.5);
    const optDiv=document.getElementById('options');
    optDiv.innerHTML=shuffled.map(n=>
        `<button class="option" onclick="check(this,${n})">${n}</button>`
    ).join('');
}

function check(btn,val){
    if(waiting) return;
    waiting=true;
    attempts++;

    if(val===currentAnswer){
        btn.classList.add('correct');
        score++;
        streak++;
        total++;
        playCorrect();
        fireConfetti();
        document.getElementById('feedback').textContent=['🎉 Correct!','⭐ Amazing!','🚀 Great job!','✨ Perfect!'][Math.floor(Math.random()*4)];
        document.getElementById('feedback').className='feedback correct';
    } else {
        btn.classList.add('wrong');
        streak=0;
        playWrong();
        document.querySelectorAll('.option').forEach(o=>{
            if(parseInt(o.textContent)===currentAnswer) o.classList.add('correct');
        });
        document.getElementById('feedback').textContent='❌ Oops! It was '+currentAnswer;
        document.getElementById('feedback').className='feedback wrong';
    }

    document.getElementById('score').textContent=score;
    document.getElementById('streak').textContent=streak;
    document.getElementById('total').textContent=total;
    document.getElementById('attempts').textContent=attempts;
    updateStats();

    setTimeout(newProblem,1500);
}

function updateStats(){
    document.getElementById('stat-correct').textContent=total;
    document.getElementById('stat-attempted').textContent=attempts;
    const pct=attempts>0?Math.round((total/attempts)*100):0;
    document.getElementById('stat-percent').textContent=pct+'%';
    const circumference=88;
    const offset=circumference-((pct/100)*circumference);
    const ring=document.getElementById('ring-fill');
    ring.style.strokeDashoffset=offset;
    if(pct>=80) ring.style.stroke='#43e97b';
    else if(pct>=50) ring.style.stroke='#ffd700';
    else if(attempts>0) ring.style.stroke='#ff5252';
    else ring.style.stroke='#667eea';
}

newProblem();

</script>
</body>
</html>
