<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔴 Pattern Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);background-attachment:fixed;margin:0;padding:15px;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 500px 500px at 40% 30%,rgba(240,100,100,.12) 0%,transparent 70%),radial-gradient(ellipse 400px 400px at 60% 70%,rgba(102,126,234,.12) 0%,transparent 70%);animation:glowShift 8s ease-in-out infinite alternate}
@keyframes glowShift{0%{opacity:.7}100%{opacity:1}}
h1{position:relative;z-index:1;text-align:center;font-size:2.2rem;margin:60px 0 8px;background:linear-gradient(135deg,#fff,#ff9a9e,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.subtitle{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:25px}
.container{max-width:500px;margin:0 auto;position:relative;z-index:1}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:22px;padding:28px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.back-btn{position:fixed;top:15px;right:15px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px;backdrop-filter:blur(10px);transition:transform .2s,background .2s}
.back-btn:hover{transform:scale(1.05);background:rgba(255,255,255,.15)}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:100;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;backdrop-filter:blur(10px);transition:transform .2s}
.menu-toggle:hover{transform:scale(1.1)}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:rgba(15,12,41,.97);backdrop-filter:blur(20px);z-index:99;padding:70px 20px 20px;box-shadow:4px 0 30px rgba(0,0,0,.4);transition:left .3s ease;border-radius:0 20px 20px 0;border-right:1px solid rgba(255,255,255,.1)}
.sidebar.open{left:0}
.sidebar a{display:block;padding:14px 16px;margin:6px 0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;color:rgba(255,255,255,.7);transition:background .2s,color .2s}
.sidebar a:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}

/* Pattern display */
.pattern-row{display:flex;justify-content:center;gap:10px;margin:20px 0;flex-wrap:wrap;align-items:center}
.pattern-item{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05)}
.pattern-item.question{border:2px dashed rgba(255,215,0,.5);background:rgba(255,215,0,.05);font-size:20px;animation:blink 1s ease infinite alternate}
@keyframes blink{from{border-color:rgba(255,215,0,.3)}to{border-color:rgba(255,215,0,.8)}}
.pattern-arrow{color:rgba(255,255,255,.3);font-size:18px}

/* Options */
.options{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:20px 0}
.option{padding:18px;border-radius:14px;font-size:24px;font-weight:bold;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);color:#fff;cursor:pointer;transition:all .2s}
.option:hover{border-color:rgba(102,126,234,.5);background:rgba(102,126,234,.1);transform:scale(1.03)}
.option.correct{background:rgba(67,233,123,.15)!important;border-color:#43e97b!important;color:#43e97b!important}
.option.wrong{background:rgba(255,82,82,.15)!important;border-color:#ff5252!important;color:#ff5252!important;animation:shake .4s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* Score */
.score-bar{display:flex;justify-content:center;gap:20px;margin-bottom:15px;color:rgba(255,255,255,.7);font-size:14px;font-weight:bold}
.score-bar span{background:rgba(255,255,255,.06);padding:6px 14px;border-radius:10px;border:1px solid rgba(255,255,255,.08)}
.feedback{font-size:1.2rem;font-weight:bold;min-height:30px;margin:10px 0}
.feedback.correct{color:#43e97b}
.feedback.wrong{color:#ff5252}
.level-label{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}

/* Player bar */
.player-bar{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 16px;margin-bottom:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:12px;backdrop-filter:blur(10px);
}
.player-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.7)}
.stats-link-sm{
    font-size:12px;font-weight:700;color:#ffd700;text-decoration:none;
    padding:5px 12px;border-radius:8px;
    background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(255,215,0,.15)}

.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

@media(max-width:500px){h1{font-size:1.7rem;margin-top:50px}.card{padding:20px}.pattern-item{width:42px;height:42px;font-size:20px}.option{padding:14px;font-size:20px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<a href="games.html" class="back-btn">← Games</a>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="kids.html">🏝️ Adventure Quest</a>
    <a href="counting.html">🔢 Counting</a>
    <a href="maths.html">🧮 Maths</a>
    <a href="kindness.html">🫂 Be Kind</a>
    <a href="games.html" class="active">🎮 Games</a>
    <a href="sos.html">🚨 SOS Police</a>
</div>

<h1>🔴 Pattern Match</h1>
<p class="subtitle">Find what comes next in the sequence!</p>

<div class="container">
    <div class="player-bar">
        <span class="player-name" id="player-name"></span>
        <a href="stats.html" class="stats-link-sm">🏆 Stats</a>
    </div>
    <div class="score-bar">
        <span>⭐ Score: <strong id="score">0</strong></span>
        <span>🔥 Streak: <strong id="streak">0</strong></span>
        <span>📊 Level: <strong id="level">1</strong></span>
    </div>
    <div class="card">
        <div class="level-label" id="level-label">Number Patterns</div>
        <div class="pattern-row" id="pattern"></div>
        <div class="feedback" id="feedback"></div>
        <div class="options" id="options"></div>
    </div>
</div>

<div class="confetti-container" id="confetti"></div>

<div class="container" style="margin-top:10px">
    <div class="card" style="text-align:center">
        <div style="font-size:12px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="mathrace.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🔢</div><div style="font-size:13px;font-weight:700;color:#fff">Math Race</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Beat the clock</div></a>
            <a href="reaction.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">⚡</div><div style="font-size:13px;font-weight:700;color:#fff">Reaction Speed</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Test reflexes</div></a>
            <a href="wordsearch.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🔤</div><div style="font-size:13px;font-weight:700;color:#fff">Word Search</div><div style="font-size:10px;color:rgba(255,255,255,.4)">Find words</div></a>
        </div>
    </div>
</div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function fireConfetti(){const c=document.getElementById('confetti'),colors=['#667eea','#764ba2','#f093fb','#43e97b','#ffd700'];for(let i=0;i<20;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=(30+Math.random()*40)+'%';p.style.top=(20+Math.random()*30)+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.setProperty('--dx',(Math.random()*200-100)+'px');p.style.setProperty('--dy',(Math.random()*300+80)+'px');c.appendChild(p)}setTimeout(()=>{c.innerHTML=''},1600)}

let score=0,streak=0,level=1,waiting=false;

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function generatePattern(){
    const type=level<=3?'number':level<=5?'shape':'mixed';
    let sequence=[],answer,label='';

    if(type==='number'){
        const patterns=[
            ()=>{const start=rand(1,10),step=rand(1,5);label='Add '+step;return{seq:Array.from({length:5},(_,i)=>start+step*i),ans:start+step*5}},
            ()=>{const start=rand(2,5);label='Multiply by '+start;return{seq:Array.from({length:4},(_,i)=>Math.pow(start,i+1)),ans:Math.pow(start,5)}},
            ()=>{const start=rand(20,50),step=rand(2,6);label='Subtract '+step;return{seq:Array.from({length:5},(_,i)=>start-step*i),ans:start-step*5}},
            ()=>{const start=rand(1,5),step=rand(2,4);label='Add increasing';return{seq:[start,start+step,start+step*2,start+step*3,start+step*4],ans:start+step*5}},
            ()=>{label='Doubles';const s=rand(1,6);return{seq:[s,s*2,s*4,s*8],ans:s*16}},
        ];
        const p=patterns[rand(0,Math.min(patterns.length-1,level))]();
        sequence=p.seq;answer=p.ans;
    } else if(type==='shape'){
        const shapeSets=[
            {seq:['🔴','🔵','🔴','🔵','🔴'],ans:'🔵',label:'Alternating'},
            {seq:['🟢','🟢','🔴','🟢','🟢'],ans:'🔴',label:'Repeating 3'},
            {seq:['⭐','⭐','🌙','⭐','⭐'],ans:'🌙',label:'Repeating 3'},
            {seq:['🔺','🔵','🔺','🔵','🔺'],ans:'🔵',label:'Alternating'},
            {seq:['❤️','💛','💚','❤️','💛'],ans:'💚',label:'Cycle of 3'},
            {seq:['🌟','🌟','⚡','🌟','🌟'],ans:'⚡',label:'Every 3rd'},
            {seq:['🔴','🟠','🟡','🟢','🔵'],ans:'🟣',label:'Rainbow'},
        ];
        const p=shapeSets[rand(0,shapeSets.length-1)];
        sequence=p.seq;answer=p.ans;label=p.label;
    } else {
        const mixedSets=[
            ()=>{const n=rand(1,4);label='Add '+n+' + shapes';return{seq:['🔴',n,'🔵',n+n,'🔴'],ans:n+n+n}},
            ()=>{label='Count up + emoji';return{seq:['1⭐','2⭐','3⭐','4⭐'],ans:'5⭐'}},
            ()=>{const shapes=['🔴','🔵','🟢','🟡','🟣'];label='Growing';return{seq:[shapes[0],shapes.slice(0,2).join(''),shapes.slice(0,3).join('')],ans:shapes.slice(0,4).join('')}},
        ];
        const p=mixedSets[rand(0,mixedSets.length-1)]();
        sequence=p.seq;answer=p.ans;
    }

    return{sequence,answer,label};
}

function generateWrongAnswers(answer){
    const wrongs=new Set();
    if(typeof answer==='number'){
        while(wrongs.size<3){
            const w=answer+rand(-5,5);
            if(w!==answer&&w>=0)wrongs.add(w);
        }
    } else {
        const allOptions=['🔴','🔵','🟢','🟡','🟣','🌙','⭐','⚡','🔺','❤️','💛','💚','🟠'];
        const filtered=allOptions.filter(o=>o!==answer);
        while(wrongs.size<3&&filtered.length>0){
            wrongs.add(filtered.splice(rand(0,filtered.length-1),1)[0]);
        }
    }
    return[...wrongs];
}

function newRound(){
    waiting=false;
    const{sequence,answer,label}=generatePattern();
    
    document.getElementById('level-label').textContent=label;
    document.getElementById('pattern').innerHTML=
        sequence.map(item=>`<span class="pattern-item">${item}</span>`).join('<span class="pattern-arrow">→</span>')
        +'<span class="pattern-arrow">→</span><span class="pattern-item question">?</span>';

    const wrongs=generateWrongAnswers(answer);
    const allOptions=[answer,...wrongs].sort(()=>Math.random()-.5);

    document.getElementById('options').innerHTML=allOptions.map(opt=>
        `<button class="option" onclick="checkAnswer(this,'${opt}','${answer}')">${opt}</button>`
    ).join('');
    document.getElementById('feedback').textContent='';
    document.getElementById('feedback').className='feedback';
}

function checkAnswer(btn,chosen,correct){
    if(waiting)return;
    waiting=true;

    if(String(chosen)===String(correct)){
        btn.classList.add('correct');
        score++;streak++;
        if(streak%5===0&&level<7)level++;
        document.getElementById('feedback').textContent=['✨ Correct!','🎉 Nice!','⭐ Great!','🚀 Amazing!'][rand(0,3)];
        document.getElementById('feedback').className='feedback correct';
        if(streak%3===0)fireConfetti();
    } else {
        btn.classList.add('wrong');
        streak=0;
        document.querySelectorAll('.option').forEach(o=>{if(o.textContent==correct)o.classList.add('correct')});
        document.getElementById('feedback').textContent='❌ It was '+correct;
        document.getElementById('feedback').className='feedback wrong';
    }

    document.getElementById('score').textContent=score;
    document.getElementById('streak').textContent=streak;
    document.getElementById('level').textContent=level;

    setTimeout(newRound,1400);
}

document.getElementById('player-name').textContent='👋 '+(localStorage.getItem('games_player_name')||'Player');
newRound();
</script>
</body>
</html>
