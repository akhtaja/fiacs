<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎨 Build-a-Character</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
    background-attachment:fixed;
    margin:0;padding:15px;min-height:100vh;
}
h1{text-align:center;color:#fff;font-size:2rem;text-shadow:0 2px 10px rgba(0,0,0,.3);margin:60px 0 10px}
.subtitle{text-align:center;color:rgba(255,255,255,.8);font-size:.9rem;margin-bottom:20px}
.card{
    background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-radius:24px;
    padding:30px;margin:0 auto;max-width:600px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.5);
    text-align:center;animation:fadeInUp .5s ease forwards;
}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.character-display{
    width:180px;height:220px;margin:15px auto;position:relative;
    background:linear-gradient(135deg,#e8dfff,#f5f0ff);border-radius:20px;
    display:flex;align-items:center;justify-content:center;
    overflow:visible;border:3px solid #e0d4f5;
}
.char-bg{position:absolute;inset:0;border-radius:20px;opacity:.3;z-index:0}
.char-body{position:relative;z-index:1;font-size:80px}
.char-accessory{position:absolute;font-size:36px}
.char-hat{top:-10px;left:50%;transform:translateX(-50%)}
.char-pet{bottom:5px;right:-15px;font-size:30px}

.category{margin:18px 0 8px;font-size:13px;font-weight:bold;color:#888;text-transform:uppercase;letter-spacing:1px}
.shop{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

.shop-item{
    padding:8px 12px;border-radius:12px;font-size:13px;
    border:2px solid #e0d4f5;background:#fff;cursor:pointer;
    transition:all .2s;
}
.shop-item:hover{border-color:#764ba2;background:#f0e6ff}
.shop-item.owned{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;border-color:#43e97b}
.shop-item.equipped{border-color:#764ba2;box-shadow:0 0 0 3px rgba(118,75,162,.3)}
.shop-item.locked{opacity:.5;cursor:not-allowed}

.info-text{font-size:13px;color:#888;margin:12px 0}
.coins{font-size:16px;color:#667eea;font-weight:bold;margin:10px 0}

/* Fixed back button */
.back-btn{
    position:fixed;top:15px;right:15px;z-index:100;
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 18px;
    background:rgba(255,255,255,.9);
    color:#4a1a7a;
    border-radius:12px;
    text-decoration:none;font-weight:bold;font-size:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    transition:transform .2s, box-shadow .2s;
}
.back-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* Sidebar */
.menu-toggle{position:fixed;top:15px;left:15px;z-index:100;background:rgba(255,255,255,.9);border:none;border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.15);transition:transform .2s}
.menu-toggle:hover{transform:scale(1.1)}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);z-index:99;padding:70px 20px 20px;box-shadow:4px 0 30px rgba(0,0,0,.15);transition:left .3s ease;border-radius:0 20px 20px 0}
.sidebar.open{left:0}
.sidebar a{display:block;padding:14px 16px;margin:6px 0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;color:#4a1a7a;transition:background .2s}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:98;display:none}
.overlay.open{display:block}

@media(max-width:500px){h1{font-size:1.5rem;margin-top:50px}.card{padding:20px}.character-display{width:150px;height:180px}.char-body{font-size:60px}}
</style>
</head>
<body>

<a href="games.html" class="back-btn">← Games</a>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="kids.html">🏝️ Adventure Quest</a>
    <a href="counting.html">🔢 Counting</a>
    <a href="maths.html">🧮 Maths</a>
    <a href="kindness.html">🫂 Be Kind</a>
    <a href="games.html" class="active">🎮 Games</a>
    <a href="sos.html">🚨 SOS Police</a>
</div>

<h1>🎨 Build-a-Character</h1>
<p class="subtitle">Customize your character with cool accessories!</p>

<div class="card">
    <div id="shop-area"></div>
</div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}

// Audio
function makeWav(freq,duration){
    const sr=8000,samples=Math.floor(sr*duration),buffer=new ArrayBuffer(44+samples*2),v=new DataView(buffer);
    const s=(str,o)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
    s('RIFF',0);v.setUint32(4,36+samples*2,true);s('WAVE',8);s('fmt ',12);v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);s('data',36);v.setUint32(40,samples*2,true);
    for(let i=0;i<samples;i++){const t=i/sr;const env=Math.max(0,1-t/duration);
    v.setInt16(44+i*2,Math.sin(2*Math.PI*freq*t)*env*16000,true);}
    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}
const dingAudio=new Audio(makeWav(1000,.25));
const boopAudio=new Audio(makeWav(180,.2));
function playDing(){dingAudio.currentTime=0;dingAudio.play().catch(()=>{});}
function playBoop(){boopAudio.currentTime=0;boopAudio.play().catch(()=>{});}

// Data - uses local coins system (no link to kids.html)
let charData=JSON.parse(localStorage.getItem('quest_character_standalone')||'{}');
let coins=parseInt(localStorage.getItem('quest_character_coins')||'50');

// Shop data
const shop={
    hats:[
        {id:'crown',emoji:'👑',name:'Crown',cost:10},
        {id:'tophat',emoji:'🎩',name:'Top Hat',cost:15},
        {id:'cap',emoji:'🧢',name:'Cap',cost:5},
        {id:'wizard',emoji:'🪄',name:'Wizard Hat',cost:20},
        {id:'flower',emoji:'🌸',name:'Flower',cost:8},
        {id:'star_hat',emoji:'⭐',name:'Star',cost:12}
    ],
    pets:[
        {id:'cat',emoji:'🐱',name:'Cat',cost:10},
        {id:'dog',emoji:'🐶',name:'Puppy',cost:10},
        {id:'bird',emoji:'🦜',name:'Parrot',cost:15},
        {id:'dragon',emoji:'🐲',name:'Dragon',cost:25},
        {id:'bunny',emoji:'🐰',name:'Bunny',cost:8},
        {id:'fish',emoji:'🐠',name:'Fish',cost:5}
    ],
    backgrounds:[
        {id:'rainbow',emoji:'🌈',name:'Rainbow',cost:12,color:'linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1)'},
        {id:'ocean',emoji:'🌊',name:'Ocean',cost:10,color:'linear-gradient(135deg,#667eea,#764ba2)'},
        {id:'forest',emoji:'🌲',name:'Forest',cost:10,color:'linear-gradient(135deg,#43e97b,#38f9d7)'},
        {id:'sunset',emoji:'🌅',name:'Sunset',cost:15,color:'linear-gradient(135deg,#fa709a,#fee140)'},
        {id:'space',emoji:'🚀',name:'Space',cost:20,color:'linear-gradient(135deg,#0c0c2d,#3a1078)'},
        {id:'candy',emoji:'🍭',name:'Candy',cost:8,color:'linear-gradient(135deg,#ff9a9e,#fad0c4)'}
    ]
};

function getData(){
    if(!charData.owned)charData={owned:[],hat:null,pet:null,bg:null};
    return charData;
}
function saveData(){
    localStorage.setItem('quest_character_standalone',JSON.stringify(charData));
    localStorage.setItem('quest_character_coins',coins.toString());
}

function renderShop(){
    const data=getData();
    const bgItem=data.bg?shop.backgrounds.find(b=>b.id===data.bg):null;
    const bgStyle=bgItem?`background:${bgItem.color}`:'';

    let html=`
        <div class="coins">💰 ${coins} coins to spend</div>
        <p class="info-text">You start with 50 coins. Tap items to buy & equip!</p>
        <div class="character-display">
            <div class="char-bg" style="${bgStyle}"></div>
            ${data.hat?`<span class="char-accessory char-hat">${shop.hats.find(h=>h.id===data.hat)?.emoji||''}</span>`:''}
            <span class="char-body">🦁</span>
            ${data.pet?`<span class="char-accessory char-pet">${shop.pets.find(p=>p.id===data.pet)?.emoji||''}</span>`:''}
        </div>`;

    html+=renderSection('🎩 Hats',shop.hats,'hats',data);
    html+=renderSection('🐾 Pets',shop.pets,'pets',data);
    html+=renderSection('🎨 Backgrounds',shop.backgrounds,'backgrounds',data);

    document.getElementById('shop-area').innerHTML=html;
}

function renderSection(title,items,category,data){
    let html=`<div class="category">${title}</div><div class="shop">`;
    items.forEach(item=>{
        const owned=data.owned.includes(item.id);
        const equipped=(category==='hats'&&data.hat===item.id)||(category==='pets'&&data.pet===item.id)||(category==='backgrounds'&&data.bg===item.id);
        let cls='shop-item',label=`${item.emoji} ${item.name} (${item.cost}💰)`,action='';
        if(equipped){cls+=' equipped owned';label=`${item.emoji} ${item.name} ✓`;action=`onclick="unequip('${category}','${item.id}')"`;}
        else if(owned){cls+=' owned';label=`${item.emoji} ${item.name}`;action=`onclick="equip('${category}','${item.id}')"`;}
        else if(coins<item.cost){cls+=' locked';label=`🔒 ${item.name} (${item.cost}💰)`;}
        else{action=`onclick="buy('${category}','${item.id}',${item.cost})"`;} 
        html+=`<button class="${cls}" ${action}>${label}</button>`;
    });
    html+='</div>';return html;
}

function buy(category,itemId,cost){
    if(coins<cost){playBoop();return;}
    const data=getData();
    coins-=cost;
    data.owned.push(itemId);
    if(category==='hats')data.hat=itemId;
    else if(category==='pets')data.pet=itemId;
    else if(category==='backgrounds')data.bg=itemId;
    saveData();playDing();renderShop();
}

function equip(category,itemId){
    const data=getData();
    if(category==='hats')data.hat=itemId;
    else if(category==='pets')data.pet=itemId;
    else if(category==='backgrounds')data.bg=itemId;
    saveData();playDing();renderShop();
}

function unequip(category,itemId){
    const data=getData();
    if(category==='hats')data.hat=null;
    else if(category==='pets')data.pet=null;
    else if(category==='backgrounds')data.bg=null;
    saveData();renderShop();
}

renderShop();
</script>
</body>
</html>
