<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mini Games - Adventure Quest</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
    background-attachment:fixed;
    margin:0;
    padding:15px;
    min-height:100vh;
    overflow-x:hidden;
}

h2{
    text-align:center;
    color:#fff;
    font-size:1.8rem;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
    margin-bottom:15px;
}

/* Floating background */
.floaters{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
}

.floater{
    position:absolute;
    opacity:.2;
    animation: floatAcross linear infinite;
}

@keyframes floatAcross{
    from{transform:translateX(-60px) rotate(0deg)}
    to{transform:translateX(calc(100vw + 60px)) rotate(360deg)}
}

/* Cards */
.card{
    position:relative;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(15px);
    border-radius:24px;
    padding:24px;
    margin:18px auto;
    max-width:700px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
    opacity:0;
    animation: fadeInUp .5s ease forwards;
    z-index:1;
    border:1px solid rgba(255,255,255,.5);
}

.card h3{font-size:1.2rem;color:#4a1a7a;margin-bottom:5px}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

/* Buttons */
button{
    position:relative;overflow:hidden;border:none;border-radius:12px;
    padding:9px 12px;margin:4px;font-size:13px;font-weight:600;
    cursor:pointer;transition:transform .2s, box-shadow .2s;
}
button:hover{transform:scale(1.06) translateY(-1px)}
button:active{transform:scale(.97)}
button::after{
    content:"";position:absolute;top:50%;left:50%;
    width:0;height:0;border-radius:50%;
    background:rgba(255,255,255,.4);transform:translate(-50%,-50%);opacity:0;
}
button.ripple::after{animation:rippleEffect .5s ease}

@keyframes rippleEffect{
    0%{width:0;height:0;opacity:.6}
    100%{width:200px;height:200px;opacity:0}
}

.good{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;box-shadow:0 3px 10px rgba(67,233,123,.25)}
.bad{background:linear-gradient(135deg,#ff5252,#f48fb1);color:#fff;box-shadow:0 3px 10px rgba(255,82,82,.25)}

/* Sidebar menu */
.menu-toggle{
    position:fixed;top:15px;left:15px;z-index:100;
    background:rgba(255,255,255,.9);border:none;border-radius:12px;
    width:44px;height:44px;font-size:22px;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    transition:transform .2s;
}
.menu-toggle:hover{transform:scale(1.1)}

.sidebar{
    position:fixed;top:0;left:-260px;width:250px;height:100%;
    background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
    z-index:99;padding:70px 20px 20px;
    box-shadow:4px 0 30px rgba(0,0,0,.15);
    transition:left .3s ease;border-radius:0 20px 20px 0;
}
.sidebar.open{left:0}
.sidebar a{
    display:block;padding:14px 16px;margin:6px 0;
    border-radius:12px;text-decoration:none;
    font-size:15px;font-weight:600;color:#4a1a7a;
    transition:background .2s;
}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.3);z-index:98;display:none;
}
.overlay.open{display:block}

/* Setup screen */
#setup{
    max-width:420px;
    margin:60px auto;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:40px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    text-align:center;
    animation: fadeInUp .6s ease forwards;
}

#setup h2{
    color:#4a1a7a;
    font-size:2rem;
    margin-bottom:8px;
    text-shadow:none;
}

#setup p{color:#666;margin-bottom:20px}

#setup .start-btn{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    border:none;
    border-radius:16px;
    padding:16px 40px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
    box-shadow:0 8px 25px rgba(118,75,162,.4);
}

/* Mini Games */
.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    margin-top:10px;
}

.game-card{
    background:linear-gradient(135deg,#f5f0ff,#fff);
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    border:2px solid transparent;
    transition:border-color .2s, transform .2s;
    cursor:pointer;
}

.game-card:hover{
    border-color:#764ba2;
    transform:translateY(-3px);
}

.game-card .game-icon{font-size:40px;margin-bottom:8px}
.game-card h4{color:#4a1a7a;margin-bottom:4px;font-size:1rem}
.game-card p{color:#888;font-size:12px;margin:0}

.game-area{
    background:#faf8ff;
    border-radius:18px;
    padding:25px;
    margin-top:12px;
    min-height:200px;
    text-align:center;
}

.game-back-btn{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    padding:10px 20px;
    border-radius:12px;
    font-size:13px;
    margin-bottom:15px;
}

/* Reaction Speed */
.reaction-box{
    width:200px;
    height:200px;
    margin:20px auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
    transition:background .2s, transform .1s;
    user-select:none;
}

.reaction-box.waiting{background:#e74c3c}
.reaction-box.ready{background:#27ae60;animation:pulse .5s ease infinite alternate}
.reaction-box.clicked{background:#3498db}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.05)}
}

.reaction-results{
    margin-top:15px;
    font-size:14px;
    color:#4a1a7a;
}

.reaction-results .best{color:#27ae60;font-weight:bold}

/* Word Scramble */
.scramble-word{
    font-size:2.5rem;
    letter-spacing:8px;
    font-weight:bold;
    color:#764ba2;
    margin:20px 0;
    font-family:monospace;
}

.scramble-input{
    padding:14px 20px;
    font-size:18px;
    border:2px solid #e0d4f5;
    border-radius:14px;
    width:80%;
    max-width:300px;
    text-align:center;
    background:#fff;
    transition:border-color .3s;
}

.scramble-input:focus{
    outline:none;
    border-color:#764ba2;
    box-shadow:0 0 0 4px rgba(118,75,162,.15);
}

.scramble-hint{
    color:#888;
    font-size:13px;
    margin-top:10px;
    font-style:italic;
}

.scramble-score{
    margin-top:15px;
    font-size:14px;
    color:#4a1a7a;
    font-weight:bold;
}

/* Rock Paper Scissors */
.rps-choices{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px 0;
}

.rps-btn{
    width:80px;
    height:80px;
    border-radius:50%;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#f5f0ff,#e8dfff);
    border:3px solid #e0d4f5;
    cursor:pointer;
    transition:transform .2s, border-color .2s, box-shadow .2s;
}

.rps-btn:hover{
    transform:scale(1.15);
    border-color:#764ba2;
    box-shadow:0 6px 20px rgba(118,75,162,.3);
}

.rps-result{
    font-size:1.2rem;
    font-weight:bold;
    margin:15px 0;
    min-height:30px;
}

.rps-result.win{color:#27ae60}
.rps-result.lose{color:#e74c3c}
.rps-result.draw{color:#f39c12}

.rps-scoreboard{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:10px 0;
    font-size:14px;
    color:#4a1a7a;
}

.rps-round{
    display:flex;
    justify-content:center;
    gap:40px;
    font-size:48px;
    margin:15px 0;
    min-height:60px;
    align-items:center;
}

.rps-vs{font-size:18px;font-weight:bold;color:#888}

/* Build-a-Character */
.character-display{
    width:180px;
    height:220px;
    margin:15px auto;
    position:relative;
    background:linear-gradient(135deg,#e8dfff,#f5f0ff);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    overflow:visible;
    border:3px solid #e0d4f5;
}

.char-accessory{
    position:absolute;
    font-size:36px;
}

.char-hat{top:-10px;left:50%;transform:translateX(-50%)}
.char-pet{bottom:5px;right:-15px;font-size:30px}
.char-bg{position:absolute;inset:0;border-radius:20px;opacity:.3;z-index:0}
.char-body{position:relative;z-index:1}

.char-shop{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:15px;
}

.shop-item{
    padding:8px 12px;
    border-radius:12px;
    font-size:13px;
    border:2px solid #e0d4f5;
    background:#fff;
    cursor:pointer;
    transition:all .2s;
}

.shop-item:hover{border-color:#764ba2;background:#f0e6ff}
.shop-item.owned{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;border-color:#43e97b}
.shop-item.equipped{border-color:#764ba2;box-shadow:0 0 0 3px rgba(118,75,162,.3)}
.shop-item.locked{opacity:.5;cursor:not-allowed}

.char-category{
    margin:12px 0 6px;
    font-size:13px;
    font-weight:bold;
    color:#888;
    text-transform:uppercase;
    letter-spacing:1px;
}

.char-points{
    font-size:14px;
    color:#667eea;
    font-weight:bold;
    margin:10px 0;
}

/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}

@keyframes confettiFall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}
}

@media(max-width:500px){
    body{padding:10px}
    .card{padding:16px;margin:12px auto}
    h2{font-size:1.4rem}
    .games-grid{grid-template-columns:1fr}
    .rps-btn{width:65px;height:65px;font-size:28px}
    .reaction-box{width:160px;height:160px}
}
</style>
</head>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="kids.html">🏝️ Adventure Quest</a>
    <a href="counting.html">🔢 Counting</a>

    <a href="games.html" class="active">🎮 Games</a>

</div>

<div class="floaters">
    <div class="floater" style="top:8%;animation-duration:20s;font-size:36px">🎮</div>
    <div class="floater" style="top:25%;animation-duration:28s;animation-delay:4s;font-size:24px">✨</div>
    <div class="floater" style="top:50%;animation-duration:24s;animation-delay:8s;font-size:34px">🕹️</div>
    <div class="floater" style="top:70%;animation-duration:22s;animation-delay:13s;font-size:28px">🏆</div>

    <div class="floater" style="top:88%;animation-duration:26s;animation-delay:10s;font-size:30px">🎯</div>
</div>

    <h2>🎮 Mini Games</h2>
    <p>You need to set up Adventure Quest first to play games!</p>
    <a href="kids.html" class="start-btn" style="display:inline-block;text-decoration:none;color:#fff">🏝️ Go to Adventure Quest</a>
</div>

<div id="game" style="display:none">
    <h2>🕹️ Mini Games</h2>
    <div id="app"></div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>

function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

// --- AUDIO ---
function makeWav(freq, duration, type){
    const sampleRate=8000;
    const samples=Math.floor(sampleRate*duration);
    const buffer=new ArrayBuffer(44+samples*2);
    const view=new DataView(buffer);
    const str=(s,o)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    str('RIFF',0);view.setUint32(4,36+samples*2,true);str('WAVE',8);
    str('fmt ',12);view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
    str('data',36);view.setUint32(40,samples*2,true);
    for(let i=0;i<samples;i++){
        const t=i/sampleRate;
        const env=Math.max(0,1-t/duration);
        let val=0;
        if(type==='sine') val=Math.sin(2*Math.PI*freq*t);
        else if(type==='square') val=Math.sin(2*Math.PI*freq*t)>0?1:-1;
        else val=2*(freq*t%1)-1;
        view.setInt16(44+i*2,val*env*16000,true);
    }
    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}

const dingAudio=new Audio(makeWav(1000,.25,'sine'));
const boopAudio=new Audio(makeWav(180,.2,'square'));
const fanfareAudios=[
    new Audio(makeWav(523,.35,'sine')),
    new Audio(makeWav(659,.35,'sine')),
    new Audio(makeWav(784,.35,'sine')),
    new Audio(makeWav(1047,.4,'sine'))
];

let _iosUnlocked=false;
function iosUnlock(){
    if(_iosUnlocked) return;
    _iosUnlocked=true;
    [dingAudio,boopAudio,...fanfareAudios].forEach(a=>{
        a.volume=0;
        a.play().then(()=>{a.pause();a.currentTime=0;a.volume=1;}).catch(()=>{});
    });
    setTimeout(()=>{
        [dingAudio,boopAudio,...fanfareAudios].forEach(a=>{a.volume=1;});
    },200);
}
document.addEventListener('touchstart',iosUnlock,{once:true});
document.addEventListener('click',iosUnlock,{once:true});

function playDing(){ dingAudio.currentTime=0; dingAudio.play().catch(()=>{}); }
function playBoop(){ boopAudio.currentTime=0; boopAudio.play().catch(()=>{}); }
function playFanfare(){
    fanfareAudios.forEach((a,i)=>{
        setTimeout(()=>{a.currentTime=0;a.play().catch(()=>{});},i*120);
    });
}

// --- CONFETTI ---
function fireConfetti(){
    const container = document.getElementById('confetti');
    const colors = ['#667eea','#764ba2','#f093fb','#43e97b','#ffd700','#ff5252'];
    for(let i=0;i<25;i++){
        const piece = document.createElement('div');
        piece.className='confetti-piece';
        piece.style.left=(30+Math.random()*40)+'%';
        piece.style.top=(20+Math.random()*30)+'%';
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.setProperty('--dx',(Math.random()*250-125)+'px');
        piece.style.setProperty('--dy',(Math.random()*350+100)+'px');
        piece.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(piece);
    }
    setTimeout(()=>{container.innerHTML='';},1600);
}

// --- RIPPLE ---
document.addEventListener('click',function(e){
    const btn=e.target.closest('button');
    if(!btn)return;
    btn.classList.remove('ripple');
    void btn.offsetWidth;
    btn.classList.add('ripple');
    setTimeout(()=>btn.classList.remove('ripple'),500);
});

// --- DATA (shared with Adventure Quest via localStorage) ---
let kids = JSON.parse(localStorage.getItem('quest_kids') || 'null');
let avatars = JSON.parse(localStorage.getItem('quest_avatars') || '{}');
let db, history, streaks;

function todayStr(){ return new Date().toISOString().slice(0,10); }

function allTimeTotal(k){
    let total = db[k] || 0;
    if(history[k]){
        Object.values(history[k]).forEach(v=>{ total += v; });
    }
    const today = todayStr();
    if(history[k] && history[k][today]) total -= history[k][today];
    return total;
}

function updateStreak(k){
    const today = todayStr();
    if(!streaks[k]) streaks[k] = {last:'', count:0};
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(streaks[k].last === today) return;
    if(streaks[k].last === yesterday){
        streaks[k].count++;
    } else if(streaks[k].last !== today){
        streaks[k].count = 1;
    }
    streaks[k].last = today;
    localStorage.setItem('quest_streaks', JSON.stringify(streaks));
}

function recordHistory(k, points){
    const today = todayStr();
    if(!history[k]) history[k] = {};
    history[k][today] = db[k];
    localStorage.setItem('quest_history', JSON.stringify(history));
}

function awardGamePoints(k, pts){
    if(!db[k] && db[k]!==0) return;
    db[k] += pts;
    updateStreak(k);
    recordHistory(k, db[k]);
    localStorage.setItem('quest_data', JSON.stringify(db));
}

// --- INIT ---
function init(){
    if(kids && kids.length >= 2){
        db = JSON.parse(localStorage.getItem('quest_data') || '{}');
        history = JSON.parse(localStorage.getItem('quest_history') || '{}');
        streaks = JSON.parse(localStorage.getItem('quest_streaks') || '{}');
        kids.forEach(k=>{ if(!(k in db)) db[k] = 0; });
        document.getElementById('setup').style.display = 'none';
        document.getElementById('game').style.display = 'block';
        renderMiniGames();
    } else {
        document.getElementById('setup').style.display = 'block';
    }
}

// --- PLAYER SELECTOR ---
function playerSelector(gameId){
    return `<div style="margin:10px 0">
        <label style="font-size:13px;font-weight:bold;color:#4a1a7a">Playing as: </label>
        <select id="${gameId}-player" style="padding:8px 12px;border-radius:10px;border:2px solid #e0d4f5;font-size:14px;background:#fff">
            ${kids.map(k=>`<option value="${k}">${avatars[k]||'⭐'} ${k}</option>`).join('')}
        </select>
    </div>`;
}

function getSelectedPlayer(gameId){
    const sel = document.getElementById(gameId+'-player');
    return sel ? sel.value : kids[0];
}

// --- GAMES MENU ---
function renderMiniGames(){
    let out = `<div class="card"><h3>🕹️ Choose a Game</h3>
        <p style="color:#666;font-size:13px;margin-bottom:15px">Play games to earn bonus points for Adventure Quest!</p>
        <div class="games-grid">
            <div class="game-card" onclick="openGame('reaction')">
                <div class="game-icon">⚡</div>
                <h4>Reaction Speed</h4>
                <p>Tap as fast as you can!</p>
            </div>
            <div class="game-card" onclick="openGame('scramble')">
                <div class="game-icon">🔤</div>
                <h4>Word Scramble</h4>
                <p>Unscramble the letters</p>
            </div>
            <div class="game-card" onclick="openGame('rps')">
                <div class="game-icon">✊</div>
                <h4>Rock Paper Scissors</h4>
                <p>Best of 5 vs computer</p>
            </div>
            <div class="game-card" onclick="openGame('character')">
                <div class="game-icon">🎨</div>
                <h4>Build-a-Character</h4>
                <p>Customize your avatar!</p>
            </div>
        </div>
    </div>`;
    document.getElementById("app").innerHTML = out;
}

function openGame(game){
    if(game==='reaction') renderReactionGame();
    else if(game==='scramble') renderScrambleGame();
    else if(game==='rps') renderRPSGame();
    else if(game==='character') renderCharacterGame();
}

// ============================
// 1. REACTION SPEED GAME
// ============================
let reactionState = 'idle';
let reactionTimeout = null;
let reactionStartTime = 0;
let reactionBest = JSON.parse(localStorage.getItem('quest_reaction_best')||'{}');

function renderReactionGame(){
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>⚡ Reaction Speed</h3>
        <p style="color:#666;font-size:13px">When the circle turns <strong style="color:#27ae60">GREEN</strong>, tap it as fast as you can!</p>
        ${playerSelector('reaction')}
        <div class="reaction-box waiting" id="reaction-circle" onclick="reactionClick()">
            Tap to Start
        </div>
        <div class="reaction-results" id="reaction-results">
            ${renderReactionBests()}
        </div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    reactionState = 'idle';
}

function renderReactionBests(){
    let html = '';
    kids.forEach(k=>{
        if(reactionBest[k]){
            html += `<div>${avatars[k]||'⭐'} ${k}: <span class="best">${reactionBest[k]}ms</span></div>`;
        }
    });
    return html || '<div style="color:#888">No records yet!</div>';
}

function reactionClick(){
    const circle = document.getElementById('reaction-circle');
    const results = document.getElementById('reaction-results');

    if(reactionState === 'idle'){
        reactionState = 'waiting';
        circle.className = 'reaction-box waiting';
        circle.textContent = 'Wait for green...';
        const delay = 1500 + Math.random() * 3000;
        reactionTimeout = setTimeout(()=>{
            reactionState = 'ready';
            reactionStartTime = Date.now();
            circle.className = 'reaction-box ready';
            circle.textContent = 'TAP NOW!';
        }, delay);
    } else if(reactionState === 'waiting'){
        clearTimeout(reactionTimeout);
        circle.className = 'reaction-box clicked';
        circle.textContent = '❌ Too early! Tap to retry';
        playBoop();
        reactionState = 'idle';
    } else if(reactionState === 'ready'){
        const time = Date.now() - reactionStartTime;
        const player = getSelectedPlayer('reaction');
        circle.className = 'reaction-box clicked';
        circle.textContent = time + 'ms!';
        playDing();

        if(!reactionBest[player] || time < reactionBest[player]){
            reactionBest[player] = time;
            localStorage.setItem('quest_reaction_best', JSON.stringify(reactionBest));
            circle.textContent = time + 'ms! 🎉 New Best!';
            playFanfare();
            fireConfetti();
        }

        let pts = 0;
        if(time < 250) pts = 3;
        else if(time < 400) pts = 2;
        else if(time < 600) pts = 1;

        if(pts > 0){
            awardGamePoints(player, pts);
            results.innerHTML = `<div style="color:#27ae60;font-weight:bold;margin-bottom:8px">+${pts}⭐ for ${player}!</div>` + renderReactionBests();
        } else {
            results.innerHTML = renderReactionBests();
        }

        reactionState = 'idle';
        setTimeout(()=>{
            circle.className = 'reaction-box waiting';
            circle.textContent = 'Tap to Play Again';
        }, 1500);
    }
}

// 2. WORD SCRAMBLE GAME
// ============================
const scrambleWords = [
    {word:'KINDNESS', hint:'Being nice to others'},
    {word:'PATIENCE', hint:'Waiting calmly'},
    {word:'HONESTY', hint:'Always telling the truth'},
    {word:'COURAGE', hint:'Being brave'},
    {word:'RESPECT', hint:'Treating others well'},
    {word:'SHARING', hint:'Giving to others'},
    {word:'HELPFUL', hint:'Lending a hand'},
    {word:'POLITE', hint:'Good manners'},
    {word:'GENTLE', hint:'Soft and careful'},
    {word:'FRIEND', hint:'Someone you play with'},
    {word:'CLEAN', hint:'Tidy and neat'},
    {word:'LISTEN', hint:'Using your ears'},
    {word:'PRAYER', hint:'Talking to Allah'},
    {word:'FAMILY', hint:'People you love at home'},
    {word:'SMILE', hint:'A happy face'},
    {word:'THANKS', hint:'Being grateful'},
    {word:'BRAVE', hint:'Not afraid'},
    {word:'TRUTH', hint:'What is real and honest'}
];

let scrambleCurrent = null;
let scrambleScore = 0;
let scrambleUsed = [];

function renderScrambleGame(){
    scrambleScore = 0;
    scrambleUsed = [];
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>🔤 Word Scramble</h3>
        <p style="color:#666;font-size:13px">Unscramble the word! Earn points for good character traits.</p>
        ${playerSelector('scramble')}
        <div id="scramble-area"></div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    nextScrambleWord();
}

function shuffleWord(word){
    let arr = word.split('');
    for(let i = arr.length-1; i > 0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    if(arr.join('')===word && word.length>1) return shuffleWord(word);
    return arr.join('');
}

function nextScrambleWord(){
    const available = scrambleWords.filter(w => !scrambleUsed.includes(w.word));
    if(available.length === 0){
        document.getElementById('scramble-area').innerHTML = `
            <div style="margin:30px 0">
                <div style="font-size:48px;margin-bottom:10px">🎉</div>
                <h4>All words complete!</h4>
                <div class="scramble-score">Final Score: ${scrambleScore} words solved</div>
                <button class="good" onclick="scrambleScore=0;scrambleUsed=[];nextScrambleWord()" style="margin-top:15px">🔄 Play Again</button>
            </div>`;
        return;
    }
    scrambleCurrent = available[Math.floor(Math.random()*available.length)];
    const scrambled = shuffleWord(scrambleCurrent.word);

    document.getElementById('scramble-area').innerHTML = `
        <div class="scramble-word">${scrambled}</div>
        <input type="text" class="scramble-input" id="scramble-guess"
            placeholder="Type the word..." maxlength="${scrambleCurrent.word.length}"
            onkeyup="checkScrambleGuess(event)" autocomplete="off" autocapitalize="characters">
        <div class="scramble-hint">💡 Hint: ${scrambleCurrent.hint}</div>
        <div class="scramble-score">Solved: ${scrambleScore} | Remaining: ${available.length}</div>
        <button class="bad" onclick="skipScrambleWord()" style="margin-top:10px;font-size:12px">Skip →</button>
    `;
    document.getElementById('scramble-guess').focus();
}

function checkScrambleGuess(e){
    const guess = document.getElementById('scramble-guess').value.toUpperCase().trim();
    if(guess === scrambleCurrent.word){
        playDing();
        scrambleScore++;
        scrambleUsed.push(scrambleCurrent.word);

        const player = getSelectedPlayer('scramble');
        awardGamePoints(player, 2);

        document.getElementById('scramble-area').innerHTML = `
            <div style="font-size:48px;margin:20px 0">✅</div>
            <h4 style="color:#27ae60">Correct! "${scrambleCurrent.word}"</h4>
            <div style="color:#27ae60;font-weight:bold">+2⭐ for ${player}!</div>
            <div class="scramble-score">Solved: ${scrambleScore}</div>
        `;
        fireConfetti();
        setTimeout(nextScrambleWord, 1500);
    }
}

function skipScrambleWord(){
    playBoop();
    scrambleUsed.push(scrambleCurrent.word);
    document.getElementById('scramble-area').innerHTML = `
        <div style="font-size:48px;margin:20px 0">⏭️</div>
        <h4>The word was: <strong style="color:#764ba2">${scrambleCurrent.word}</strong></h4>
    `;
    setTimeout(nextScrambleWord, 1200);
}

// ============================
// 3. ROCK PAPER SCISSORS
// ============================
let rpsPlayerScore = 0;
let rpsComputerScore = 0;
let rpsRound = 0;
const rpsBestOf = 5;
const rpsChoices = ['🪨','📄','✂️'];

function renderRPSGame(){
    rpsPlayerScore = 0;
    rpsComputerScore = 0;
    rpsRound = 0;
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>✊ Rock Paper Scissors</h3>
        <p style="color:#666;font-size:13px">Best of ${rpsBestOf} — beat the computer to earn points!</p>
        ${playerSelector('rps')}
        <div id="rps-area">
            <div class="rps-scoreboard">
                <span>You: <strong id="rps-p-score">0</strong></span>
                <span>Round: <strong id="rps-round">0</strong>/${rpsBestOf}</span>
                <span>Computer: <strong id="rps-c-score">0</strong></span>
            </div>
            <div class="rps-round" id="rps-display">
                <span>❓</span>
                <span class="rps-vs">VS</span>
                <span>❓</span>
            </div>
            <div class="rps-result" id="rps-result">Choose your weapon!</div>
            <div class="rps-choices">
                <button class="rps-btn" onclick="playRPS(0)">🪨</button>
                <button class="rps-btn" onclick="playRPS(1)">📄</button>
                <button class="rps-btn" onclick="playRPS(2)">✂️</button>
            </div>
        </div>
    </div>`;
    document.getElementById("app").innerHTML = out;
}

function playRPS(playerChoice){
    if(rpsRound >= rpsBestOf) return;

    const computerChoice = Math.floor(Math.random()*3);
    rpsRound++;

    let result;
    if(playerChoice === computerChoice){
        result = 'draw';
    } else if(
        (playerChoice===0 && computerChoice===2)||
        (playerChoice===1 && computerChoice===0)||
        (playerChoice===2 && computerChoice===1)
    ){
        result = 'win';
        rpsPlayerScore++;
    } else {
        result = 'lose';
        rpsComputerScore++;
    }

    document.getElementById('rps-display').innerHTML = `
        <span style="font-size:48px">${rpsChoices[playerChoice]}</span>
        <span class="rps-vs">VS</span>
        <span style="font-size:48px">${rpsChoices[computerChoice]}</span>
    `;

    const resultEl = document.getElementById('rps-result');
    if(result==='win'){ resultEl.className='rps-result win'; resultEl.textContent='You win this round! 🎉'; playDing(); }
    else if(result==='lose'){ resultEl.className='rps-result lose'; resultEl.textContent='Computer wins! 😤'; playBoop(); }
    else{ resultEl.className='rps-result draw'; resultEl.textContent='Draw! 🤝'; }

    document.getElementById('rps-p-score').textContent = rpsPlayerScore;
    document.getElementById('rps-c-score').textContent = rpsComputerScore;
    document.getElementById('rps-round').textContent = rpsRound;

    if(rpsRound >= rpsBestOf){
        setTimeout(()=>{
            const player = getSelectedPlayer('rps');
            let pts = 0;
            let msg = '';
            if(rpsPlayerScore > rpsComputerScore){
                pts = 3;
                msg = `🏆 You won ${rpsPlayerScore}-${rpsComputerScore}! +${pts}⭐ for ${player}!`;
                playFanfare();
                fireConfetti();
            } else if(rpsPlayerScore < rpsComputerScore){
                msg = `😢 Computer won ${rpsComputerScore}-${rpsPlayerScore}. Better luck next time!`;
            } else {
                pts = 1;
                msg = `🤝 It's a tie! +${pts}⭐ for ${player}!`;
            }
            if(pts > 0) awardGamePoints(player, pts);
            resultEl.innerHTML = `${msg}<br><button class="good" onclick="renderRPSGame()" style="margin-top:10px">🔄 Play Again</button>`;
        }, 800);
    }
}

// 4. BUILD-A-CHARACTER
// ============================
let charData = JSON.parse(localStorage.getItem('quest_character')||'{}');

const charShop = {
    hats: [
        {id:'crown', emoji:'👑', name:'Crown', cost:10},
        {id:'tophat', emoji:'🎩', name:'Top Hat', cost:15},
        {id:'cap', emoji:'🧢', name:'Cap', cost:5},
        {id:'wizard', emoji:'🪄', name:'Wizard Hat', cost:20},
        {id:'flower', emoji:'🌸', name:'Flower', cost:8},
        {id:'star_hat', emoji:'⭐', name:'Star', cost:12}
    ],
    pets: [
        {id:'cat', emoji:'🐱', name:'Cat', cost:10},
        {id:'dog', emoji:'🐶', name:'Puppy', cost:10},
        {id:'bird', emoji:'🦜', name:'Parrot', cost:15},
        {id:'dragon', emoji:'🐲', name:'Dragon', cost:25},
        {id:'bunny', emoji:'🐰', name:'Bunny', cost:8},
        {id:'fish', emoji:'🐠', name:'Fish', cost:5}
    ],
    backgrounds: [
        {id:'rainbow', emoji:'🌈', name:'Rainbow', cost:12, color:'linear-gradient(135deg,#ff9a9e,#fecfef,#a18cd1)'},
        {id:'ocean', emoji:'🌊', name:'Ocean', cost:10, color:'linear-gradient(135deg,#667eea,#764ba2)'},
        {id:'forest', emoji:'🌲', name:'Forest', cost:10, color:'linear-gradient(135deg,#43e97b,#38f9d7)'},
        {id:'sunset', emoji:'🌅', name:'Sunset', cost:15, color:'linear-gradient(135deg,#fa709a,#fee140)'},
        {id:'space', emoji:'🚀', name:'Space', cost:20, color:'linear-gradient(135deg,#0c0c2d,#3a1078)'},
        {id:'candy', emoji:'🍭', name:'Candy', cost:8, color:'linear-gradient(135deg,#ff9a9e,#fad0c4)'}
    ]
};

function getCharData(player){
    if(!charData[player]) charData[player] = {owned:[], hat:null, pet:null, bg:null};
    return charData[player];
}

function saveCharData(){
    localStorage.setItem('quest_character', JSON.stringify(charData));
}

function renderCharacterGame(){
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>🎨 Build-a-Character</h3>
        <p style="color:#666;font-size:13px">Spend your all-time points to buy accessories!</p>
        ${playerSelector('character')}
        <button class="good" onclick="renderCharacterShop()" style="margin-top:5px;font-size:13px">🔄 Refresh</button>
        <div id="character-area"></div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    renderCharacterShop();
}

function renderCharacterShop(){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    const totalPts = allTimeTotal(player);

    let spent = 0;
    data.owned.forEach(itemId=>{
        Object.values(charShop).forEach(category=>{
            const item = category.find(i=>i.id===itemId);
            if(item) spent += item.cost;
        });
    });
    const available = totalPts - spent;

    const avatar = avatars[player] || '🦁';
    const bgItem = data.bg ? charShop.backgrounds.find(b=>b.id===data.bg) : null;
    const bgStyle = bgItem ? `background:${bgItem.color}` : '';

    let charHTML = `
        <div class="char-points">${avatars[player]||'⭐'} ${player} — 💰 ${available} points to spend (${totalPts} earned total)</div>
        <div class="character-display">
            <div class="char-bg" style="${bgStyle}"></div>
            ${data.hat ? `<span class="char-accessory char-hat">${charShop.hats.find(h=>h.id===data.hat)?.emoji||''}</span>` : ''}
            <span class="char-body" style="font-size:80px">${avatar}</span>
            ${data.pet ? `<span class="char-accessory char-pet">${charShop.pets.find(p=>p.id===data.pet)?.emoji||''}</span>` : ''}
        </div>
    `;

    charHTML += renderShopSection('🎩 Hats', charShop.hats, 'hats', data, available);
    charHTML += renderShopSection('🐾 Pets', charShop.pets, 'pets', data, available);
    charHTML += renderShopSection('🎨 Backgrounds', charShop.backgrounds, 'backgrounds', data, available);

    document.getElementById('character-area').innerHTML = charHTML;
}

function renderShopSection(title, items, category, data, available){
    let html = `<div class="char-category">${title}</div><div class="char-shop">`;
    items.forEach(item=>{
        const owned = data.owned.includes(item.id);
        const equipped = (category==='hats'&&data.hat===item.id) ||
                        (category==='pets'&&data.pet===item.id) ||
                        (category==='backgrounds'&&data.bg===item.id);
        const canAfford = available >= item.cost;

        let cls = 'shop-item';
        let label = `${item.emoji} ${item.name} (${item.cost}⭐)`;
        let action = '';

        if(equipped){
            cls += ' equipped owned';
            label = `${item.emoji} ${item.name} ✓`;
            action = `onclick="unequipItem('${category}','${item.id}')"`;
        } else if(owned){
            cls += ' owned';
            label = `${item.emoji} ${item.name}`;
            action = `onclick="equipItem('${category}','${item.id}')"`;
        } else if(!canAfford){
            cls += ' locked';
            label = `🔒 ${item.name} (${item.cost}⭐)`;
        } else {
            action = `onclick="buyItem('${category}','${item.id}','${item.cost}')"`;
        }

        html += `<button class="${cls}" ${action}>${label}</button>`;
    });
    html += `</div>`;
    return html;
}

function buyItem(category, itemId, cost){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    const totalPts = allTimeTotal(player);
    let spent = 0;
    data.owned.forEach(id=>{
        Object.values(charShop).forEach(cat=>{
            const item = cat.find(i=>i.id===id);
            if(item) spent += item.cost;
        });
    });
    const available = totalPts - spent;

    if(available < cost){ playBoop(); return; }

    data.owned.push(itemId);
    if(category==='hats') data.hat = itemId;
    else if(category==='pets') data.pet = itemId;
    else if(category==='backgrounds') data.bg = itemId;

    saveCharData();
    playDing();
    renderCharacterShop();
}

function equipItem(category, itemId){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    if(category==='hats') data.hat = itemId;
    else if(category==='pets') data.pet = itemId;
    else if(category==='backgrounds') data.bg = itemId;
    saveCharData();
    playDing();
    renderCharacterShop();
}

function unequipItem(category, itemId){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    if(category==='hats') data.hat = null;
    else if(category==='pets') data.pet = null;
    else if(category==='backgrounds') data.bg = null;
    saveCharData();
    renderCharacterShop();
}

init();

</script>
