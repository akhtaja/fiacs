<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🃏 Memory Match</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f5576c 100%);
    background-attachment:fixed;
    margin:0;padding:15px;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
}

h1{
    color:#fff;font-size:1.8rem;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
    margin:60px 0 10px;text-align:center;
}

.info{
    color:rgba(255,255,255,.85);
    font-size:14px;margin-bottom:15px;text-align:center;
}

.controls{
    display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center;
}

.controls button{
    background:rgba(255,255,255,.9);
    border:none;border-radius:12px;
    padding:10px 18px;font-size:14px;font-weight:bold;
    color:#4a1a7a;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    transition:transform .2s;
}
.controls button:hover{transform:scale(1.05)}
.controls button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}

.stats{
    display:flex;gap:20px;margin-bottom:15px;
    color:#fff;font-weight:bold;font-size:14px;
    text-shadow:0 1px 4px rgba(0,0,0,.3);
}

.grid{
    display:grid;
    gap:10px;
    max-width:500px;
    width:100%;
}

.grid-4{grid-template-columns:repeat(4,1fr)}
.grid-6{grid-template-columns:repeat(4,1fr)}
.grid-8{grid-template-columns:repeat(4,1fr)}

.card{
    aspect-ratio:1;
    border-radius:14px;
    cursor:pointer;
    position:relative;
    transform-style:preserve-3d;
    transition:transform .4s ease;
}

.card.flipped{
    transform:rotateY(180deg);
}

.card.matched{
    animation:matchPop .4s ease;
}

.card-face{
    position:absolute;top:0;left:0;width:100%;height:100%;
    border-radius:14px;
    display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;
}

.card-front{
    background:linear-gradient(135deg,#667eea,#764ba2);
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    font-size:28px;
    color:rgba(255,255,255,.5);
}

.card-front::after{
    content:'?';
    font-size:32px;
    font-weight:bold;
}

.card-back{
    background:#fff;
    transform:rotateY(180deg);
    font-size:clamp(28px,8vw,48px);
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    border:3px solid #e0d4f5;
}

.card.matched .card-back{
    border-color:#43e97b;
    background:linear-gradient(135deg,#d4edda,#fff);
}

@keyframes matchPop{
    0%{transform:rotateY(180deg) scale(1)}
    50%{transform:rotateY(180deg) scale(1.15)}
    100%{transform:rotateY(180deg) scale(1)}
}

/* Win overlay */
.win-msg{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.7);
    display:none;align-items:center;justify-content:center;
    z-index:50;flex-direction:column;
}

.win-msg.show{display:flex}

.win-box{
    background:#fff;border-radius:24px;
    padding:40px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    animation:fadeInUp .5s ease;
}

.win-box h2{font-size:2rem;color:#4a1a7a;margin-bottom:10px}
.win-box p{color:#666;margin-bottom:20px;font-size:16px}
.win-box button{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;border:none;border-radius:14px;
    padding:14px 30px;font-size:16px;font-weight:bold;
    cursor:pointer;transition:transform .2s;margin:5px;
}
.win-box button:hover{transform:scale(1.05)}

/* Back link */
.back-link{
    position:fixed;top:15px;right:15px;z-index:100;
    background:rgba(255,255,255,.9);
    border-radius:12px;padding:10px 16px;
    text-decoration:none;font-size:14px;font-weight:bold;
    color:#4a1a7a;box-shadow:0 4px 15px rgba(0,0,0,.1);
    transition:transform .2s;
}
.back-link:hover{transform:scale(1.05)}

/* Sidebar */
.menu-toggle{
    position:fixed;top:15px;left:15px;z-index:100;
    background:rgba(255,255,255,.9);border:none;border-radius:12px;
    width:44px;height:44px;font-size:22px;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.15);transition:transform .2s;
}
.menu-toggle:hover{transform:scale(1.1)}

.sidebar{
    position:fixed;top:0;left:-260px;width:250px;height:100%;
    background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
    z-index:99;padding:70px 20px 20px;
    box-shadow:4px 0 30px rgba(0,0,0,.15);
    transition:left .3s ease;border-radius:0 20px 20px 0;
}
.sidebar.open{left:0}
.sidebar a{
    display:block;padding:14px 16px;margin:6px 0;
    border-radius:12px;text-decoration:none;
    font-size:15px;font-weight:600;color:#4a1a7a;
    transition:background .2s;
}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.3);z-index:98;display:none;
}
.overlay.open{display:block}

/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}
@keyframes confettiFall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}
}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:500px){
    h1{font-size:1.4rem;margin-top:50px}
    .grid{gap:6px}
}

/* Player bar */
.player-bar{
    position:fixed;bottom:15px;left:15px;z-index:100;
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);
    border-radius:12px;backdrop-filter:blur(10px);
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}
.player-name{font-size:12px;font-weight:600;color:#4a1a7a}
.player-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(118,75,162,.1);border:1px solid rgba(118,75,162,.15);flex-shrink:0}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.stats-link-sm{
    font-size:11px;font-weight:700;color:#764ba2;text-decoration:none;
    padding:4px 10px;border-radius:8px;
    background:rgba(118,75,162,.08);border:1px solid rgba(118,75,162,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(118,75,162,.15)}
.xp-badge{font-size:10px;font-weight:800;color:#d4a000;background:rgba(212,160,0,.08);border:1px solid rgba(212,160,0,.2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.xp-bar-wrap{width:50px;height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;flex-shrink:0}
.xp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd700,#ffaa00);transition:width .3s ease;width:0%}

/* Theme toggle */
.theme-toggle{position:fixed;top:15px;right:120px;z-index:100;padding:8px 14px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:#666;transition:all .2s;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.theme-toggle:hover{transform:scale(1.05);color:#4a1a7a}
body.light-theme{background:linear-gradient(135deg,#f5f7fa 0%,#e8edf5 50%,#f0e6ff 100%)}
body.light-theme h1{color:#4a1a7a;text-shadow:none}
body.light-theme .info{color:#666}
body.light-theme .menu-toggle{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);box-shadow:0 2px 10px rgba(0,0,0,.08)}
body.light-theme .sidebar{background:rgba(255,255,255,.98);border-right-color:rgba(0,0,0,.06)}
body.light-theme .sidebar a{color:#4a1a7a}
body.light-theme .sidebar a:hover{background:#f0e6ff}
</style>
</head>
<body>

<div class="player-bar">
    <span class="player-avatar" id="player-avatar"></span>
    <span class="player-name" id="player-name"></span>
    <span class="xp-badge" id="xp-badge">Lv 1</span>
    <span class="xp-bar-wrap"><span class="xp-bar-fill" id="xp-bar-fill"></span></span>
    <a href="/games/stats.html" class="stats-link-sm">🏆 Stats</a>
</div>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️ Light</button>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="/kids/">🏝️ Adventure Quest</a>
    <a href="/kids/counting.html">🔢 Counting</a>
    <a href="/kids/learning.html">📚 Learning</a>
    <a href="/kids/kindness.html">🫂 Be Kind</a>
    <a href="/games/" class="active">🎮 Games</a>
    <a href="/sos/">🚨 SOS Police</a>
</div>

<a href="/games/" class="back-link">← Games</a>

<h1>🃏 Memory Match</h1>
<p class="info">Flip the cards and find all matching pairs!</p>

<div class="controls">
    <button class="active" onclick="setLevel(4)">Easy (4 pairs)</button>
    <button onclick="setLevel(6)">Medium (6 pairs)</button>
    <button onclick="setLevel(8)">Hard (8 pairs)</button>
    <button onclick="newGame()">🔄 New Game</button>
</div>

<div class="stats">
    <span>Moves: <span id="moves">0</span></span>
    <span>Pairs: <span id="pairs">0</span>/<span id="totalPairs">4</span></span>
    <span>⏱️ <span id="timer">0:00</span></span>
</div>

<div class="grid" id="grid"></div>

<div class="win-msg" id="winMsg">
    <div class="win-box">
        <h2>🎉 All Pairs Found!</h2>
        <p id="winText"></p>
        <button onclick="newGame()">Play Again</button>
        <button onclick="location.href='games.html'" style="background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a">← Games</button>
    </div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

const emojiSets=[
    '🦁','🐸','🦄','🐱','🐶','🦊','🐼','🐨',
    '🦋','🐯','🐙','🦀','🐬','🦜','🐢','🦩',
    '🌸','🌻','🍎','🍕','⭐','🎈','🚀','🎸'
];

let numPairs=4;
let cards=[];
let flipped=[];
let matched=[];
let moves=0;
let timerInterval=null;
let seconds=0;
let gameStarted=false;
let locked=false;

function setLevel(pairs){
    numPairs=pairs;
    document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.controls button').forEach(b=>{
        if(b.textContent.includes(pairs+' pairs')) b.classList.add('active');
    });
    newGame();
}

function newGame(){
    clearInterval(timerInterval);
    timerInterval=null;
    seconds=0;moves=0;
    flipped=[];matched=[];
    gameStarted=false;locked=false;

    document.getElementById('moves').textContent='0';
    document.getElementById('pairs').textContent='0';
    document.getElementById('totalPairs').textContent=numPairs;
    document.getElementById('timer').textContent='0:00';
    document.getElementById('winMsg').classList.remove('show');

    // Pick random emojis
    const shuffledEmojis=shuffleArray([...emojiSets]).slice(0,numPairs);
    cards=shuffleArray([...shuffledEmojis,...shuffledEmojis]);

    renderGrid();
}

function renderGrid(){
    const grid=document.getElementById('grid');
    grid.className='grid';

    if(numPairs<=4) grid.classList.add('grid-4');
    else if(numPairs<=6) grid.classList.add('grid-6');
    else grid.classList.add('grid-8');

    grid.innerHTML=cards.map((emoji,i)=>`
        <div class="card" onclick="flipCard(${i})" id="card-${i}">
            <div class="card-face card-front"></div>
            <div class="card-face card-back">${emoji}</div>
        </div>
    `).join('');
}

function flipCard(idx){
    if(locked) return;
    if(flipped.includes(idx)) return;
    if(matched.includes(idx)) return;

    if(!gameStarted){
        gameStarted=true;
        startTimer();
    }

    flipped.push(idx);
    document.getElementById('card-'+idx).classList.add('flipped');

    if(flipped.length===2){
        moves++;
        document.getElementById('moves').textContent=moves;
        locked=true;

        const [a,b]=flipped;
        if(cards[a]===cards[b]){
            // Match!
            matched.push(a,b);
            document.getElementById('card-'+a).classList.add('matched');
            document.getElementById('card-'+b).classList.add('matched');
            document.getElementById('pairs').textContent=matched.length/2;
            flipped=[];
            locked=false;

            if(matched.length===cards.length){
                // Win!
                clearInterval(timerInterval);
                // Track stats
                const ms=JSON.parse(localStorage.getItem('memory_stats')||'{"gamesWon":0,"bestMoves":null,"bestTime":null}');
                ms.gamesWon++;
                if(!ms.bestMoves||moves<ms.bestMoves)ms.bestMoves=moves;
                if(!ms.bestTime||seconds<ms.bestTime)ms.bestTime=seconds;
                localStorage.setItem('memory_stats',JSON.stringify(ms));
                earnXP(20);

                setTimeout(()=>{
                    fireConfetti();
                    document.getElementById('winText').textContent=
                        `Completed in ${moves} moves and ${formatTime(seconds)}! 🌟`;
                    document.getElementById('winMsg').classList.add('show');
                },500);
            }
        } else {
            // No match - flip back
            setTimeout(()=>{
                document.getElementById('card-'+a).classList.remove('flipped');
                document.getElementById('card-'+b).classList.remove('flipped');
                flipped=[];
                locked=false;
            },800);
        }
    }
}

function startTimer(){
    timerInterval=setInterval(()=>{
        seconds++;
        document.getElementById('timer').textContent=formatTime(seconds);
    },1000);
}

function formatTime(s){
    const m=Math.floor(s/60);
    const sec=s%60;
    return m+':'+(sec<10?'0':'')+sec;
}

function shuffleArray(arr){
    for(let i=arr.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [arr[i],arr[j]]=[arr[j],arr[i]];
    }
    return arr;
}

function fireConfetti(){
    const container=document.getElementById('confetti');
    const colors=['#667eea','#764ba2','#f093fb','#43e97b','#ffd700','#ff5252'];
    for(let i=0;i<30;i++){
        const piece=document.createElement('div');
        piece.className='confetti-piece';
        piece.style.left=(20+Math.random()*60)+'%';
        piece.style.top=(10+Math.random()*30)+'%';
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.setProperty('--dx',(Math.random()*300-150)+'px');
        piece.style.setProperty('--dy',(Math.random()*400+100)+'px');
        piece.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(piece);
    }
    setTimeout(()=>{container.innerHTML='';},1600);
}

// Start
newGame();
document.getElementById('player-name').textContent=localStorage.getItem('games_player_name')||'Player';
(function(){const av=localStorage.getItem('games_avatar');document.getElementById('player-avatar').innerHTML=av?'<img src="'+av+'">':'👋'})();

// --- XP SYSTEM ---
const XP_THRESHOLDS=[0,50,120,200,300,420,560,720,900,1100];
function getXP(){return parseInt(localStorage.getItem('games_xp')||'0')}
function saveXP(xp){localStorage.setItem('games_xp',String(xp))}
function earnXP(amount){const xp=getXP()+amount;saveXP(xp);renderXPBar();return xp;}
function calcLevel(xp){let level=1;for(let i=1;i<=100;i++){const thresh=i<=10?XP_THRESHOLDS[i-1]:(XP_THRESHOLDS[9]+((i-10)*(220+(i-10)*20)));if(xp>=thresh)level=i;else break;}const currentThresh=level<=10?XP_THRESHOLDS[level-1]:(XP_THRESHOLDS[9]+((level-10)*(220+(level-10)*20)));const nextThresh=(level+1)<=10?XP_THRESHOLDS[level]:(XP_THRESHOLDS[9]+((level-1+1-10)*(220+(level-1+1-10)*20)));const progress=(xp-currentThresh)/(nextThresh-currentThresh);return{level,xp,currentThresh,nextThresh,progress:Math.min(1,Math.max(0,progress))};}
function renderXPBar(){const info=calcLevel(getXP());document.getElementById('xp-badge').textContent='Lv '+info.level;document.getElementById('xp-bar-fill').style.width=(info.progress*100)+'%';}
renderXPBar();

// Theme
function toggleTheme(){const l=document.body.classList.toggle('light-theme');localStorage.setItem('games_theme',l?'light':'dark');updThemeBtn()}
function updThemeBtn(){document.getElementById('theme-toggle').textContent=document.body.classList.contains('light-theme')?'🌙 Dark':'☀️ Light'}
(function(){if(localStorage.getItem('games_theme')!=='dark')document.body.classList.add('light-theme');updThemeBtn()})();
</script>

<div style="max-width:420px;margin:20px auto;padding:0 15px">
    <div style="background:rgba(255,255,255,.92);border-radius:20px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)">
        <div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="/games/puzzle.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🧩</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Sliding Puzzle</div></a>
            <a href="/games/wordsearch.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🔤</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Word Search</div></a>
            <a href="/games/reaction.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">⚡</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Reaction Speed</div></a>
        </div>
    </div>
</div>

</body>
</html>
