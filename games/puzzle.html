<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧩 Sliding Puzzle</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#f093fb 0%,#f5576c 50%,#ffd700 100%);
    background-attachment:fixed;
    margin:0;padding:15px;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
}

h1{
    color:#fff;font-size:1.8rem;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
    margin:60px 0 10px;text-align:center;
}

.info{
    color:rgba(255,255,255,.85);
    font-size:14px;margin-bottom:15px;text-align:center;
}

.controls{
    display:flex;gap:10px;margin-bottom:15px;flex-wrap:wrap;justify-content:center;
}

.controls button{
    background:rgba(255,255,255,.9);
    border:none;border-radius:12px;
    padding:10px 18px;font-size:14px;font-weight:bold;
    color:#4a1a7a;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.1);
    transition:transform .2s;
}
.controls button:hover{transform:scale(1.05)}
.controls button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}

.stats{
    display:flex;gap:20px;margin-bottom:15px;
    color:#fff;font-weight:bold;font-size:14px;
    text-shadow:0 1px 4px rgba(0,0,0,.3);
}

.puzzle-container{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 15px 50px rgba(0,0,0,.25);
    background:#333;
}

.tile{
    position:absolute;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;font-weight:bold;color:#fff;
    cursor:pointer;
    transition:left .2s ease,top .2s ease;
    border-radius:8px;
    user-select:none;
}

.tile:hover{filter:brightness(1.1)}

.tile.empty{
    background:transparent!important;
    cursor:default;
    box-shadow:none;
}

.win-msg{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.7);
    display:none;align-items:center;justify-content:center;
    z-index:50;flex-direction:column;
}

.win-msg.show{display:flex}

.win-box{
    background:#fff;border-radius:24px;
    padding:40px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.3);
    animation:fadeInUp .5s ease;
}

.win-box h2{font-size:2rem;color:#4a1a7a;margin-bottom:10px}
.win-box p{color:#666;margin-bottom:20px;font-size:16px}
.win-box button{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;border:none;border-radius:14px;
    padding:14px 30px;font-size:16px;font-weight:bold;
    cursor:pointer;transition:transform .2s;
}
.win-box button:hover{transform:scale(1.05)}

/* Back link */
.back-link{
    position:fixed;top:15px;right:15px;z-index:100;
    background:rgba(255,255,255,.9);
    border-radius:12px;padding:10px 16px;
    text-decoration:none;font-size:14px;font-weight:bold;
    color:#4a1a7a;box-shadow:0 4px 15px rgba(0,0,0,.1);
    transition:transform .2s;
}
.back-link:hover{transform:scale(1.05)}

/* Sidebar */
.menu-toggle{
    position:fixed;top:15px;left:15px;z-index:100;
    background:rgba(255,255,255,.9);border:none;border-radius:12px;
    width:44px;height:44px;font-size:22px;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.15);transition:transform .2s;
}
.menu-toggle:hover{transform:scale(1.1)}

.sidebar{
    position:fixed;top:0;left:-260px;width:250px;height:100%;
    background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
    z-index:99;padding:70px 20px 20px;
    box-shadow:4px 0 30px rgba(0,0,0,.15);
    transition:left .3s ease;border-radius:0 20px 20px 0;
}
.sidebar.open{left:0}
.sidebar a{
    display:block;padding:14px 16px;margin:6px 0;
    border-radius:12px;text-decoration:none;
    font-size:15px;font-weight:600;color:#4a1a7a;
    transition:background .2s;
}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.3);z-index:98;display:none;
}
.overlay.open{display:block}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

@media(max-width:500px){
    h1{font-size:1.4rem;margin-top:50px}
}

/* Player bar */
.player-bar{
    position:fixed;bottom:15px;left:15px;z-index:100;
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);
    border-radius:12px;backdrop-filter:blur(10px);
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}
.player-name{font-size:12px;font-weight:600;color:#4a1a7a}
.player-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(118,75,162,.1);border:1px solid rgba(118,75,162,.15);flex-shrink:0}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.stats-link-sm{
    font-size:11px;font-weight:700;color:#764ba2;text-decoration:none;
    padding:4px 10px;border-radius:8px;
    background:rgba(118,75,162,.08);border:1px solid rgba(118,75,162,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(118,75,162,.15)}
.xp-badge{font-size:10px;font-weight:800;color:#d4a000;background:rgba(212,160,0,.08);border:1px solid rgba(212,160,0,.2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.xp-bar-wrap{width:50px;height:6px;border-radius:3px;background:rgba(0,0,0,.08);overflow:hidden;flex-shrink:0}
.xp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd700,#ffaa00);transition:width .3s ease;width:0%}

/* Theme toggle */
.theme-toggle{position:fixed;top:15px;right:120px;z-index:100;padding:8px 14px;background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);border-radius:12px;cursor:pointer;font-size:13px;font-weight:600;color:#666;transition:all .2s;box-shadow:0 2px 10px rgba(0,0,0,.08)}
.theme-toggle:hover{transform:scale(1.05);color:#4a1a7a}
body.light-theme{background:linear-gradient(135deg,#f5f7fa 0%,#e8edf5 50%,#fff0f0 100%)}
body.light-theme h1{color:#4a1a7a;text-shadow:none}
body.light-theme .info{color:#666}
body.light-theme .menu-toggle{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);box-shadow:0 2px 10px rgba(0,0,0,.08)}
body.light-theme .sidebar{background:rgba(255,255,255,.98);border-right-color:rgba(0,0,0,.06)}
body.light-theme .sidebar a{color:#4a1a7a}
body.light-theme .sidebar a:hover{background:#f0e6ff}
</style>
</head>
<body>

<div class="player-bar">
    <span class="player-avatar" id="player-avatar"></span>
    <span class="player-name" id="player-name"></span>
    <span class="xp-badge" id="xp-badge">Lv 1</span>
    <span class="xp-bar-wrap"><span class="xp-bar-fill" id="xp-bar-fill"></span></span>
    <a href="/games/stats.html" class="stats-link-sm">🏆 Stats</a>
</div>

<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️ Light</button>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="/games/">🎮 Games</a>
    <a href="/games/stats.html">🏆 Stats</a>
</div>

<a href="/games/" class="back-link">← Games</a>

<h1>🧩 Sliding Puzzle</h1>
<p class="info">Slide the tiles to put the numbers in order!</p>

<div class="controls">
    <button class="active" onclick="setSize(3)">3×3</button>
    <button onclick="setSize(4)">4×4</button>
    <button onclick="shuffle()">🔀 Shuffle</button>
</div>

<div class="stats">
    <span>Moves: <span id="moves">0</span></span>
    <span>⏱️ <span id="timer">0:00</span></span>
</div>

<div class="puzzle-container" id="puzzle"></div>

<div class="win-msg" id="winMsg">
    <div class="win-box">
        <h2>🎉 You Did It!</h2>
        <p id="winText">Completed in 0 moves!</p>
        <button onclick="shuffle()">Play Again</button>
    </div>
</div>

<script>
function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

let gridSize=3;
let tiles=[];
let moves=0;
let timerInterval=null;
let seconds=0;
let gameActive=false;

const tileColors=[
    '#667eea','#764ba2','#f093fb','#43e97b','#38f9d7',
    '#f5576c','#ffd700','#ff6b6b','#4ecdc4','#45b7d1',
    '#96e6a1','#dfe6e9','#fd79a8','#e17055','#00cec9','#a29bfe'
];

function setSize(s){
    gridSize=s;
    document.querySelectorAll('.controls button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.controls button').forEach(b=>{
        if(b.textContent.includes(s+'×'+s)) b.classList.add('active');
    });
    initPuzzle();
}

function initPuzzle(){
    stopTimer();
    moves=0;seconds=0;gameActive=false;
    document.getElementById('moves').textContent='0';
    document.getElementById('timer').textContent='0:00';
    document.getElementById('winMsg').classList.remove('show');

    const total=gridSize*gridSize;
    tiles=[];
    for(let i=1;i<total;i++) tiles.push(i);
    tiles.push(0); // empty

    renderPuzzle();
    // Auto shuffle
    setTimeout(()=>shuffle(),300);
}

function renderPuzzle(){
    const container=document.getElementById('puzzle');
    const tileSize=Math.min(70, (window.innerWidth-60)/gridSize);
    const gap=4;
    const containerSize=gridSize*tileSize+(gridSize-1)*gap;

    container.style.width=containerSize+'px';
    container.style.height=containerSize+'px';
    container.innerHTML='';

    tiles.forEach((val,idx)=>{
        const row=Math.floor(idx/gridSize);
        const col=idx%gridSize;

        const tile=document.createElement('div');
        tile.className='tile'+(val===0?' empty':'');
        tile.style.width=tileSize+'px';
        tile.style.height=tileSize+'px';
        tile.style.left=(col*(tileSize+gap))+'px';
        tile.style.top=(row*(tileSize+gap))+'px';

        if(val!==0){
            tile.textContent=val;
            tile.style.background=tileColors[(val-1)%tileColors.length];
            tile.style.boxShadow='0 3px 10px rgba(0,0,0,.2)';
            tile.onclick=()=>moveTile(idx);
        }

        container.appendChild(tile);
    });
}

function shuffle(){
    document.getElementById('winMsg').classList.remove('show');
    stopTimer();
    moves=0;seconds=0;gameActive=false;
    document.getElementById('moves').textContent='0';
    document.getElementById('timer').textContent='0:00';

    // Do random valid moves to ensure solvability
    const total=gridSize*gridSize;
    for(let i=0;i<(gridSize===3?100:200);i++){
        const emptyIdx=tiles.indexOf(0);
        const neighbors=getNeighbors(emptyIdx);
        const pick=neighbors[Math.floor(Math.random()*neighbors.length)];
        [tiles[emptyIdx],tiles[pick]]=[tiles[pick],tiles[emptyIdx]];
    }

    renderPuzzle();
}

function getNeighbors(idx){
    const row=Math.floor(idx/gridSize);
    const col=idx%gridSize;
    const neighbors=[];
    if(row>0) neighbors.push(idx-gridSize);
    if(row<gridSize-1) neighbors.push(idx+gridSize);
    if(col>0) neighbors.push(idx-1);
    if(col<gridSize-1) neighbors.push(idx+1);
    return neighbors;
}

function moveTile(idx){
    const emptyIdx=tiles.indexOf(0);
    const neighbors=getNeighbors(emptyIdx);

    if(neighbors.includes(idx)){
        [tiles[emptyIdx],tiles[idx]]=[tiles[idx],tiles[emptyIdx]];

        if(!gameActive){
            gameActive=true;
            startTimer();
        }

        moves++;
        document.getElementById('moves').textContent=moves;
        renderPuzzle();
        checkWin();
    }
}

function checkWin(){
    const total=gridSize*gridSize;
    for(let i=0;i<total-1;i++){
        if(tiles[i]!==i+1) return;
    }
    // Won!
    gameActive=false;
    stopTimer();
    // Track stats
    const ps=JSON.parse(localStorage.getItem('puzzle_stats')||'{"gamesWon":0,"bestMoves":null,"bestTime":null}');
    ps.gamesWon++;
    if(!ps.bestMoves||moves<ps.bestMoves)ps.bestMoves=moves;
    if(!ps.bestTime||seconds<ps.bestTime)ps.bestTime=seconds;
    localStorage.setItem('puzzle_stats',JSON.stringify(ps));
    earnXP(25);

    document.getElementById('winText').textContent=
        `Completed in ${moves} moves and ${formatTime(seconds)}!`;
    document.getElementById('winMsg').classList.add('show');
}

function startTimer(){
    timerInterval=setInterval(()=>{
        seconds++;
        document.getElementById('timer').textContent=formatTime(seconds);
    },1000);
}

function stopTimer(){
    if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
}

function formatTime(s){
    const m=Math.floor(s/60);
    const sec=s%60;
    return m+':'+(sec<10?'0':'')+sec;
}

// Init
initPuzzle();
document.getElementById('player-name').textContent=localStorage.getItem('games_player_name')||'Player';
(function(){const av=localStorage.getItem('games_avatar');document.getElementById('player-avatar').innerHTML=av?'<img src="'+av+'">':'👋'})();

// --- XP SYSTEM ---
const XP_THRESHOLDS=[0,50,120,200,300,420,560,720,900,1100];
function getXP(){return parseInt(localStorage.getItem('games_xp')||'0')}
function saveXP(xp){localStorage.setItem('games_xp',String(xp))}
function earnXP(amount){const xp=getXP()+amount;saveXP(xp);renderXPBar();return xp;}
function calcLevel(xp){let level=1;for(let i=1;i<=100;i++){const thresh=i<=10?XP_THRESHOLDS[i-1]:(XP_THRESHOLDS[9]+((i-10)*(220+(i-10)*20)));if(xp>=thresh)level=i;else break;}const currentThresh=level<=10?XP_THRESHOLDS[level-1]:(XP_THRESHOLDS[9]+((level-10)*(220+(level-10)*20)));const nextThresh=(level+1)<=10?XP_THRESHOLDS[level]:(XP_THRESHOLDS[9]+((level-1+1-10)*(220+(level-1+1-10)*20)));const progress=(xp-currentThresh)/(nextThresh-currentThresh);return{level,xp,currentThresh,nextThresh,progress:Math.min(1,Math.max(0,progress))};}
function renderXPBar(){const info=calcLevel(getXP());document.getElementById('xp-badge').textContent='Lv '+info.level;document.getElementById('xp-bar-fill').style.width=(info.progress*100)+'%';}
renderXPBar();

// Theme
function toggleTheme(){const l=document.body.classList.toggle('light-theme');localStorage.setItem('games_theme',l?'light':'dark');updThemeBtn()}
function updThemeBtn(){document.getElementById('theme-toggle').textContent=document.body.classList.contains('light-theme')?'🌙 Dark':'☀️ Light'}
(function(){if(localStorage.getItem('games_theme')!=='dark')document.body.classList.add('light-theme');updThemeBtn()})();
</script>

<div style="max-width:420px;margin:20px auto;padding:0 15px">
    <div style="background:rgba(255,255,255,.92);border-radius:20px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)">
        <div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="/games/memory.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🃏</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Memory Match</div></a>
            <a href="/games/sudoku.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🔢</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Sudoku</div></a>
            <a href="/games/pattern.html" style="flex:1;min-width:100px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;display:block"><div style="font-size:28px;margin-bottom:4px">🔴</div><div style="font-size:12px;font-weight:700;color:#4a1a7a">Pattern Match</div></a>
        </div>
    </div>
</div>

</body>
</html>
