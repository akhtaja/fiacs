<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔢 Math Race</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);background-attachment:fixed;margin:0;padding:15px;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 500px 500px at 50% 40%,rgba(67,233,123,.12) 0%,transparent 70%),radial-gradient(ellipse 400px 400px at 30% 70%,rgba(255,215,0,.1) 0%,transparent 70%)}
h1{position:relative;z-index:1;text-align:center;font-size:2.2rem;margin:60px 0 8px;background:linear-gradient(135deg,#fff,#43e97b,#ffd700);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.subtitle{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:25px}
.container{max-width:480px;margin:0 auto;position:relative;z-index:1}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:22px;padding:28px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.back-btn{position:fixed;top:15px;right:15px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px;backdrop-filter:blur(10px);transition:transform .2s}
.back-btn:hover{transform:scale(1.05)}

/* Challenge */
.challenge-banner{position:relative;z-index:1;max-width:480px;margin:0 auto 15px;background:linear-gradient(135deg,rgba(255,215,0,.12),rgba(255,170,0,.06));border:1px solid rgba(255,215,0,.25);border-radius:16px;padding:16px 20px;text-align:center;animation:fadeInUp .4s ease}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.challenge-banner-title{font-size:15px;font-weight:800;color:#ffd700;margin-bottom:4px}
.challenge-banner-score{font-size:28px;font-weight:800;color:#fff;margin:6px 0}
.challenge-banner-detail{font-size:12px;color:rgba(255,255,255,.5)}
.challenge-banner .challenge-lb{margin-top:12px;text-align:left}
.challenge-lb-row{display:flex;align-items:center;gap:8px;padding:8px 12px;margin:4px 0;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.challenge-lb-row.winner{background:rgba(255,215,0,.08);border-color:rgba(255,215,0,.2)}
.challenge-lb-rank{font-size:16px;width:24px;text-align:center}
.challenge-lb-name{flex:1;font-size:13px;font-weight:600;color:#fff}
.challenge-lb-score{font-size:13px;font-weight:700;color:rgba(255,255,255,.7)}
.challenge-lb-row.winner .challenge-lb-score{color:#ffd700}
.challenge-compare{margin-top:15px;padding:16px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);animation:fadeInUp .4s ease}
.challenge-compare-title{font-size:20px;font-weight:800;margin-bottom:12px}
.challenge-compare-title.win{color:#43e97b}
.challenge-compare-title.lose{color:#ff5252}
.challenge-compare-title.tie{color:#ffd700}
.challenge-vs{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0}
.challenge-vs-player{text-align:center;flex:1}
.challenge-vs-name{font-size:11px;color:rgba(255,255,255,.5);margin-bottom:2px}
.challenge-vs-score{font-size:24px;font-weight:800;color:#fff}
.challenge-vs-score.winner{color:#43e97b}
.challenge-vs-score.loser{color:rgba(255,255,255,.4)}
.challenge-vs-divider{font-size:18px;color:rgba(255,255,255,.3);font-weight:800}
.share-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;animation:fadeIn .2s ease;padding:15px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.share-modal{background:linear-gradient(135deg,#1a1540,#2d2460);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:28px;max-width:380px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fadeInUp .3s ease}
.share-modal-title{font-size:18px;font-weight:800;color:#fff;margin-bottom:4px}
.share-modal-subtitle{font-size:12px;color:rgba(255,255,255,.5);margin-bottom:18px}
.share-modal-qr{margin:16px auto;background:#fff;border-radius:12px;padding:12px;display:inline-block}
.share-modal-qr canvas{display:block}
.share-modal-url{display:flex;gap:8px;margin:14px 0}
.share-modal-url input{flex:1;padding:10px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.06);color:#fff;font-size:12px;outline:none;font-family:inherit}
.share-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:700;cursor:pointer;transition:all .2s;border:none}
.share-btn:hover{transform:scale(1.03)}
.share-btn-copy{background:rgba(255,215,0,.15);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
.share-btn-copy.copied{background:rgba(67,233,123,.15);color:#43e97b;border-color:rgba(67,233,123,.3)}
.share-btn-native{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;width:100%;margin-top:8px}
.share-btn-close{background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.1);width:100%;margin-top:8px}
.challenge-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;border-radius:14px;font-size:13px;font-weight:700;background:linear-gradient(135deg,rgba(255,215,0,.15),rgba(255,170,0,.1));border:1px solid rgba(255,215,0,.3);color:#ffd700;cursor:pointer;transition:all .2s;margin-top:10px}
.challenge-btn:hover{background:linear-gradient(135deg,rgba(255,215,0,.25),rgba(255,170,0,.15));transform:scale(1.03)}
body.light-theme .challenge-banner{background:linear-gradient(135deg,rgba(212,160,0,.08),rgba(212,160,0,.04));border-color:rgba(212,160,0,.2)}
body.light-theme .challenge-banner-title{color:#d4a000}
body.light-theme .challenge-banner-score{color:#4a1a7a}
body.light-theme .challenge-compare-title.win{color:#27ae60}
body.light-theme .challenge-compare-title.lose{color:#e74c3c}
body.light-theme .share-modal{background:linear-gradient(135deg,#f8f6ff,#f0e6ff);border-color:rgba(0,0,0,.1)}
body.light-theme .share-modal-title{color:#4a1a7a}
body.light-theme .share-modal-url input{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.1);color:#333}
body.light-theme .challenge-btn{color:#d4a000;background:linear-gradient(135deg,rgba(212,160,0,.1),rgba(212,160,0,.06));border-color:rgba(212,160,0,.25)}

/* Timer bar */
.timer-bar{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.1);margin-bottom:20px;overflow:hidden}
.timer-fill{height:100%;border-radius:4px;transition:width .1s linear;background:linear-gradient(90deg,#43e97b,#ffd700)}
.timer-fill.danger{background:linear-gradient(90deg,#ff5252,#ffd700)}

/* Problem */
.problem{font-size:3rem;font-weight:800;color:#fff;margin:15px 0;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.answer-input{
    padding:16px 20px;font-size:24px;font-weight:bold;text-align:center;
    width:160px;border:2px solid rgba(255,255,255,.2);border-radius:14px;
    background:rgba(255,255,255,.06);color:#fff;outline:none;
    transition:border-color .2s;
}
.answer-input:focus{border-color:rgba(102,126,234,.5);box-shadow:0 0 15px rgba(102,126,234,.2)}
.answer-input.correct{border-color:#43e97b;background:rgba(67,233,123,.1)}
.answer-input.wrong{border-color:#ff5252;background:rgba(255,82,82,.1);animation:shake .3s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

/* Stats */
.race-stats{display:flex;justify-content:center;gap:20px;margin:15px 0;flex-wrap:wrap}
.race-stat{text-align:center}
.race-stat-val{font-size:1.5rem;font-weight:800;color:#fff;display:block}
.race-stat-val.green{color:#43e97b}
.race-stat-label{font-size:10px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.5px}

/* Start/End screens */
.start-screen,.end-screen{padding:20px}
.start-btn{
    padding:16px 40px;border-radius:16px;font-size:18px;font-weight:bold;
    background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;
    border:none;cursor:pointer;box-shadow:0 6px 20px rgba(67,233,123,.3);transition:transform .2s;margin-top:15px;
}
.start-btn:hover{transform:scale(1.05)}
.mode-btns{display:flex;gap:10px;justify-content:center;margin:15px 0;flex-wrap:wrap}
.mode-btn{padding:10px 18px;border-radius:12px;font-size:13px;font-weight:bold;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.6);cursor:pointer;transition:all .2s}
.mode-btn:hover{border-color:rgba(102,126,234,.4);color:#fff}
.mode-btn.active{background:rgba(102,126,234,.2);border-color:rgba(102,126,234,.5);color:#fff}
.end-score{font-size:3rem;font-weight:800;color:#ffd700;margin:10px 0}
.end-msg{color:rgba(255,255,255,.6);font-size:14px;margin:10px 0}
.best-badge{display:inline-block;padding:6px 14px;border-radius:10px;font-size:12px;font-weight:bold;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.3);color:#ffd700;margin-top:8px}

/* Player bar */
.player-bar{
    position:fixed;bottom:15px;left:15px;z-index:100;
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;backdrop-filter:blur(10px);
}
.player-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.player-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.stats-link-sm{
    font-size:11px;font-weight:700;color:#ffd700;text-decoration:none;
    padding:4px 10px;border-radius:8px;
    background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(255,215,0,.15)}
.xp-badge{font-size:10px;font-weight:800;color:#ffd700;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.xp-bar-wrap{width:50px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex-shrink:0}
.xp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd700,#ffaa00);transition:width .3s ease;width:0%}
body.light-theme .xp-badge{color:#d4a000;background:rgba(212,160,0,.08);border-color:rgba(212,160,0,.2)}
body.light-theme .xp-bar-wrap{background:rgba(0,0,0,.08)}

/* Theme toggle */
.theme-toggle{position:fixed;top:15px;right:120px;z-index:100;padding:8px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;backdrop-filter:blur(10px);cursor:pointer;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);transition:all .2s}
.theme-toggle:hover{background:rgba(255,255,255,.15);color:#fff;transform:scale(1.05)}
body.light-theme{background:linear-gradient(135deg,#f5f7fa 0%,#e8edf5 50%,#e6ffe6 100%)}
body.light-theme .bg-glow{opacity:.3}
body.light-theme h1{background:linear-gradient(135deg,#1a5c3a,#27ae60,#d4a000);-webkit-background-clip:text;background-clip:text}
body.light-theme .subtitle{color:#666}
body.light-theme .card{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.06);box-shadow:0 4px 20px rgba(0,0,0,.06)}
body.light-theme .problem{color:#4a1a7a;text-shadow:none}
body.light-theme .answer-input{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.12);color:#4a1a7a}
body.light-theme .answer-input:focus{border-color:rgba(102,126,234,.5)}
body.light-theme .answer-input.correct{border-color:#27ae60;background:rgba(67,233,123,.06)}
body.light-theme .answer-input.wrong{border-color:#e74c3c;background:rgba(255,82,82,.06)}
body.light-theme .timer-fill{background:linear-gradient(90deg,#27ae60,#d4a000)}
body.light-theme .timer-bar{background:rgba(0,0,0,.06)}
body.light-theme .race-stat-val{color:#4a1a7a}
body.light-theme .race-stat-val.green{color:#27ae60}
body.light-theme .race-stat-label{color:#888}
body.light-theme .mode-btn{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08);color:#666}
body.light-theme .mode-btn.active{background:rgba(102,126,234,.1);border-color:rgba(102,126,234,.3);color:#4a1a7a}
body.light-theme .start-btn{background:linear-gradient(135deg,#27ae60,#2ecc71);color:#fff}
body.light-theme .end-score{color:#d4a000}
body.light-theme .end-msg{color:#666}
body.light-theme .best-badge{background:rgba(212,160,0,.08);border-color:rgba(212,160,0,.2);color:#d4a000}
body.light-theme .back-btn{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);color:#4a1a7a}
body.light-theme .theme-toggle{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1);color:#666}
body.light-theme .player-bar{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08)}
body.light-theme .player-name{color:#4a1a7a}
body.light-theme .stats-link-sm{color:#764ba2;background:rgba(118,75,162,.08);border-color:rgba(118,75,162,.2)}

/* Recommend section */
.recommend-title{font-size:13px;font-weight:700;color:#fff}
.recommend-desc{font-size:10px;color:rgba(255,255,255,.5)}
.recommend-label{font-size:12px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.recommend-card{flex:1;min-width:120px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-decoration:none;display:block;transition:all .2s}
.recommend-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
body.light-theme .recommend-title{color:#4a1a7a}
body.light-theme .recommend-desc{color:#888}
body.light-theme .recommend-label{color:#888}
body.light-theme .recommend-card{background:rgba(118,75,162,.04);border-color:rgba(118,75,162,.1)}

.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}

@media(max-width:500px){h1{font-size:1.7rem;margin-top:50px}.card{padding:20px}.problem{font-size:2.2rem}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<a href="/games/" class="back-btn">← Games</a>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️ Light</button>

<h1>🔢 Math Race</h1>
<p class="subtitle">Solve as many problems as you can before time runs out!</p>


<div id="challenge-banner"></div>

<div class="player-bar">
    <span class="player-avatar" id="player-avatar"></span>
    <span class="player-name" id="player-name"></span>
    <span class="xp-badge" id="xp-badge">Lv 1</span>
    <span class="xp-bar-wrap"><span class="xp-bar-fill" id="xp-bar-fill"></span></span>
    <a href="/games/stats.html" class="stats-link-sm">🏆 Stats</a>
</div>

<div class="container">
    <div class="card" id="game-area">
        <div class="start-screen" id="start-screen">
            <div style="font-size:48px;margin-bottom:10px">🏎️</div>
            <div style="font-size:16px;font-weight:bold;margin-bottom:5px" class="recommend-title">Ready to race?</div>
            <div style="font-size:13px;margin-bottom:15px" class="recommend-desc">Type answers as fast as you can!</div>
            <div class="mode-btns">
                <button class="mode-btn active" onclick="setMode('easy')">😊 Easy</button>
                <button class="mode-btn" onclick="setMode('medium')">🤔 Medium</button>
                <button class="mode-btn" onclick="setMode('hard')">🔥 Hard</button>
            </div>
            <div style="font-size:12px;text-transform:uppercase;letter-spacing:1px;margin:12px 0 8px" class="recommend-desc">⏱️ Time</div>
            <div class="mode-btns">
                <button class="mode-btn active" id="time-30" onclick="setTime(30)">30 seconds</button>
                <button class="mode-btn" id="time-60" onclick="setTime(60)">60 seconds</button>
            </div>
            <button class="start-btn" onclick="startRace()">🏁 Start Race!</button>
            <div style="margin-top:15px;font-size:13px;color:#888" id="best-display"></div>
        </div>
        <div id="race-screen" style="display:none">
            <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
            <div class="problem" id="problem"></div>
            <input type="number" class="answer-input" id="answer" autocomplete="off" inputmode="numeric">
            <div class="race-stats">
                <div class="race-stat"><span class="race-stat-val green" id="r-correct">0</span><span class="race-stat-label">Correct</span></div>
                <div class="race-stat"><span class="race-stat-val" id="r-time">30</span><span class="race-stat-label">Seconds</span></div>
                <div class="race-stat"><span class="race-stat-val" id="r-streak">0</span><span class="race-stat-label">Streak</span></div>
            </div>
        </div>
        <div class="end-screen" id="end-screen" style="display:none"></div>
    </div>
</div>

<div class="confetti-container" id="confetti"></div>

<div class="container" style="margin-top:10px">
    <div class="card" style="text-align:center">
        <div class="recommend-label">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="/games/pattern.html" class="recommend-card"><div style="font-size:28px;margin-bottom:4px">🔴</div><div class="recommend-title">Pattern Match</div><div class="recommend-desc">Find the sequence</div></a>
            <a href="/games/reaction.html" class="recommend-card"><div style="font-size:28px;margin-bottom:4px">⚡</div><div class="recommend-title">Reaction Speed</div><div class="recommend-desc">Test reflexes</div></a>
        </div>
    </div>
</div>

<script>
function toggleTheme(){const l=document.body.classList.toggle('light-theme');localStorage.setItem('games_theme',l?'light':'dark');updThemeBtn()}
function updThemeBtn(){document.getElementById('theme-toggle').textContent=document.body.classList.contains('light-theme')?'🌙 Dark':'☀️ Light'}
(function(){if(localStorage.getItem('games_theme')!=='dark')document.body.classList.add('light-theme');updThemeBtn()})();
function fireConfetti(){const c=document.getElementById('confetti'),colors=['#667eea','#43e97b','#ffd700','#ff5252','#764ba2'];for(let i=0;i<20;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=(30+Math.random()*40)+'%';p.style.top=(20+Math.random()*30)+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.setProperty('--dx',(Math.random()*200-100)+'px');p.style.setProperty('--dy',(Math.random()*300+80)+'px');c.appendChild(p)}setTimeout(()=>{c.innerHTML=''},1600)}

let mode='easy',timeLeft=30,timer=null,correct=0,rStreak=0,currentAnswer=0;
let DURATION=30;

function setTime(t){
    DURATION=t;
    document.getElementById('time-30').classList.toggle('active',t===30);
    document.getElementById('time-60').classList.toggle('active',t===60);
    showBest();
}

// Best scores
function getBest(){return JSON.parse(localStorage.getItem('mathrace_best')||'{}')}
function saveBest(key,score){const b=getBest();if(!b[key]||score>b[key])b[key]=score;localStorage.setItem('mathrace_best',JSON.stringify(b))}

function setMode(m){
    mode=m;
    document.querySelectorAll('.mode-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.mode-btn').forEach(b=>{if(b.textContent.toLowerCase().includes(m))b.classList.add('active')});
    document.getElementById('time-'+DURATION).classList.add('active');
    showBest();
}

function showBest(){
    const b=getBest();
    const key=mode+'_'+DURATION;
    const el=document.getElementById('best-display');
    if(b[key])el.textContent='🏆 Your best: '+b[key]+' correct ('+DURATION+'s)';
    else el.textContent='';
}
// --- XP SYSTEM ---
const XP_THRESHOLDS=[0,50,120,200,300,420,560,720,900,1100];
function getXP(){return parseInt(localStorage.getItem('games_xp')||'0')}
function saveXP(xp){localStorage.setItem('games_xp',String(xp))}
function earnXP(amount){const xp=getXP()+amount;saveXP(xp);renderXPBar();return xp;}
function calcLevel(xp){
    let level=1;
    for(let i=1;i<=100;i++){
        const thresh=i<=10?XP_THRESHOLDS[i-1]:(XP_THRESHOLDS[9]+((i-10)*(220+(i-10)*20)));
        if(xp>=thresh)level=i;else break;
    }
    const currentThresh=level<=10?XP_THRESHOLDS[level-1]:(XP_THRESHOLDS[9]+((level-10)*(220+(level-10)*20)));
    const nextThresh=(level+1)<=10?XP_THRESHOLDS[level]:(XP_THRESHOLDS[9]+((level-1+1-10)*(220+(level-1+1-10)*20)));
    const progress=(xp-currentThresh)/(nextThresh-currentThresh);
    return{level,xp,currentThresh,nextThresh,progress:Math.min(1,Math.max(0,progress))};
}
function renderXPBar(){
    const info=calcLevel(getXP());
    document.getElementById('xp-badge').textContent='Lv '+info.level;
    document.getElementById('xp-bar-fill').style.width=(info.progress*100)+'%';
}

showBest();
document.getElementById('player-name').textContent=localStorage.getItem('games_player_name')||'Player';
(function(){const av=localStorage.getItem('games_avatar');document.getElementById('player-avatar').innerHTML=av?'<img src="'+av+'">':'👋'})();
renderXPBar();

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function generateProblem(){
    let a,b,op,answer;
    if(mode==='easy'){
        a=rand(1,10);b=rand(1,10);op='+';answer=a+b;
    } else if(mode==='medium'){
        const ops=['+','-','×'];op=ops[rand(0,2)];
        if(op==='+'){a=rand(5,20);b=rand(5,20);answer=a+b;}
        else if(op==='-'){a=rand(10,30);b=rand(1,a);answer=a-b;}
        else{a=rand(2,10);b=rand(2,10);answer=a*b;}
    } else {
        const ops=['+','-','×','÷'];op=ops[rand(0,3)];
        if(op==='+'){a=rand(10,50);b=rand(10,50);answer=a+b;}
        else if(op==='-'){a=rand(20,80);b=rand(1,a);answer=a-b;}
        else if(op==='×'){a=rand(3,12);b=rand(3,12);answer=a*b;}
        else{answer=rand(2,12);b=rand(2,10);a=answer*b;op='÷';}
    }
    currentAnswer=answer;
    document.getElementById('problem').textContent=`${a} ${op} ${b}`;
}

function startRace(){
    document.getElementById('start-screen').style.display='none';
    document.getElementById('race-screen').style.display='block';
    document.getElementById('end-screen').style.display='none';
    correct=0;rStreak=0;timeLeft=DURATION;
    document.getElementById('r-correct').textContent='0';
    document.getElementById('r-streak').textContent='0';
    document.getElementById('r-time').textContent=DURATION;
    generateProblem();
    const input=document.getElementById('answer');
    input.value='';input.className='answer-input';input.focus();
    
    timer=setInterval(()=>{
        timeLeft--;
        document.getElementById('r-time').textContent=timeLeft;
        const pct=(timeLeft/DURATION)*100;
        const fill=document.getElementById('timer-fill');
        fill.style.width=pct+'%';
        fill.className='timer-fill'+(pct<30?' danger':'');
        if(timeLeft<=0)endRace();
    },1000);

    input.addEventListener('keyup',checkInput);
}

function checkInput(e){
    const input=document.getElementById('answer');
    const val=parseInt(input.value);
    if(isNaN(val))return;
    if(val===currentAnswer){
        correct++;rStreak++;
        input.className='answer-input correct';
        document.getElementById('r-correct').textContent=correct;
        document.getElementById('r-streak').textContent=rStreak;
        if(correct%5===0)fireConfetti();
        earnXP(5);
        setTimeout(()=>{
            input.value='';input.className='answer-input';
            generateProblem();input.focus();
        },200);
    } else if(input.value.length>=String(currentAnswer).length){
        rStreak=0;
        input.className='answer-input wrong';
        document.getElementById('r-streak').textContent='0';
        setTimeout(()=>{input.value='';input.className='answer-input';input.focus()},400);
    }
}

function endRace(){
    clearInterval(timer);
    document.getElementById('race-screen').style.display='none';
    document.getElementById('answer').removeEventListener('keyup',checkInput);
    
    const key=mode+'_'+DURATION;
    const best=getBest();
    const isNewBest=!best[key]||correct>best[key];
    saveBest(key,correct);
    if(isNewBest)fireConfetti();

    let msg='';
    if(correct>=20)msg='🏆 Incredible! You\'re a math genius!';
    else if(correct>=15)msg='🌟 Amazing speed!';
    else if(correct>=10)msg='🔥 Great job! Keep practicing!';
    else if(correct>=5)msg='👍 Good start!';
    else msg='Keep trying, you\'ll get faster!';

    document.getElementById('end-screen').style.display='block';
    document.getElementById('end-screen').innerHTML=`
        <div style="font-size:48px;margin-bottom:10px">${isNewBest?'🏆':'🏁'}</div>
        <div style="color:#888;font-size:12px;text-transform:uppercase;letter-spacing:1px">Problems Solved</div>
        <div class="end-score">${correct}</div>
        <div class="end-msg">${msg}</div>
        ${isNewBest?'<div class="best-badge">🎉 New Personal Best!</div>':'<div style="color:#888;font-size:13px;margin-top:5px">Best: '+getBest()[key]+'</div>'}
        <button class="start-btn" onclick="startRace()" style="margin-top:20px">🔄 Race Again</button>
    `;

    // Challenge UI
    var challengeHTML='';
    if(challengeData){challengeHTML=showMathChallengeComparison(correct);}
    else{challengeHTML=showMathChallengeButton(correct);}
    document.getElementById('end-screen').innerHTML+=challengeHTML;
    earnXP(correct*2);
}

// ======= CHALLENGE A FRIEND SYSTEM =======
function encodeChallenge(data){return btoa(unescape(encodeURIComponent(JSON.stringify(data))));}
function decodeChallenge(){try{var h=location.hash.slice(1);if(!h||!h.startsWith('c='))return null;return JSON.parse(decodeURIComponent(escape(atob(h.slice(2)))));}catch(e){return null;}}
function buildChallengeURL(f,d){return location.origin+'/games/'+f+'#c='+encodeChallenge(d);}
function generateQR(text,canvas,size){var ctx=canvas.getContext('2d');canvas.width=canvas.height=size;ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);var img=new Image();img.crossOrigin='anonymous';img.onload=function(){ctx.drawImage(img,0,0,size,size)};img.onerror=function(){ctx.fillStyle='#1a1540';ctx.fillRect(10,10,size-20,size-20);ctx.fillStyle='#ffd700';ctx.font='bold 14px sans-serif';ctx.textAlign='center';ctx.fillText('Scan or copy link',size/2,size/2-5);ctx.fillText('below',size/2,size/2+15)};img.src='https://api.qrserver.com/v1/create-qr-code/?size='+size+'x'+size+'&data='+encodeURIComponent(text);}

var challengeData=null,isShareBack=false;
function initChallenge(){
    challengeData=decodeChallenge();if(!challengeData)return;
    isShareBack=!!(challengeData.p&&challengeData.ps!==null&&challengeData.ps!==undefined);
    var banner=document.getElementById('challenge-banner');
    var html='<div class="challenge-banner">';
    if(isShareBack){
        var sc=[{name:challengeData.p,score:challengeData.ps},{name:challengeData.n,score:challengeData.s}];
        sc.sort(function(a,b){return b.score-a.score;});
        html+='<div class="challenge-banner-title">\u2694\uFE0F Challenge Results</div><div class="challenge-lb">';
        sc.forEach(function(s,i){html+='<div class="challenge-lb-row'+(i===0?' winner':'')+'"><span class="challenge-lb-rank">'+(i===0?'\uD83E\uDD47':'\uD83E\uDD48')+'</span><span class="challenge-lb-name">'+s.name+'</span><span class="challenge-lb-score">'+s.score+' solved</span></div>';});
        html+='</div><div class="challenge-banner-detail" style="margin-top:10px">Play to beat them both!</div>';
    } else {
        html+='<div class="challenge-banner-title">&#9876;&#65039; '+challengeData.n+' challenged you!</div>';
        html+='<div class="challenge-banner-score">'+challengeData.s+' solved</div>';
        html+='<div class="challenge-banner-detail">Beat their score in '+challengeData.m+' mode ('+challengeData.d+'s)</div>';
    }
    html+='</div>';banner.innerHTML=html;
    if(challengeData.m)setMode(challengeData.m);
    if(challengeData.d)setTime(challengeData.d);
}
function showMathChallengeComparison(myScore){
    var ts=challengeData.s,tn=challengeData.n,won=myScore>ts,tied=myScore===ts;
    var title,cls;
    if(tied){title='It\'s a Tie!';cls='tie';}
    else if(won){title='You Won!';cls='win';}
    else{title='They Win!';cls='lose';}
    return '<div class="challenge-compare"><div class="challenge-compare-title '+cls+'">'+title+'</div><div class="challenge-vs"><div class="challenge-vs-player"><div class="challenge-vs-name">You</div><div class="challenge-vs-score '+(won?'winner':'loser')+'">'+myScore+'</div></div><div class="challenge-vs-divider">VS</div><div class="challenge-vs-player"><div class="challenge-vs-name">'+tn+'</div><div class="challenge-vs-score '+(won?'loser':'winner')+'">'+ts+'</div></div></div><button class="challenge-btn" onclick="mathShareBack('+myScore+')">Share Back</button></div>';
}
function showMathChallengeButton(score){return '<button class="challenge-btn" onclick="mathStartChallenge('+score+')">Challenge a Friend</button>';}
function mathStartChallenge(score){var n=localStorage.getItem('games_player_name')||'Player';var d={g:'mathrace',n:n,s:score,m:mode,d:DURATION,p:null,ps:null};showShareModal(buildChallengeURL('mathrace.html',d),n,score+' solved');}
function mathShareBack(myScore){var n=localStorage.getItem('games_player_name')||'Player';var d={g:'mathrace',n:n,s:myScore,m:mode,d:DURATION,p:challengeData.n,ps:challengeData.s};showShareModal(buildChallengeURL('mathrace.html',d),n,myScore+' solved');}
function showShareModal(url,name,scoreText){
    var shareMsg='🔢 I solved '+scoreText+' in Math Race! Think you can beat me? 🏎️\n\n'+url;
    var ov=document.createElement('div');ov.className='share-overlay';
    ov.onclick=function(e){if(e.target===ov)ov.remove();};
    var nb=navigator.share?'<button class="share-btn share-btn-native" id="share-native-btn">📱 Share via WhatsApp & more</button>':'';
    ov.innerHTML='<div class="share-modal"><div class="share-modal-title">⚔️ Challenge a Friend</div><div class="share-modal-subtitle">Share your score and see if they can beat it!</div><div class="share-modal-qr"><canvas id="share-qr-canvas"></canvas></div><div class="share-modal-url"><input type="text" value="'+url+'" readonly id="share-url-input" onclick="this.select()"><button class="share-btn share-btn-copy" id="share-copy-btn">📋 Copy</button></div>'+nb+'<button class="share-btn share-btn-close" onclick="this.closest(\'.share-overlay\').remove()">Close</button></div>';
    document.body.appendChild(ov);
    var c=document.getElementById('share-qr-canvas');try{generateQR(url,c,200);}catch(e){c.parentElement.style.display='none';}
    document.getElementById('share-copy-btn').onclick=function(){navigator.clipboard.writeText(shareMsg).then(function(){var b=document.getElementById('share-copy-btn');b.textContent='✅ Copied!';b.classList.add('copied');setTimeout(function(){b.textContent='📋 Copy';b.classList.remove('copied');},2000);});};
    if(navigator.share){document.getElementById('share-native-btn').onclick=function(){navigator.share({title:'🔢 Math Race Challenge',text:'🔢 I solved '+scoreText+' in Math Race! Think you can beat me? 🏎️',url:url}).catch(function(){});};}
}
initChallenge();
