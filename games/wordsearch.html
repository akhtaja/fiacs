<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔤 Word Search</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);background-attachment:fixed;margin:0;padding:15px;min-height:100vh;overflow-x:hidden}
.bg-glow{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;background:radial-gradient(ellipse 500px 500px at 60% 30%,rgba(161,140,209,.12) 0%,transparent 70%),radial-gradient(ellipse 400px 400px at 30% 60%,rgba(102,126,234,.1) 0%,transparent 70%)}
h1{position:relative;z-index:1;text-align:center;font-size:2.2rem;margin:60px 0 8px;background:linear-gradient(135deg,#fff,#a78bfa,#43e97b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;font-weight:800}
.subtitle{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:25px}
.container{max-width:500px;margin:0 auto;position:relative;z-index:1}
.card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:22px;padding:24px;margin-bottom:18px;border:1px solid rgba(255,255,255,.1);box-shadow:0 10px 40px rgba(0,0,0,.2);text-align:center}
.back-btn{position:fixed;top:15px;right:15px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:10px 18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px;backdrop-filter:blur(10px);transition:transform .2s}
.back-btn:hover{transform:scale(1.05)}
.menu-toggle{position:fixed;top:15px;left:15px;z-index:100;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;backdrop-filter:blur(10px);transition:transform .2s}
.menu-toggle:hover{transform:scale(1.1)}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:rgba(15,12,41,.97);backdrop-filter:blur(20px);z-index:99;padding:70px 20px 20px;box-shadow:4px 0 30px rgba(0,0,0,.4);transition:left .3s ease;border-radius:0 20px 20px 0;border-right:1px solid rgba(255,255,255,.1)}
.sidebar.open{left:0}
.sidebar a{display:block;padding:14px 16px;margin:6px 0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;color:rgba(255,255,255,.7);transition:background .2s,color .2s}
.sidebar a:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}

/* Grid */
.grid{
    display:inline-grid;
    gap:3px;
    margin:15px auto;
    user-select:none;
    -webkit-user-select:none;
}
.cell{
    width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:rgba(255,255,255,.7);
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
    border-radius:6px;cursor:pointer;transition:all .15s;text-transform:uppercase;
}
.cell:hover{background:rgba(102,126,234,.15);border-color:rgba(102,126,234,.3)}
.cell.selected{background:rgba(102,126,234,.3);border-color:rgba(102,126,234,.6);color:#fff}
.cell.found{background:rgba(67,233,123,.2);border-color:rgba(67,233,123,.4);color:#43e97b}

/* Word list */
.word-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:15px 0}
.word-tag{
    padding:6px 12px;border-radius:10px;font-size:12px;font-weight:bold;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    color:rgba(255,255,255,.6);transition:all .2s;
}
.word-tag.found{background:rgba(67,233,123,.1);border-color:rgba(67,233,123,.3);color:#43e97b;text-decoration:line-through}

/* Stats */
.ws-stats{display:flex;justify-content:center;gap:20px;margin:10px 0;font-size:13px;color:rgba(255,255,255,.5)}
.ws-stats strong{color:#fff}

.new-game-btn{
    padding:12px 24px;border-radius:14px;font-size:14px;font-weight:bold;
    background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;
    border:none;cursor:pointer;margin-top:12px;transition:transform .2s;
}
.new-game-btn:hover{transform:scale(1.05)}

/* Player bar */
.player-bar{
    position:fixed;bottom:15px;left:15px;z-index:100;
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);
    border-radius:12px;backdrop-filter:blur(10px);
}
.player-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.7)}
.player-avatar{width:24px;height:24px;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);flex-shrink:0}
.player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.stats-link-sm{
    font-size:11px;font-weight:700;color:#ffd700;text-decoration:none;
    padding:4px 10px;border-radius:8px;
    background:rgba(255,215,0,.08);border:1px solid rgba(255,215,0,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(255,215,0,.15)}
.xp-badge{font-size:10px;font-weight:800;color:#ffd700;background:rgba(255,215,0,.1);border:1px solid rgba(255,215,0,.2);padding:2px 7px;border-radius:6px;white-space:nowrap}
.xp-bar-wrap{width:50px;height:6px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;flex-shrink:0}
.xp-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,#ffd700,#ffaa00);transition:width .3s ease;width:0%}
body.light-theme .xp-badge{color:#d4a000;background:rgba(212,160,0,.08);border-color:rgba(212,160,0,.2)}
body.light-theme .xp-bar-wrap{background:rgba(0,0,0,.08)}

/* Theme toggle */
.theme-toggle{position:fixed;top:15px;right:120px;z-index:100;padding:8px 14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;backdrop-filter:blur(10px);cursor:pointer;font-size:13px;font-weight:600;color:rgba(255,255,255,.7);transition:all .2s}
.theme-toggle:hover{background:rgba(255,255,255,.15);color:#fff;transform:scale(1.05)}
body.light-theme{background:linear-gradient(135deg,#f5f7fa 0%,#e8edf5 50%,#f0e6ff 100%)}
body.light-theme .bg-glow{opacity:.3}
body.light-theme h1{background:linear-gradient(135deg,#4a1a7a,#667eea,#27ae60);-webkit-background-clip:text;background-clip:text}
body.light-theme .subtitle{color:#666}
body.light-theme .card{background:rgba(255,255,255,.85);border-color:rgba(0,0,0,.06);box-shadow:0 4px 20px rgba(0,0,0,.06)}
body.light-theme .ws-stats{color:#666}
body.light-theme .ws-stats strong{color:#4a1a7a}
body.light-theme .word-tag{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.08);color:#4a1a7a}
body.light-theme .word-tag.found{background:rgba(67,233,123,.08);border-color:rgba(67,233,123,.2);color:#27ae60}
body.light-theme .cell{background:rgba(0,0,0,.02);border-color:rgba(0,0,0,.08);color:#4a1a7a}
body.light-theme .cell:hover{background:rgba(102,126,234,.08);border-color:rgba(102,126,234,.2)}
body.light-theme .cell.selected{background:rgba(102,126,234,.15);border-color:rgba(102,126,234,.4);color:#4a1a7a}
body.light-theme .cell.found{background:rgba(67,233,123,.1);border-color:rgba(67,233,123,.3);color:#27ae60}
body.light-theme .new-game-btn{background:linear-gradient(135deg,#667eea,#764ba2)}
body.light-theme .back-btn{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08);color:#4a1a7a}
body.light-theme .menu-toggle{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08)}
body.light-theme .sidebar{background:rgba(255,255,255,.98);border-right-color:rgba(0,0,0,.06)}
body.light-theme .sidebar a{color:#4a1a7a}
body.light-theme .sidebar a:hover{background:#f0e6ff}
body.light-theme .theme-toggle{background:rgba(0,0,0,.05);border-color:rgba(0,0,0,.1);color:#666}
body.light-theme .player-bar{background:rgba(255,255,255,.9);border-color:rgba(0,0,0,.08)}
body.light-theme .player-name{color:#4a1a7a}
body.light-theme .stats-link-sm{color:#764ba2;background:rgba(118,75,162,.08);border-color:rgba(118,75,162,.2)}

/* Recommend section */
.recommend-title{font-size:13px;font-weight:700;color:#fff}
.recommend-desc{font-size:10px;color:rgba(255,255,255,.5)}
.recommend-label{font-size:12px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-bottom:12px}
.recommend-card{flex:1;min-width:120px;padding:14px;border-radius:14px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);text-decoration:none;display:block;transition:all .2s}
.recommend-card:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
body.light-theme .recommend-title{color:#4a1a7a}
body.light-theme .recommend-desc{color:#888}
body.light-theme .recommend-label{color:#888}
body.light-theme .recommend-card{background:rgba(118,75,162,.04);border-color:rgba(118,75,162,.1)}

.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}

@media(max-width:500px){h1{font-size:1.7rem;margin-top:50px}.card{padding:18px}.cell{width:30px;height:30px;font-size:13px}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<a href="/games/" class="back-btn">← Games</a>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">☀️ Light</button>
<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="/games/">🎮 Games</a>
    <a href="/games/stats.html">🏆 Stats</a>
</div>

<h1>🔤 Word Search</h1>
<p class="subtitle">Find all the hidden words in the grid!</p>

<div class="player-bar">
    <span class="player-avatar" id="player-avatar"></span>
    <span class="player-name" id="player-name"></span>
    <span class="xp-badge" id="xp-badge">Lv 1</span>
    <span class="xp-bar-wrap"><span class="xp-bar-fill" id="xp-bar-fill"></span></span>
    <a href="/games/stats.html" class="stats-link-sm">🏆 Stats</a>
</div>

<div class="container">
    <div class="card">
        <div class="ws-stats">Found: <strong id="found-count">0</strong>/<strong id="total-count">0</strong></div>
        <div class="word-list" id="word-list"></div>
        <div class="grid" id="grid"></div>
        <button class="new-game-btn" onclick="newGame()">🔄 New Puzzle</button>
    </div>
</div>

<div class="confetti-container" id="confetti"></div>

<div class="container" style="margin-top:10px">
    <div class="card" style="text-align:center">
        <div class="recommend-label">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="/games/scramble.html" class="recommend-card"><div style="font-size:28px;margin-bottom:4px">🔤</div><div class="recommend-title">Word Scramble</div><div class="recommend-desc">Unscramble words</div></a>
            <a href="/games/pattern.html" class="recommend-card"><div style="font-size:28px;margin-bottom:4px">🔴</div><div class="recommend-title">Pattern Match</div><div class="recommend-desc">Find sequences</div></a>
            <a href="/games/memory.html" class="recommend-card"><div style="font-size:28px;margin-bottom:4px">🃏</div><div class="recommend-title">Memory Match</div><div class="recommend-desc">Find pairs</div></a>
        </div>
    </div>
</div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}
function toggleTheme(){const l=document.body.classList.toggle('light-theme');localStorage.setItem('games_theme',l?'light':'dark');updThemeBtn()}
function updThemeBtn(){document.getElementById('theme-toggle').textContent=document.body.classList.contains('light-theme')?'🌙 Dark':'☀️ Light'}
(function(){if(localStorage.getItem('games_theme')!=='dark')document.body.classList.add('light-theme');updThemeBtn()})();
function fireConfetti(){const c=document.getElementById('confetti'),colors=['#667eea','#764ba2','#43e97b','#ffd700','#a78bfa'];for(let i=0;i<25;i++){const p=document.createElement('div');p.className='confetti-piece';p.style.left=(30+Math.random()*40)+'%';p.style.top=(20+Math.random()*30)+'%';p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.setProperty('--dx',(Math.random()*250-125)+'px');p.style.setProperty('--dy',(Math.random()*350+100)+'px');c.appendChild(p)}setTimeout(()=>{c.innerHTML=''},1600)}

const SIZE=10;
const wordBank=[
    ['KIND','HELP','LOVE','CARE','HOPE'],
    ['SMILE','BRAVE','CLEAN','POLITE','TRUTH'],
    ['SHARE','PEACE','FAITH','GENTLE','HAPPY'],
    ['HONEST','FRIEND','FAMILY','PRAYER','LISTEN'],
    ['RESPECT','PATIENT','COURAGE','STRONG','HEART']
];

let grid=[],words=[],foundWords=[],selecting=false,selectedCells=[];

function rand(min,max){return Math.floor(Math.random()*(max-min+1))+min}

function newGame(){
    // Pick 5-6 words
    const pool=wordBank[rand(0,wordBank.length-1)];
    words=[...pool].sort(()=>Math.random()-.5).slice(0,5);
    foundWords=[];
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(''));

    // Place words
    words.forEach(word=>placeWord(word));

    // Fill empty cells
    const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        if(!grid[r][c])grid[r][c]=letters[rand(0,25)];
    }

    renderGrid();
    renderWordList();
    document.getElementById('found-count').textContent='0';
    document.getElementById('total-count').textContent=words.length;
}

function placeWord(word){
    const directions=[[0,1],[1,0],[1,1],[0,-1],[1,-1]]; // right, down, diagonal-down-right, left, diagonal-down-left
    let placed=false,attempts=0;
    while(!placed&&attempts<200){
        attempts++;
        const dir=directions[rand(0,directions.length-1)];
        const r=rand(0,SIZE-1);
        const c=rand(0,SIZE-1);
        let fits=true;
        for(let i=0;i<word.length;i++){
            const nr=r+dir[0]*i,nc=c+dir[1]*i;
            if(nr<0||nr>=SIZE||nc<0||nc>=SIZE){fits=false;break;}
            if(grid[nr][nc]&&grid[nr][nc]!==word[i]){fits=false;break;}
        }
        if(fits){
            for(let i=0;i<word.length;i++){
                grid[r+dir[0]*i][c+dir[1]*i]=word[i];
            }
            placed=true;
        }
    }
    // If can't place after 200 attempts, force horizontal
    if(!placed){
        const r=rand(0,SIZE-1);
        const c=rand(0,SIZE-word.length);
        for(let i=0;i<word.length;i++)grid[r][c+i]=word[i];
    }
}

function renderGrid(){
    const el=document.getElementById('grid');
    el.style.gridTemplateColumns=`repeat(${SIZE},34px)`;
    let html='';
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
        html+=`<div class="cell" data-r="${r}" data-c="${c}" 
            onmousedown="startSelect(${r},${c})" 
            onmouseenter="moveSelect(${r},${c})"
            ontouchstart="startSelect(${r},${c})"
            ontouchmove="touchMove(event)">${grid[r][c]}</div>`;
    }
    el.innerHTML=html;
    document.addEventListener('mouseup',endSelect);
    document.addEventListener('touchend',endSelect);
}

function renderWordList(){
    document.getElementById('word-list').innerHTML=words.map(w=>
        `<span class="word-tag${foundWords.includes(w)?' found':''}" id="tag-${w}">${w}</span>`
    ).join('');
}

function startSelect(r,c){
    selecting=true;
    selectedCells=[{r,c}];
    highlightSelected();
}

function moveSelect(r,c){
    if(!selecting)return;
    // Only allow straight lines
    const first=selectedCells[0];
    const dr=Math.sign(r-first.r),dc=Math.sign(c-first.c);
    if(dr===0&&dc===0){selectedCells=[first];highlightSelected();return;}
    
    const newCells=[first];
    let cr=first.r+dr,cc=first.c+dc;
    while(cr!==r+dr||cc!==c+dc){
        if(cr<0||cr>=SIZE||cc<0||cc>=SIZE)break;
        newCells.push({r:cr,c:cc});
        cr+=dr;cc+=dc;
    }
    selectedCells=newCells;
    highlightSelected();
}

function touchMove(e){
    e.preventDefault();
    const touch=e.touches[0];
    const el=document.elementFromPoint(touch.clientX,touch.clientY);
    if(el&&el.dataset.r!==undefined){
        moveSelect(parseInt(el.dataset.r),parseInt(el.dataset.c));
    }
}

function highlightSelected(){
    document.querySelectorAll('.cell').forEach(c=>c.classList.remove('selected'));
    selectedCells.forEach(({r,c})=>{
        const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
        if(cell)cell.classList.add('selected');
    });
}

function endSelect(){
    if(!selecting)return;
    selecting=false;
    
    // Check if selected cells form a word
    const selectedWord=selectedCells.map(({r,c})=>grid[r][c]).join('');
    const reversedWord=selectedCells.map(({r,c})=>grid[r][c]).reverse().join('');
    
    let found=null;
    if(words.includes(selectedWord)&&!foundWords.includes(selectedWord))found=selectedWord;
    else if(words.includes(reversedWord)&&!foundWords.includes(reversedWord))found=reversedWord;
    
    if(found){
        foundWords.push(found);
        selectedCells.forEach(({r,c})=>{
            const cell=document.querySelector(`.cell[data-r="${r}"][data-c="${c}"]`);
            if(cell){cell.classList.add('found');cell.classList.remove('selected');}
        });
        document.getElementById('tag-'+found).classList.add('found');
        document.getElementById('found-count').textContent=foundWords.length;
        
        if(foundWords.length===words.length){
            fireConfetti();
            earnXP(20);
            setTimeout(()=>alert('🎉 All words found! Great job!'),500);
        }
    } else {
        document.querySelectorAll('.cell.selected').forEach(c=>c.classList.remove('selected'));
    }
    selectedCells=[];
}

// --- XP SYSTEM ---
const XP_THRESHOLDS=[0,50,120,200,300,420,560,720,900,1100];
function getXP(){return parseInt(localStorage.getItem('games_xp')||'0')}
function saveXP(xp){localStorage.setItem('games_xp',String(xp))}
function earnXP(amount){const xp=getXP()+amount;saveXP(xp);renderXPBar();return xp;}
function calcLevel(xp){let level=1;for(let i=1;i<=100;i++){const thresh=i<=10?XP_THRESHOLDS[i-1]:(XP_THRESHOLDS[9]+((i-10)*(220+(i-10)*20)));if(xp>=thresh)level=i;else break;}const currentThresh=level<=10?XP_THRESHOLDS[level-1]:(XP_THRESHOLDS[9]+((level-10)*(220+(level-10)*20)));const nextThresh=(level+1)<=10?XP_THRESHOLDS[level]:(XP_THRESHOLDS[9]+((level-1+1-10)*(220+(level-1+1-10)*20)));const progress=(xp-currentThresh)/(nextThresh-currentThresh);return{level,xp,currentThresh,nextThresh,progress:Math.min(1,Math.max(0,progress))};}
function renderXPBar(){const info=calcLevel(getXP());document.getElementById('xp-badge').textContent='Lv '+info.level;document.getElementById('xp-bar-fill').style.width=(info.progress*100)+'%';}

document.getElementById('player-name').textContent=localStorage.getItem('games_player_name')||'Player';
(function(){const av=localStorage.getItem('games_avatar');document.getElementById('player-avatar').innerHTML=av?'<img src="'+av+'">':'👋'})();
renderXPBar();
newGame();
</script>
</body>
</html>
