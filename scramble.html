<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔤 Word Scramble</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
    background-attachment:fixed;
    margin:0;padding:15px;min-height:100vh;
}
h1{text-align:center;color:#fff;font-size:2rem;text-shadow:0 2px 10px rgba(0,0,0,.3);margin:60px 0 10px}
.subtitle{text-align:center;color:rgba(255,255,255,.8);font-size:.9rem;margin-bottom:20px}
.card{
    background:rgba(255,255,255,.92);backdrop-filter:blur(15px);border-radius:24px;
    padding:30px;margin:0 auto;max-width:550px;
    box-shadow:0 10px 40px rgba(0,0,0,.12);border:1px solid rgba(255,255,255,.5);
    text-align:center;animation:fadeInUp .5s ease forwards;
}
.card h3{color:#4a1a7a;margin-bottom:10px}
@keyframes fadeInUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}

.scramble-word{
    font-size:2.5rem;letter-spacing:8px;font-weight:bold;color:#764ba2;
    margin:25px 0;font-family:monospace;
}
.scramble-input{
    padding:14px 20px;font-size:18px;border:2px solid #e0d4f5;border-radius:14px;
    width:80%;max-width:300px;text-align:center;background:#fff;transition:border-color .3s;
}
.scramble-input:focus{outline:none;border-color:#764ba2;box-shadow:0 0 0 4px rgba(118,75,162,.15)}
.hint{color:#888;font-size:13px;margin-top:10px;font-style:italic}
.score{margin-top:15px;font-size:14px;color:#4a1a7a;font-weight:bold}
.bonus{color:#27ae60;font-weight:bold;font-size:16px;margin-top:8px}

button{border:none;border-radius:12px;padding:10px 16px;margin:6px;font-size:13px;font-weight:600;cursor:pointer;transition:transform .2s}
button:hover{transform:scale(1.05)}
.skip-btn{background:linear-gradient(135deg,#ff5252,#f48fb1);color:#fff;margin-top:12px}
.again-btn{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;margin-top:12px}

/* Player bar */
.player-bar{
    position:fixed;bottom:15px;left:15px;z-index:100;
    display:flex;align-items:center;gap:10px;
    padding:8px 14px;
    background:rgba(255,255,255,.9);border:1px solid rgba(0,0,0,.08);
    border-radius:12px;backdrop-filter:blur(10px);
    box-shadow:0 4px 15px rgba(0,0,0,.1);
}
.player-name{font-size:12px;font-weight:600;color:#4a1a7a}
.stats-link-sm{
    font-size:11px;font-weight:700;color:#764ba2;text-decoration:none;
    padding:4px 10px;border-radius:8px;
    background:rgba(118,75,162,.08);border:1px solid rgba(118,75,162,.2);
    transition:all .2s;
}
.stats-link-sm:hover{background:rgba(118,75,162,.15)}

/* Fixed back button */
.back-btn{
    position:fixed;top:15px;right:15px;z-index:100;
    display:inline-flex;align-items:center;gap:6px;
    padding:10px 18px;
    background:rgba(255,255,255,.9);
    color:#4a1a7a;
    border-radius:12px;
    text-decoration:none;font-weight:bold;font-size:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    transition:transform .2s, box-shadow .2s;
}
.back-btn:hover{transform:scale(1.05);box-shadow:0 6px 20px rgba(0,0,0,.2)}

/* Sidebar */
.menu-toggle{position:fixed;top:15px;left:15px;z-index:100;background:rgba(255,255,255,.9);border:none;border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.15);transition:transform .2s}
.menu-toggle:hover{transform:scale(1.1)}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:rgba(255,255,255,.97);backdrop-filter:blur(20px);z-index:99;padding:70px 20px 20px;box-shadow:4px 0 30px rgba(0,0,0,.15);transition:left .3s ease;border-radius:0 20px 20px 0}
.sidebar.open{left:0}
.sidebar a{display:block;padding:14px 16px;margin:6px 0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;color:#4a1a7a;transition:background .2s}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:98;display:none}
.overlay.open{display:block}

/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}
@keyframes confettiFall{0%{transform:translate(0,0) rotate(0deg);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}

@media(max-width:500px){h1{font-size:1.5rem;margin-top:50px}.card{padding:20px}.scramble-word{font-size:1.8rem;letter-spacing:5px}}
</style>
</head>
<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">

    <a href="counting.html">🔢 Counting</a>
    <a href="learning.html">📚 Learning</a>
    <a href="kindness.html">🫂 Be Kind</a>
    <a href="games.html" class="active">🎮 Games</a>
    <a href="sos.html">🚨 SOS Police</a>
</div>

<h1>🔤 Word Scramble</h1>
<p class="subtitle">Unscramble the letters to reveal good character words!</p>

<div class="player-bar">
    <span class="player-name" id="player-name"></span>
    <a href="stats.html" class="stats-link-sm">🏆 Stats</a>
</div>

<div class="card">
    <div id="game-area"></div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}

// Audio
function makeWav(freq,duration){
    const sr=8000,samples=Math.floor(sr*duration),buffer=new ArrayBuffer(44+samples*2),v=new DataView(buffer);
    const s=(str,o)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
    s('RIFF',0);v.setUint32(4,36+samples*2,true);s('WAVE',8);s('fmt ',12);v.setUint32(16,16,true);
    v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);
    v.setUint16(32,2,true);v.setUint16(34,16,true);s('data',36);v.setUint32(40,samples*2,true);
    for(let i=0;i<samples;i++){const t=i/sr;const env=Math.max(0,1-t/duration);
    v.setInt16(44+i*2,Math.sin(2*Math.PI*freq*t)*env*16000,true);}
    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}
const dingAudio=new Audio(makeWav(1000,.25));
const boopAudio=new Audio(makeWav(180,.2));
function playDing(){dingAudio.currentTime=0;dingAudio.play().catch(()=>{});}
function playBoop(){boopAudio.currentTime=0;boopAudio.play().catch(()=>{});}

function fireConfetti(){
    const c=document.getElementById('confetti'),colors=['#667eea','#764ba2','#f093fb','#43e97b','#ffd700','#ff5252'];
    for(let i=0;i<25;i++){const p=document.createElement('div');p.className='confetti-piece';
    p.style.left=(30+Math.random()*40)+'%';p.style.top=(20+Math.random()*30)+'%';
    p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.setProperty('--dx',(Math.random()*250-125)+'px');p.style.setProperty('--dy',(Math.random()*350+100)+'px');
    c.appendChild(p);}setTimeout(()=>{c.innerHTML=''},1600);
}

// --- STATS & ACHIEVEMENTS SYSTEM ---
function getStats(){return JSON.parse(localStorage.getItem('games_stats')||'{"reaction":{"bestTime":null,"gamesPlayed":0,"totalReactions":0},"scramble":{"bestStreak":0,"wordsGuessed":0,"gamesPlayed":0},"rps":{"wins":0,"losses":0,"draws":0,"winStreak":0,"bestWinStreak":0,"gamesPlayed":0}}')}
function saveStats(s){localStorage.setItem('games_stats',JSON.stringify(s))}
function getHighscores(){return JSON.parse(localStorage.getItem('games_highscores')||'{"reaction":[],"scramble":[],"rps":[]}')}
function saveHighscores(h){localStorage.setItem('games_highscores',JSON.stringify(h))}
function getAchievements(){return JSON.parse(localStorage.getItem('games_achievements')||'[]')}
function unlockAchievement(id){
    const achs=getAchievements();
    if(achs.find(a=>a.id===id))return;
    achs.push({id,unlockedAt:new Date().toISOString().slice(0,10)});
    localStorage.setItem('games_achievements',JSON.stringify(achs));
    showAchievementPopup(id);
}
function getStreak(){return JSON.parse(localStorage.getItem('games_streak')||'{"lastPlayedDate":null,"currentStreak":0,"bestStreak":0,"history":[]}')}
function updatePlayStreak(){
    const s=getStreak();const today=new Date().toISOString().slice(0,10);
    if(s.lastPlayedDate===today)return;
    const yesterday=new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(s.lastPlayedDate===yesterday){s.currentStreak++;}
    else if(s.lastPlayedDate!==today){s.currentStreak=1;}
    s.lastPlayedDate=today;
    if(s.currentStreak>s.bestStreak)s.bestStreak=s.currentStreak;
    if(!s.history)s.history=[];
    if(!s.history.includes(today))s.history.push(today);
    if(s.history.length>30)s.history=s.history.slice(-30);
    localStorage.setItem('games_streak',JSON.stringify(s));
    if(s.currentStreak>=3)unlockAchievement('streak_3');
    if(s.currentStreak>=7)unlockAchievement('streak_7');
    if(s.currentStreak>=14)unlockAchievement('streak_14');
    if(s.currentStreak>=30)unlockAchievement('streak_30');
}
function showAchievementPopup(id){
    const names={first_game:'🎮 First Steps!',word_master:'📖 Word Master!',vocabulary:'🎓 Vocabulary Pro!',all_games:'🎯 Well Rounded!',streak_3:'🔥 On Fire!',streak_7:'💥 Dedicated!',streak_14:'🌟 Committed!',streak_30:'💎 Legend!'};
    const name=names[id]||'🏆 Achievement Unlocked!';
    const popup=document.createElement('div');
    popup.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);background:rgba(255,215,0,.15);border:1px solid rgba(255,215,0,.4);color:#ffd700;padding:12px 24px;border-radius:14px;font-weight:bold;font-size:14px;z-index:1000;backdrop-filter:blur(10px);animation:fadeInUp .4s ease';
    popup.textContent=name;
    document.body.appendChild(popup);
    setTimeout(()=>popup.remove(),3000);
}
function recordScrambleWord(){
    const stats=getStats();
    stats.scramble.wordsGuessed++;
    saveStats(stats);
    unlockAchievement('first_game');
    if(stats.scramble.wordsGuessed>=10)unlockAchievement('word_master');
    if(stats.scramble.wordsGuessed>=50)unlockAchievement('vocabulary');
    updatePlayStreak();
}
function recordScrambleGame(wordsThisRound){
    const stats=getStats();
    stats.scramble.gamesPlayed++;
    if(wordsThisRound>stats.scramble.bestStreak)stats.scramble.bestStreak=wordsThisRound;
    saveStats(stats);
    const hs=getHighscores();
    hs.scramble.push({value:wordsThisRound,date:new Date().toISOString().slice(0,10)});
    hs.scramble.sort((a,b)=>b.value-a.value);
    hs.scramble=hs.scramble.slice(0,5);
    saveHighscores(hs);
    if(stats.reaction.gamesPlayed>0&&stats.scramble.gamesPlayed>0&&stats.rps.gamesPlayed>0)
        unlockAchievement('all_games');
}

// Game
const words=[
    {word:'KINDNESS',hint:'Being nice to others'},{word:'PATIENCE',hint:'Waiting calmly'},
    {word:'HONESTY',hint:'Always telling the truth'},{word:'COURAGE',hint:'Being brave'},
    {word:'RESPECT',hint:'Treating others well'},{word:'SHARING',hint:'Giving to others'},
    {word:'HELPFUL',hint:'Lending a hand'},{word:'POLITE',hint:'Good manners'},
    {word:'GENTLE',hint:'Soft and careful'},{word:'FRIEND',hint:'Someone you play with'},
    {word:'CLEAN',hint:'Tidy and neat'},{word:'LISTEN',hint:'Using your ears'},
    {word:'PRAYER',hint:'Talking to Allah'},{word:'FAMILY',hint:'People you love at home'},
    {word:'SMILE',hint:'A happy face'},{word:'THANKS',hint:'Being grateful'},
    {word:'BRAVE',hint:'Not afraid'},{word:'TRUTH',hint:'What is real and honest'}
];

let current=null,score=0,used=[];

function shuffle(word){
    let arr=word.split('');
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
    if(arr.join('')===word&&word.length>1)return shuffle(word);
    return arr.join('');
}

function nextWord(){
    const available=words.filter(w=>!used.includes(w.word));
    if(!available.length){
        recordScrambleGame(score);
        document.getElementById('game-area').innerHTML=`
            <div style="font-size:48px;margin:20px 0">🎉</div>
            <h3 style="color:#27ae60">All words complete!</h3>
            <div class="score">Final Score: ${score}/${words.length} words solved</div>
            <button class="again-btn" onclick="score=0;used=[];nextWord()">🔄 Play Again</button>`;
        return;
    }
    current=available[Math.floor(Math.random()*available.length)];
    const scrambled=shuffle(current.word);
    document.getElementById('game-area').innerHTML=`
        <div class="scramble-word">${scrambled}</div>
        <input type="text" class="scramble-input" id="guess" placeholder="Type the word..."
            maxlength="${current.word.length}" oninput="checkGuess()" autocomplete="off" autocapitalize="characters">
        <div class="hint">💡 Hint: ${current.hint}</div>
        <div class="score">Solved: ${score} | Remaining: ${available.length}</div>
        <button class="skip-btn" onclick="skipWord()">Skip →</button>`;
    document.getElementById('guess').focus();
}

function checkGuess(){
    const guess=document.getElementById('guess').value.toUpperCase().trim();
    if(guess===current.word){
        playDing();score++;used.push(current.word);
        recordScrambleWord();
        document.getElementById('game-area').innerHTML=`
            <div style="font-size:48px;margin:20px 0">✅</div>
            <h3 style="color:#27ae60">Correct! "${current.word}"</h3>
            <div class="score">Solved: ${score}</div>`;
        fireConfetti();
        setTimeout(nextWord,1500);
    }
}

function skipWord(){
    playBoop();used.push(current.word);
    document.getElementById('game-area').innerHTML=`
        <div style="font-size:48px;margin:20px 0">⏭️</div>
        <h3>The word was: <strong style="color:#764ba2">${current.word}</strong></h3>`;
    setTimeout(nextWord,1200);
}

document.getElementById('player-name').textContent='👋 '+(localStorage.getItem('games_player_name')||'Player');
nextWord();
</script>

<div style="max-width:550px;margin:20px auto;padding:0 15px">
    <div style="background:rgba(255,255,255,.92);border-radius:20px;padding:20px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.1)">
        <div style="font-size:12px;color:#888;text-transform:uppercase;letter-spacing:1px;margin-bottom:12px">🎮 You might also like</div>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
            <a href="reaction.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;transition:all .2s;display:block">
                <div style="font-size:28px;margin-bottom:4px">⚡</div>
                <div style="font-size:13px;font-weight:700;color:#4a1a7a">Reaction Speed</div>
                <div style="font-size:10px;color:#888">Test your reflexes</div>
            </a>
            <a href="rps.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;transition:all .2s;display:block">
                <div style="font-size:28px;margin-bottom:4px">✊</div>

                <div style="font-size:10px;color:#888">Beat the computer</div>
            </a>
            <a href="memory.html" style="flex:1;min-width:120px;padding:14px;border-radius:14px;background:#f5f0ff;border:1px solid #e0d4f5;text-decoration:none;transition:all .2s;display:block">
                <div style="font-size:28px;margin-bottom:4px">🃏</div>

            </a>
        </div>
    </div>
</div>
