<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🏆 Stats & Achievements</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
    background:linear-gradient(135deg,#0f0c29 0%,#302b63 50%,#24243e 100%);
    background-attachment:fixed;
    margin:0;padding:15px;min-height:100vh;overflow-x:hidden;
}
.bg-glow{
    position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;
    background:
        radial-gradient(ellipse 500px 500px at 25% 25%, rgba(255,215,0,.12) 0%, transparent 70%),
        radial-gradient(ellipse 400px 400px at 75% 70%, rgba(102,126,234,.15) 0%, transparent 70%);
    animation:glowShift 8s ease-in-out infinite alternate;
}
@keyframes glowShift{0%{opacity:.7;transform:scale(1)}100%{opacity:1;transform:scale(1.05)}}

h1{
    position:relative;z-index:1;text-align:center;font-size:2.5rem;margin:60px 0 8px;
    background:linear-gradient(135deg,#ffd700,#fff,#ffd700);
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    font-weight:800;letter-spacing:-1px;
}
.subtitle{position:relative;z-index:1;text-align:center;color:rgba(255,255,255,.5);font-size:.9rem;margin-bottom:30px}

.container{max-width:700px;margin:0 auto;position:relative;z-index:1}

/* Collapsible Cards */
.card{
    background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border-radius:22px;
    padding:0;margin-bottom:20px;border:1px solid rgba(255,255,255,.1);
    box-shadow:0 10px 40px rgba(0,0,0,.2);overflow:hidden;
}
.card-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 25px;cursor:pointer;user-select:none;transition:background .2s;
}
.card-header:hover{background:rgba(255,255,255,.03)}
.card-header h2{color:#fff;font-size:1.2rem;margin:0;display:flex;align-items:center;gap:8px}
.card-toggle{
    width:32px;height:32px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.5);font-size:14px;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    transition:transform .3s ease,background .2s,color .2s;
}
.card-header:hover .card-toggle{background:rgba(255,255,255,.1);color:#fff}
.card.expanded .card-toggle{transform:rotate(180deg)}
.card-preview{
    font-size:12px;color:rgba(255,255,255,.35);padding:0 25px;margin-top:-8px;
}
.card-body{
    max-height:0;overflow:hidden;transition:max-height .4s ease,padding .3s ease;
    padding:0 25px;
}
.card.expanded .card-body{
    max-height:3000px;padding:0 25px 25px;
}
.card-fade{
    height:30px;margin-top:-30px;position:relative;z-index:1;
    background:linear-gradient(to bottom,transparent,rgba(255,255,255,.03));
    pointer-events:none;border-radius:0 0 22px 22px;
    transition:opacity .3s;
}
.card.expanded .card-fade{opacity:0;height:0;margin:0}

/* Streak */
.streak-display{
    display:flex;align-items:center;justify-content:center;gap:20px;
    padding:20px;
}
.streak-number{font-size:4rem;font-weight:800;color:#ffd700;text-shadow:0 0 20px rgba(255,215,0,.4)}
.streak-info{text-align:left}
.streak-label{color:rgba(255,255,255,.5);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.streak-best{color:rgba(255,255,255,.7);font-size:13px;margin-top:4px}
.streak-calendar{display:flex;gap:4px;margin-top:12px;justify-content:center;flex-wrap:wrap}
.streak-day{
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:bold;
}
.streak-day.active{background:rgba(255,215,0,.2);color:#ffd700;border:1px solid rgba(255,215,0,.3)}
.streak-day.today{background:rgba(67,233,123,.2);color:#43e97b;border:1px solid rgba(67,233,123,.4)}
.streak-day.inactive{background:rgba(255,255,255,.05);color:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.05)}

/* Stats grid */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat-box{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:16px;text-align:center;
}
.stat-value{font-size:1.8rem;font-weight:800;color:#fff;display:block}
.stat-label{font-size:11px;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.stat-value.gold{color:#ffd700}
.stat-value.green{color:#43e97b}
.stat-value.purple{color:#a78bfa}

/* Achievements */
.achievements-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.achievement{
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    border-radius:14px;padding:14px;text-align:center;transition:all .2s;
}
.achievement.unlocked{
    border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.05);
}
.achievement.locked{opacity:.4}
.achievement-emoji{font-size:28px;display:block;margin-bottom:6px}
.achievement-name{font-size:12px;font-weight:bold;color:#fff;margin-bottom:3px}
.achievement-desc{font-size:10px;color:rgba(255,255,255,.4)}
.achievement-date{font-size:9px;color:rgba(255,215,0,.6);margin-top:4px}

/* High scores */
.highscore-list{list-style:none}
.highscore-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:10px 14px;margin:6px 0;border-radius:12px;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);
}
.highscore-item:first-child{border-color:rgba(255,215,0,.3);background:rgba(255,215,0,.06)}
.highscore-rank{font-size:16px;font-weight:bold;width:30px;color:rgba(255,255,255,.5)}
.highscore-item:first-child .highscore-rank{color:#ffd700}
.highscore-value{font-size:14px;font-weight:bold;color:#fff}
.highscore-date{font-size:11px;color:rgba(255,255,255,.3)}
.highscore-game{font-size:12px;color:rgba(255,255,255,.5)}

/* Back button */
.back-btn{
    position:fixed;top:15px;right:15px;z-index:100;
    display:inline-flex;align-items:center;gap:6px;padding:10px 18px;
    background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
    color:#fff;border-radius:12px;text-decoration:none;font-weight:bold;font-size:14px;
    backdrop-filter:blur(10px);box-shadow:0 4px 15px rgba(0,0,0,.2);transition:transform .2s,background .2s;
}
.back-btn:hover{transform:scale(1.05);background:rgba(255,255,255,.15)}

/* Sidebar */
.menu-toggle{position:fixed;top:15px;left:15px;z-index:100;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:12px;width:44px;height:44px;font-size:22px;cursor:pointer;box-shadow:0 4px 15px rgba(0,0,0,.2);transition:transform .2s,background .2s;backdrop-filter:blur(10px)}
.menu-toggle:hover{transform:scale(1.1);background:rgba(255,255,255,.15)}
.sidebar{position:fixed;top:0;left:-260px;width:250px;height:100%;background:rgba(15,12,41,.97);backdrop-filter:blur(20px);z-index:99;padding:70px 20px 20px;box-shadow:4px 0 30px rgba(0,0,0,.4);transition:left .3s ease;border-radius:0 20px 20px 0;border-right:1px solid rgba(255,255,255,.1)}
.sidebar.open{left:0}
.sidebar a{display:block;padding:14px 16px;margin:6px 0;border-radius:12px;text-decoration:none;font-size:15px;font-weight:600;color:rgba(255,255,255,.7);transition:background .2s,color .2s}
.sidebar a:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.5);z-index:98;display:none}
.overlay.open{display:block}

.empty-state{color:rgba(255,255,255,.4);font-size:13px;text-align:center;padding:20px}

/* Particles */
.particle{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;opacity:0;pointer-events:none;z-index:0;animation:particleFloat linear infinite}
@keyframes particleFloat{0%{opacity:0;transform:translateY(100vh)}10%{opacity:.3}90%{opacity:.3}100%{opacity:0;transform:translateY(-20px)}}

/* Level Roadmap — Winding Path */
.roadmap{position:relative;padding:10px 0 10px;overflow:hidden}
.roadmap svg.roadmap-svg{position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.roadmap-trail{fill:none;stroke:rgba(255,255,255,.08);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.roadmap-trail-fill{fill:none;stroke:url(#goldGrad);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 6px rgba(255,215,0,.3));transition:stroke-dashoffset .8s ease}

.roadmap-node{
    position:absolute;z-index:2;display:flex;align-items:center;gap:10px;
    transform:translate(-50%,-50%);
}
.roadmap-node.align-right{flex-direction:row}
.roadmap-node.align-left{flex-direction:row-reverse}

.roadmap-marker{
    width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;padding:8px;
    background:rgba(255,255,255,.06);border:3px solid rgba(255,255,255,.12);
    transition:all .4s ease;z-index:2;position:relative;overflow:hidden;
}
.roadmap-node.reached .roadmap-marker{
    border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.12);
    box-shadow:0 0 16px rgba(255,215,0,.2);
}
.roadmap-node.current .roadmap-marker{
    border-color:#ffd700;background:rgba(255,215,0,.2);
    box-shadow:0 0 24px rgba(255,215,0,.4),0 0 48px rgba(255,215,0,.15);
    animation:currentPulse 2s ease-in-out infinite;
    transform:scale(1.15);
}
.roadmap-node.locked .roadmap-marker{opacity:.35}
@keyframes currentPulse{0%,100%{box-shadow:0 0 20px rgba(255,215,0,.4),0 0 40px rgba(255,215,0,.1)}50%{box-shadow:0 0 30px rgba(255,215,0,.6),0 0 60px rgba(255,215,0,.2)}}

.roadmap-info{white-space:nowrap}
.roadmap-node.align-right .roadmap-info{text-align:left}
.roadmap-node.align-left .roadmap-info{text-align:right}

.roadmap-level-tag{
    display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:1.5px;
    padding:2px 8px;border-radius:5px;margin-bottom:2px;
    background:rgba(255,255,255,.06);color:rgba(255,255,255,.35);
}
.roadmap-node.reached .roadmap-level-tag{background:rgba(255,215,0,.1);color:rgba(255,215,0,.7)}
.roadmap-node.current .roadmap-level-tag{background:rgba(255,215,0,.2);color:#ffd700}
.roadmap-title{font-size:13px;font-weight:700;color:rgba(255,255,255,.3);margin-bottom:1px}
.roadmap-node.reached .roadmap-title{color:rgba(255,255,255,.7)}
.roadmap-node.current .roadmap-title{color:#fff}
.roadmap-xp{font-size:10px;color:rgba(255,255,255,.2)}
.roadmap-node.reached .roadmap-xp{color:rgba(255,255,255,.4)}
.roadmap-node.current .roadmap-xp{color:rgba(255,215,0,.6)}
.roadmap-status{font-size:10px;margin-top:1px}

.roadmap-check{
    position:absolute;bottom:-2px;right:-2px;width:16px;height:16px;border-radius:50%;
    background:#43e97b;color:#fff;font-size:9px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(67,233,123,.4);
}

/* Decorative dots along the path */
.path-dot{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(255,255,255,.06);transform:translate(-50%,-50%);z-index:1;
}
.path-dot.lit{background:rgba(255,215,0,.25);box-shadow:0 0 6px rgba(255,215,0,.15)}

/* Current level hero banner */
.level-hero{
    display:flex;align-items:center;gap:18px;padding:20px;
    background:linear-gradient(135deg,rgba(255,215,0,.08),rgba(255,170,0,.04));
    border:1px solid rgba(255,215,0,.15);border-radius:16px;margin-bottom:20px;
}
.level-hero-icon{width:56px;height:56px;flex-shrink:0;filter:drop-shadow(0 4px 12px rgba(255,215,0,.3))}
.level-hero-details{flex:1}
.level-hero-rank{font-size:22px;font-weight:800;color:#fff;margin-bottom:2px}
.level-hero-xp{font-size:13px;color:rgba(255,255,255,.5)}
.level-hero-xp strong{color:#ffd700}
.level-progress-track{
    width:100%;height:10px;border-radius:5px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden;
}
.level-progress-fill{
    height:100%;border-radius:5px;
    background:linear-gradient(90deg,#ffd700,#ffaa00);
    transition:width .6s ease;
    box-shadow:0 0 10px rgba(255,215,0,.4);
}
.level-progress-text{font-size:10px;color:rgba(255,255,255,.35);margin-top:4px;text-align:right}

/* Stars decoration for reached nodes */
.roadmap-check{
    position:absolute;bottom:-2px;right:-2px;width:18px;height:18px;border-radius:50%;
    background:#43e97b;color:#fff;font-size:10px;font-weight:bold;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 2px 8px rgba(67,233,123,.4);
}

@media(max-width:500px){
    h1{font-size:2rem;margin-top:50px}
    .card-body{padding:0 15px}
    .card.expanded .card-body{padding:0 15px 20px}
    .stats-grid{grid-template-columns:repeat(2,1fr)}
    .achievements-grid{grid-template-columns:repeat(2,1fr)}
    .streak-number{font-size:3rem}
    .level-hero{flex-direction:column;text-align:center;gap:10px}
    .roadmap-marker{width:40px;height:40px;padding:6px}
    .roadmap-title{font-size:11px}
    .roadmap-level-tag{font-size:8px;padding:2px 6px}
    .roadmap-xp{font-size:9px}
    .roadmap-status{font-size:9px}
}
</style>
</head>

<h1>🏆 Stats & Achievements</h1>
<p class="subtitle">Your gaming journey so far!</p>

<div class="container" id="content"></div>

<script>
function toggleMenu(){document.getElementById('sidebar').classList.toggle('open');document.getElementById('overlay').classList.toggle('open')}

// Particles
for(let i=0;i<12;i++){const p=document.createElement('div');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(8+Math.random()*12)+'s';p.style.animationDelay=Math.random()*10+'s';p.style.width=(2+Math.random()*2)+'px';p.style.height=p.style.width;document.body.appendChild(p)}

// --- DATA ---
function getStats(){return JSON.parse(localStorage.getItem('games_stats')||'{"reaction":{"bestTime":null,"gamesPlayed":0,"totalReactions":0},"scramble":{"bestStreak":0,"wordsGuessed":0,"gamesPlayed":0}}')}
function getAchievements(){return JSON.parse(localStorage.getItem('games_achievements')||'[]')}
function getStreak(){return JSON.parse(localStorage.getItem('games_streak')||'{"lastPlayedDate":null,"currentStreak":0,"bestStreak":0,"history":[]}')}
function getHighscores(){return JSON.parse(localStorage.getItem('games_highscores')||'{"reaction":[],"scramble":[]}')}

// --- XP SYSTEM ---
const XP_THRESHOLDS=[0,250,600,1000,1500,2100,2800,3600,4500,5500];
function getXP(){return parseInt(localStorage.getItem('games_xp')||'0')}
function calcLevel(xp){
    let level=1;
    for(let i=1;i<=100;i++){
        const thresh=i<=10?XP_THRESHOLDS[i-1]:(XP_THRESHOLDS[9]+((i-10)*(1100+(i-10)*100)));
        if(xp>=thresh)level=i;else break;
    }
    const currentThresh=level<=10?XP_THRESHOLDS[level-1]:(XP_THRESHOLDS[9]+((level-10)*(1100+(level-10)*100)));
    const nextThresh=(level+1)<=10?XP_THRESHOLDS[level]:(XP_THRESHOLDS[9]+((level-1+1-10)*(1100+(level-1+1-10)*100)));
    const progress=(xp-currentThresh)/(nextThresh-currentThresh);
    return{level,xp,currentThresh,nextThresh,progress:Math.min(1,Math.max(0,progress))};
}

const LEVEL_ICONS={
    1:`<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="42" r="12" fill="#4ade80" opacity=".2"/><path d="M32 16c-2 0-3 1-3 3v8c-4 2-7 6-7 11 0 7 4.5 12 10 12s10-5 10-12c0-5-3-9-7-11v-8c0-2-1-3-3-3z" fill="#4ade80"/><path d="M30 19v8.5a1 1 0 0 0 .5.9C34 30 37 33.5 37 38c0 5-2.2 8-5 8" fill="none" stroke="#166534" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="28" cy="33" rx="2.5" ry="3.5" fill="#166534" opacity=".15" transform="rotate(-15 28 33)"/></svg>`,
    2:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 10L18 40h10l-4 14 20-22H34l6-22z" fill="#60a5fa"/><path d="M32 10L18 40h10l-4 14 20-22H34l6-22z" fill="none" stroke="#1e40af" stroke-width="1.5" stroke-linejoin="round"/><path d="M28 40l-4 14 20-22H34" fill="#3b82f6" opacity=".5"/></svg>`,
    3:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 8L12 28l20 4L24 56l20-24-16-4z" fill="#f97316"/><path d="M32 8L12 28l20 4L24 56l20-24-16-4z" fill="none" stroke="#9a3412" stroke-width="1.5" stroke-linejoin="round"/><path d="M32 32l-8 24 20-24z" fill="#ea580c" opacity=".4"/></svg>`,
    4:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M32 8L14 30h12v22h12V30h12z" fill="#a78bfa"/><path d="M32 8L14 30h12v22h12V30h12z" fill="none" stroke="#5b21b6" stroke-width="1.5" stroke-linejoin="round"/><path d="M26 30v22h12V30" fill="#8b5cf6" opacity=".3"/><circle cx="32" cy="38" r="5" fill="#5b21b6" opacity=".2"/><path d="M30 36l2 2 4-4" fill="none" stroke="#5b21b6" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
    5:`<svg viewBox="0 0 64 64" width="100%" height="100%"><circle cx="32" cy="32" r="20" fill="#ef4444" opacity=".15"/><path d="M20 22c0-4 5-10 12-10s12 6 12 10c0 6-5 8-6 14h-12c-1-6-6-8-6-14z" fill="#ef4444"/><path d="M26 46c0 3 2.7 8 6 8s6-5 6-8" fill="#ef4444"/><path d="M26 36h12" stroke="#991b1b" stroke-width="1" stroke-linecap="round" opacity=".3"/><circle cx="27" cy="28" r="2" fill="#fff" opacity=".3"/></svg>`,
    6:`<svg viewBox="0 0 64 64" width="100%" height="100%"><path d="M10 40c4-6 10-8 14-6 2-8 8-14 16-14 6 0 10 4 12 8 4-1 6 2 4 6-2 6-10 14-22 18S8 48 10 40z" fill="#22d3ee"/><path d="M10 40c4-6 10-8 14-6 2-8 8-14 16-14 6 0 10 4 12 8" fill="none" stroke="#0e7490" stroke-width="1.5" stroke-linecap="round"/><circle cx="40" cy="28" r="2.5" fill="#0e7490"/><circle cx="40" cy="28" r="1" fill="#fff"/><path d="M16 42c6 4 20 6 30-2" fill="none" stroke="#0e7490" stroke-width="1" stroke-linecap="round" opacity=".3"/></svg>`,

function renderStreakCalendar(streak){
    const today=new Date();
    let html='';
    for(let i=6;i>=0;i--){
        const d=new Date(today);
        d.setDate(d.getDate()-i);
        const dateStr=d.toISOString().slice(0,10);
        const dayName=['Su','Mo','Tu','We','Th','Fr','Sa'][d.getDay()];
        const isToday=i===0;
        const wasPlayed=streak.history&&streak.history.includes(dateStr);
        let cls='streak-day ';
        if(isToday&&wasPlayed) cls+='today';
        else if(wasPlayed) cls+='active';
        else cls+='inactive';
        html+=`<div class="${cls}">${dayName}</div>`;
    }
    return html;
}

function buildRoadmap(currentLvl, xp, progress){
    // 10 nodes on a winding S-curve path, bottom (level 1) to top (level 10)
    const W=650, H=720;
    const padX=80, padY=50;
    const usableW=W-padX*2;

    // Node positions snake: row 0 at bottom, row 9 at top
    // Even rows go left→right, odd rows go right→left
    const nodes=[];
    const rowH=(H-padY*2)/9;
    for(let i=0;i<10;i++){
        const row=i; // 0=bottom level 1, 9=top level 10
        const y=H-padY-(row*rowH);
        // Snake: even rows left, odd rows right
        const cols=[0.2, 0.5, 0.8]; // 3 columns
        let xPct;
        if(row%2===0) xPct=0.2;   // left side
        else xPct=0.8;             // right side
        // Add slight variation for visual interest
        if(row===0) xPct=0.5;     // start centered
        if(row===9) xPct=0.5;     // end centered
        if(row===1) xPct=0.75;
        if(row===2) xPct=0.25;
        if(row===3) xPct=0.78;
        if(row===4) xPct=0.22;
        if(row===5) xPct=0.75;
        if(row===6) xPct=0.28;
        if(row===7) xPct=0.72;
        if(row===8) xPct=0.35;

        const x=padX+(usableW*xPct);
        nodes.push({x,y,level:i+1});
    }

    // Build SVG path through all nodes using smooth curves
    let pathD=`M ${nodes[0].x} ${nodes[0].y}`;
    for(let i=1;i<nodes.length;i++){
        const prev=nodes[i-1];
        const curr=nodes[i];
        const cpY=(prev.y+curr.y)/2;
        pathD+=` C ${prev.x} ${cpY}, ${curr.x} ${cpY}, ${curr.x} ${curr.y}`;
    }

    // Calculate filled portion of path
    const filledLevels=currentLvl-1+progress;
    const fillFraction=Math.min(1,filledLevels/9);

    // Build decorative dots between nodes
    let dotsHTML='';
    for(let i=0;i<nodes.length-1;i++){
        const a=nodes[i], b=nodes[i+1];
        for(let t=0.25;t<=0.75;t+=0.25){
            // Approximate point on the curve
            const dotX=a.x+(b.x-a.x)*t;
            const dotY=a.y+(b.y-a.y)*t;
            const lit=i<currentLvl-1||(i===currentLvl-1&&t<=progress);
            dotsHTML+=`<div class="path-dot${lit?' lit':''}" style="left:${(dotX/W)*100}%;top:${(dotY/H)*100}%"></div>`;
        }
    }

    // Scenic decorations along the path
    const scenery=[
        {x:8,  y:88, icon:'🌲', size:16, op:.25},
        {x:90, y:82, icon:'🌳', size:14, op:.2},
        {x:6,  y:70, icon:'🌿', size:12, op:.15},
        {x:92, y:58, icon:'🌲', size:15, op:.2},
        {x:10, y:48, icon:'🏔️', size:18, op:.15},
        {x:88, y:38, icon:'☁️', size:14, op:.2},
        {x:5,  y:28, icon:'🌲', size:13, op:.2},
        {x:93, y:18, icon:'☁️', size:16, op:.15},
        {x:50, y:5,  icon:'⭐', size:18, op:.25},
        {x:15, y:55, icon:'🍃', size:10, op:.12},
        {x:85, y:72, icon:'🍃', size:11, op:.12},
        {x:48, y:92, icon:'🚩', size:13, op:.3},
        {x:52, y:2,  icon:'🏁', size:15, op:.3},
    ];
    let sceneryHTML='';
    scenery.forEach(s=>{
        sceneryHTML+=`<div style="position:absolute;left:${s.x}%;top:${s.y}%;font-size:${s.size}px;opacity:${s.op};pointer-events:none;transform:translate(-50%,-50%);z-index:0">${s.icon}</div>`;
    });

    // Build node HTML
    let nodesHTML='';
    const reversed=[...LEVEL_CONFIG].slice(); // level 1..10
    reversed.forEach((cfg,i)=>{
        const n=nodes[i];
        let state='locked';
        if(cfg.level<currentLvl) state='reached';
        else if(cfg.level===currentLvl) state='current';

        const alignRight=n.x<W/2;
        const align=alignRight?'align-right':'align-left';

        let statusHTML='';
        if(state==='current') statusHTML=`<div class="roadmap-status" style="color:rgba(255,215,0,.7);font-weight:700">⭐ YOU ARE HERE</div>`;
        else if(state==='locked') statusHTML=`<div class="roadmap-status" style="color:rgba(255,255,255,.2)">${(cfg.xp-xp).toLocaleString()} XP to go</div>`;
        else statusHTML=`<div class="roadmap-status" style="color:rgba(67,233,123,.6)">✅ Done</div>`;

        nodesHTML+=`<div class="roadmap-node ${state} ${align}" style="left:${(n.x/W)*100}%;top:${(n.y/H)*100}%">
            <div style="position:relative">
                <div class="roadmap-marker">${cfg.icon}</div>
                ${state==='reached'?'<div class="roadmap-check">✓</div>':''}
            </div>
            <div class="roadmap-info">
                <div class="roadmap-level-tag">Level ${cfg.level}</div>
                <div class="roadmap-title">${cfg.title}</div>
                <div class="roadmap-xp">${cfg.xp.toLocaleString()} XP</div>
                ${statusHTML}
            </div>
        </div>`;
    });

    return `<div class="roadmap" style="position:relative;width:100%;padding-top:${(H/W)*100}%">
        <div style="position:absolute;top:0;left:0;width:100%;height:100%">
            <svg class="roadmap-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="goldGrad" x1="0" y1="1" x2="0" y2="0">
                        <stop offset="0%" stop-color="#ffd700"/>
                        <stop offset="100%" stop-color="#ffaa00"/>
                    </linearGradient>
                </defs>
                <path class="roadmap-trail" d="${pathD}"/>
                <path class="roadmap-trail-fill" d="${pathD}"
                    stroke-dasharray="2000"
                    stroke-dashoffset="${2000-(2000*fillFraction)}"/>
            </svg>
            ${sceneryHTML}
            ${dotsHTML}
            ${nodesHTML}
        </div>
    </div>`;
}

function toggleCard(id){
    const card=document.getElementById(id);
    if(!card) return;
    card.classList.toggle('expanded');
}

render();
</script>
</body>
</html>
