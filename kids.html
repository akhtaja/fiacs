<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adventure Quest</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg,#667eea 0%,#764ba2 50%,#f093fb 100%);
    background-attachment:fixed;
    margin:0;
    padding:15px;
    min-height:100vh;
    overflow-x:hidden;
}

h2{
    text-align:center;
    color:#fff;
    font-size:1.8rem;
    text-shadow:0 2px 10px rgba(0,0,0,.3);
    margin-bottom:15px;
}

/* Floating background */
.floaters{
    position:fixed;
    top:0;left:0;
    width:100%;height:100%;
    pointer-events:none;
    z-index:0;
    overflow:hidden;
}

.floater{
    position:absolute;
    opacity:.2;
    animation: floatAcross linear infinite;
}

@keyframes floatAcross{
    from{transform:translateX(-60px) rotate(0deg)}
    to{transform:translateX(calc(100vw + 60px)) rotate(360deg)}
}

/* Setup screen */
#setup{
    max-width:420px;
    margin:60px auto;
    background:rgba(255,255,255,.95);
    backdrop-filter:blur(20px);
    border-radius:24px;
    padding:40px 30px;
    box-shadow:0 20px 60px rgba(0,0,0,.2);
    text-align:center;
    animation: fadeInUp .6s ease forwards;
}

#setup h2{
    color:#4a1a7a;
    font-size:2rem;
    margin-bottom:8px;
    text-shadow:none;
}

#setup p{
    color:#666;
    margin-bottom:20px;
}

#setup input{
    display:block;
    width:100%;
    padding:14px 16px;
    margin:10px 0;
    border:2px solid #e0d4f5;
    border-radius:14px;
    font-size:16px;
    background:#faf8ff;
    transition:border-color .3s, box-shadow .3s;
}

#setup input:focus{
    outline:none;
    border-color:#764ba2;
    box-shadow:0 0 0 4px rgba(118,75,162,.15);
}

#setup .start-btn{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:white;
    border:none;
    border-radius:16px;
    padding:16px 40px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    margin-top:20px;
    box-shadow:0 8px 25px rgba(118,75,162,.4);
    transition:transform .2s;
}

#setup .start-btn:hover{transform:scale(1.05) translateY(-2px)}

#setup .add-kid-btn{
    background:linear-gradient(135deg,#43e97b,#38f9d7);
    color:#1a5c3a;
    border:none;
    border-radius:12px;
    padding:12px 24px;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    margin-top:12px;
    transition:transform .2s;
}

#setup .add-kid-btn:hover{transform:scale(1.05)}

/* Avatar picker */
.avatar-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin:8px 0;
}

.avatar-row input{margin:0;flex:1}

.avatar-pick{
    font-size:28px;
    cursor:pointer;
    padding:4px;
    border-radius:10px;
    border:2px solid transparent;
    transition:border-color .2s, transform .2s;
}

.avatar-pick:hover{transform:scale(1.2)}
.avatar-pick.selected{border-color:#764ba2;background:#f0e6ff}

.reset-link{
    display:inline-block;
    margin-top:15px;
    color:rgba(255,255,255,.7);
    font-size:12px;
    cursor:pointer;
    text-decoration:underline;
    transition:color .2s;
}

.reset-link:hover{color:#fff}

/* Nav tabs */
.nav-tabs{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:15px;
    flex-wrap:wrap;
}

.nav-tabs button{
    background:rgba(255,255,255,.2);
    color:#fff;
    border:none;
    border-radius:12px;
    padding:10px 16px;
    font-size:13px;
    font-weight:bold;
    cursor:pointer;
    transition:background .2s, transform .2s;
}

.nav-tabs button:hover{background:rgba(255,255,255,.3);transform:scale(1.05)}
.nav-tabs button.active{background:rgba(255,255,255,.9);color:#4a1a7a}

/* Cards */
.card{
    position:relative;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(15px);
    border-radius:24px;
    padding:24px;
    margin:18px 0;
    box-shadow:0 10px 40px rgba(0,0,0,.12);
    opacity:0;
    animation: fadeInUp .5s ease forwards;
    z-index:1;
    border:1px solid rgba(255,255,255,.5);
}

.card:nth-child(1){animation-delay:0s}
.card:nth-child(2){animation-delay:.15s}
.card:nth-child(3){animation-delay:.3s}
.card:nth-child(4){animation-delay:.45s}
.card:nth-child(5){animation-delay:.6s}
.card:nth-child(6){animation-delay:.75s}
.card:nth-child(7){animation-delay:.9s}

.card h3{font-size:1.2rem;color:#4a1a7a;margin-bottom:5px}
.card h4{margin:12px 0 8px;font-size:.85rem;color:#888;text-transform:uppercase;letter-spacing:1px}

.name{display:flex;justify-content:space-between;align-items:center}

/* Streak */
.streak{
    font-size:14px;
    color:#ff9800;
    font-weight:bold;
    margin:4px 0;
}

/* Points pulse */
.points{font-size:24px;font-weight:bold;color:#667eea;transition:transform .2s}
.points-pulse{animation: pointsPop .4s ease}
.points-bad{animation: pointsBad .4s ease}

@keyframes pointsPop{
    0%{transform:scale(1);color:#667eea}
    50%{transform:scale(1.5);color:#ffd700}
    100%{transform:scale(1);color:#667eea}
}
@keyframes pointsBad{
    0%{transform:scale(1);color:#667eea}
    50%{transform:scale(1.5);color:#ff5252}
    100%{transform:scale(1);color:#667eea}
}

/* Badge */
.badge{
    font-size:18px;margin:8px 0;display:inline-block;
    padding:6px 14px;border-radius:20px;
    background:linear-gradient(135deg,#ffecd2,#fcb69f);
    color:#6b3a0a;font-weight:bold;
}

.glow{animation: glowPulse 1.5s ease}

@keyframes glowPulse{
    0%{box-shadow:0 0 0 rgba(255,215,0,0)}
    30%{box-shadow:0 0 25px rgba(255,215,0,.9), 0 0 50px rgba(255,215,0,.4)}
    100%{box-shadow:0 0 0 rgba(255,215,0,0)}
}

.goal-text{font-size:.9rem;color:#777;margin:8px 0}

/* Rewards */
.reward{
    display:inline-block;
    padding:4px 10px;
    border-radius:10px;
    font-size:12px;
    font-weight:bold;
    background:linear-gradient(135deg,#ffd700,#ffb347);
    color:#5d3a00;
    margin:4px 0;
}

.reward.earned{opacity:.5;text-decoration:line-through}

/* Daily Challenge */
.challenge{
    background:linear-gradient(135deg,#a18cd1,#fbc2eb);
    border-radius:14px;
    padding:14px;
    margin:12px 0;
    color:#3d1a6e;
    font-weight:bold;
    text-align:center;
}

.challenge button{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    margin-top:8px;
    padding:10px 20px;
    font-size:14px;
    border-radius:12px;
}

/* Track */
.milestone-container{margin:25px 0 15px}

.track{
    position:relative;
    border-radius:40px;
    background:linear-gradient(to right,#a8edea,#fed6e3,#ffecd2);
    border:3px solid rgba(255,255,255,.6);
    overflow:visible;
    box-shadow:inset 0 2px 8px rgba(0,0,0,.08), 0 4px 15px rgba(0,0,0,.1);
}

.track::before{
    content:"";position:absolute;top:50%;left:2%;
    width:96%;height:6px;background:rgba(0,0,0,.1);
    transform:translateY(-50%);border-radius:20px;
}

.runner{
    position:absolute;transform:translateX(-50%);
    transition:left .8s cubic-bezier(.34,1.56,.64,1);
    z-index:5;animation:bounce .6s ease infinite;text-align:center;
}

.runner-0{top:-10px}
.runner-1{top:34px}
.runner-2{top:78px}
.runner-3{top:122px}
.runner-4{top:166px}
.runner-5{top:210px}

.runner-label{
    display:block;font-size:10px;font-weight:bold;color:#4a1a7a;
    background:rgba(255,255,255,.9);border-radius:10px;
    padding:2px 6px;margin-top:1px;box-shadow:0 2px 6px rgba(0,0,0,.1);
}

.runner-emoji{
    font-size:30px;display:inline-block;
    transform:scaleX(-1);filter:drop-shadow(0 2px 4px rgba(0,0,0,.2));
}

.milestone{position:absolute;top:-22px;transform:translateX(-50%);text-align:center;font-size:34px}
.milestone span{display:block;font-size:12px;font-weight:bold;color:#764ba2}
.m15{left:30%}.m30{left:60%}.m50{left:100%}

@keyframes bounce{
    0%,100%{transform:translateX(-50%) translateY(0)}
    50%{transform:translateX(-50%) translateY(-6px)}
}

/* Buttons */
button{
    position:relative;overflow:hidden;border:none;border-radius:12px;
    padding:9px 12px;margin:4px;font-size:13px;font-weight:600;
    cursor:pointer;transition:transform .2s, box-shadow .2s;
}
button:hover{transform:scale(1.06) translateY(-1px)}
button:active{transform:scale(.97)}
button::after{
    content:"";position:absolute;top:50%;left:50%;
    width:0;height:0;border-radius:50%;
    background:rgba(255,255,255,.4);transform:translate(-50%,-50%);opacity:0;
}
button.ripple::after{animation:rippleEffect .5s ease}

@keyframes rippleEffect{
    0%{width:0;height:0;opacity:.6}
    100%{width:200px;height:200px;opacity:0}
}

.good{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;box-shadow:0 3px 10px rgba(67,233,123,.25)}
.bad{background:linear-gradient(135deg,#ff5252,#f48fb1);color:#fff;box-shadow:0 3px 10px rgba(255,82,82,.25)}
.team{background:linear-gradient(135deg,#667eea,#764ba2);color:white;width:100%;padding:14px;font-size:15px;border-radius:14px;box-shadow:0 6px 20px rgba(118,75,162,.3)}

/* Line Graph */
.history-layout{
    display:flex;
    gap:20px;
    margin-top:15px;
}

.history-individual{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
}

.history-combined{
    flex:1;
}

.history-label{
    font-size:13px;
    font-weight:bold;
    color:#4a1a7a;
    display:block;
    margin-bottom:4px;
}

.line-graph{
    background:#faf8ff;
    border-radius:14px;
    padding:8px;
}

.line-graph svg{
    width:100%;
    height:90px;
}

.legend{
    display:flex;
    gap:12px;
    margin-top:8px;
    flex-wrap:wrap;
}

.legend-item{
    font-size:11px;
    font-weight:bold;
    color:#555;
    display:flex;
    align-items:center;
    gap:4px;
}

.legend-dot{
    width:10px;height:10px;
    border-radius:50%;
    display:inline-block;
}

@media(max-width:600px){
    .history-layout{flex-direction:column}
}

/* Leaderboard */
.lb-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px;margin:6px 0;border-radius:14px;
    background:linear-gradient(135deg,#f5f0ff,#fff);
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.lb-row:first-child{background:linear-gradient(135deg,#ffd700,#ffb347);color:#5d3a00}
.lb-rank{font-size:20px;font-weight:bold;width:35px}
.lb-name{flex:1;font-weight:bold;color:#4a1a7a}
.lb-stat{font-size:13px;color:#666;text-align:right}

/* Confetti */
.confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:999}
.confetti-piece{position:absolute;width:10px;height:10px;border-radius:2px;animation:confettiFall 1.5s ease forwards}

@keyframes confettiFall{
    0%{transform:translate(0,0) rotate(0deg);opacity:1}
    100%{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}
}

/* Sidebar menu */
.menu-toggle{
    position:fixed;top:15px;left:15px;z-index:100;
    background:rgba(255,255,255,.9);border:none;border-radius:12px;
    width:44px;height:44px;font-size:22px;cursor:pointer;
    box-shadow:0 4px 15px rgba(0,0,0,.15);
    transition:transform .2s;
}
.menu-toggle:hover{transform:scale(1.1)}

.sidebar{
    position:fixed;top:0;left:-260px;width:250px;height:100%;
    background:rgba(255,255,255,.97);backdrop-filter:blur(20px);
    z-index:99;padding:70px 20px 20px;
    box-shadow:4px 0 30px rgba(0,0,0,.15);
    transition:left .3s ease;border-radius:0 20px 20px 0;
}
.sidebar.open{left:0}
.sidebar a{
    display:block;padding:14px 16px;margin:6px 0;
    border-radius:12px;text-decoration:none;
    font-size:15px;font-weight:600;color:#4a1a7a;
    transition:background .2s;
}
.sidebar a:hover{background:#f0e6ff}
.sidebar a.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.overlay{
    position:fixed;top:0;left:0;width:100%;height:100%;
    background:rgba(0,0,0,.3);z-index:98;display:none;
}
.overlay.open{display:block}

@keyframes fadeInUp{
    from{opacity:0;transform:translateY(20px)}
    to{opacity:1;transform:translateY(0)}
}

/* Mini Games */
.games-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:15px;
    margin-top:10px;
}

.game-card{
    background:linear-gradient(135deg,#f5f0ff,#fff);
    border-radius:18px;
    padding:20px;
    text-align:center;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
    border:2px solid transparent;
    transition:border-color .2s, transform .2s;
    cursor:pointer;
}

.game-card:hover{
    border-color:#764ba2;
    transform:translateY(-3px);
}

.game-card .game-icon{font-size:40px;margin-bottom:8px}
.game-card h4{color:#4a1a7a;margin-bottom:4px;font-size:1rem}
.game-card p{color:#888;font-size:12px;margin:0}

.game-area{
    background:#faf8ff;
    border-radius:18px;
    padding:25px;
    margin-top:12px;
    min-height:200px;
    text-align:center;
}

.game-back-btn{
    background:linear-gradient(135deg,#667eea,#764ba2);
    color:#fff;
    padding:10px 20px;
    border-radius:12px;
    font-size:13px;
    margin-bottom:15px;
}

/* Reaction Speed */
.reaction-box{
    width:200px;
    height:200px;
    margin:20px auto;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:18px;
    font-weight:bold;
    color:#fff;
    cursor:pointer;
    transition:background .2s, transform .1s;
    user-select:none;
}

.reaction-box.waiting{background:#e74c3c}
.reaction-box.ready{background:#27ae60;animation:pulse .5s ease infinite alternate}
.reaction-box.clicked{background:#3498db}

@keyframes pulse{
    from{transform:scale(1)}
    to{transform:scale(1.05)}
}

.reaction-results{
    margin-top:15px;
    font-size:14px;
    color:#4a1a7a;
}

.reaction-results .best{color:#27ae60;font-weight:bold}

/* Word Scramble */
.scramble-word{
    font-size:2.5rem;
    letter-spacing:8px;
    font-weight:bold;
    color:#764ba2;
    margin:20px 0;
    font-family:monospace;
}

.scramble-input{
    padding:14px 20px;
    font-size:18px;
    border:2px solid #e0d4f5;
    border-radius:14px;
    width:80%;
    max-width:300px;
    text-align:center;
    background:#fff;
    transition:border-color .3s;
}

.scramble-input:focus{
    outline:none;
    border-color:#764ba2;
    box-shadow:0 0 0 4px rgba(118,75,162,.15);
}

.scramble-hint{
    color:#888;
    font-size:13px;
    margin-top:10px;
    font-style:italic;
}

.scramble-score{
    margin-top:15px;
    font-size:14px;
    color:#4a1a7a;
    font-weight:bold;
}

/* Rock Paper Scissors */
.rps-choices{
    display:flex;
    justify-content:center;
    gap:15px;
    margin:20px 0;
}

.rps-btn{
    width:80px;
    height:80px;
    border-radius:50%;
    font-size:36px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:linear-gradient(135deg,#f5f0ff,#e8dfff);
    border:3px solid #e0d4f5;
    cursor:pointer;
    transition:transform .2s, border-color .2s, box-shadow .2s;
}

.rps-btn:hover{
    transform:scale(1.15);
    border-color:#764ba2;
    box-shadow:0 6px 20px rgba(118,75,162,.3);
}

.rps-result{
    font-size:1.2rem;
    font-weight:bold;
    margin:15px 0;
    min-height:30px;
}

.rps-result.win{color:#27ae60}
.rps-result.lose{color:#e74c3c}
.rps-result.draw{color:#f39c12}

.rps-scoreboard{
    display:flex;
    justify-content:center;
    gap:30px;
    margin:10px 0;
    font-size:14px;
    color:#4a1a7a;
}

.rps-round{
    display:flex;
    justify-content:center;
    gap:40px;
    font-size:48px;
    margin:15px 0;
    min-height:60px;
    align-items:center;
}

.rps-vs{font-size:18px;font-weight:bold;color:#888}

/* Build-a-Character */
.character-display{
    width:180px;
    height:220px;
    margin:15px auto;
    position:relative;
    background:linear-gradient(135deg,#e8dfff,#f5f0ff);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:80px;
    overflow:visible;
    border:3px solid #e0d4f5;
}

.char-accessory{
    position:absolute;
    font-size:36px;
}

.char-hat{top:-10px;left:50%;transform:translateX(-50%)}
.char-pet{bottom:5px;right:-15px;font-size:30px}
.char-bg{position:absolute;inset:0;border-radius:20px;opacity:.3;z-index:0}
.char-body{position:relative;z-index:1}

.char-shop{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
    margin-top:15px;
}

.shop-item{
    padding:8px 12px;
    border-radius:12px;
    font-size:13px;
    border:2px solid #e0d4f5;
    background:#fff;
    cursor:pointer;
    transition:all .2s;
}

.shop-item:hover{border-color:#764ba2;background:#f0e6ff}
.shop-item.owned{background:linear-gradient(135deg,#43e97b,#38f9d7);color:#1a5c3a;border-color:#43e97b}
.shop-item.equipped{border-color:#764ba2;box-shadow:0 0 0 3px rgba(118,75,162,.3)}
.shop-item.locked{opacity:.5;cursor:not-allowed}

.char-category{
    margin:12px 0 6px;
    font-size:13px;
    font-weight:bold;
    color:#888;
    text-transform:uppercase;
    letter-spacing:1px;
}

.char-points{
    font-size:14px;
    color:#667eea;
    font-weight:bold;
    margin:10px 0;
}

@media(max-width:500px){
    body{padding:10px}
    .card{padding:16px;margin:12px 0}
    h2{font-size:1.4rem}
    #setup{padding:25px 20px;margin:30px auto}
    .nav-tabs button{padding:8px 12px;font-size:12px}
    .games-grid{grid-template-columns:1fr}
    .rps-btn{width:65px;height:65px;font-size:28px}
    .reaction-box{width:160px;height:160px}
}
</style>
</head>

<body>

<button class="menu-toggle" onclick="toggleMenu()">☰</button>
<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<div class="sidebar" id="sidebar">
    <a href="kids.html" class="active">🏝️ Adventure Quest</a>
    <a href="counting.html">🔢 Counting</a>
    <a href="maths.html">🧮 Maths</a>
    <a href="kindness.html">🫂 Be Kind</a>
    <a href="games.html">🎮 Games</a>
    <a href="sos.html">🚨 SOS Police</a>
</div>

<div class="floaters">
    <div class="floater" style="top:8%;animation-duration:20s;font-size:36px">☁️</div>
    <div class="floater" style="top:25%;animation-duration:28s;animation-delay:4s;font-size:24px">✨</div>
    <div class="floater" style="top:50%;animation-duration:24s;animation-delay:8s;font-size:34px">☁️</div>
    <div class="floater" style="top:70%;animation-duration:22s;animation-delay:13s;font-size:28px">🌈</div>
    <div class="floater" style="top:40%;animation-duration:32s;animation-delay:6s;font-size:22px">⭐</div>
    <div class="floater" style="top:88%;animation-duration:26s;animation-delay:10s;font-size:30px">🦋</div>
    <div class="floater" style="top:15%;animation-duration:35s;animation-delay:15s;font-size:26px">🌟</div>
</div>

<div id="setup" style="display:none">
    <h2>🏝️ Adventure Quest</h2>
    <p>Enter the names of your little adventurers!</p>
    <div id="name-inputs"></div>
    <button class="add-kid-btn" onclick="addNameInput()">➕ Add another kid</button>
    <br>
    <button class="start-btn" onclick="startGame()">🚀 Start the Adventure!</button>
</div>

<div id="game" style="display:none">
    <h2>🏝️ <span id="title"></span> Adventure Quest</h2>
    <div id="leader" style="text-align:center;color:#ffd700;font-size:14px;font-weight:bold;margin-bottom:10px;text-shadow:0 1px 4px rgba(0,0,0,.3)"></div>
    <div class="nav-tabs" id="nav">
        <button class="active" onclick="showTab('quest')">🎮 Quest</button>
        <button onclick="showTab('calendar')">📅 History</button>
        <button onclick="showTab('leaderboard')">🏆 Leaderboard</button>
        <button onclick="showTab('minigames')">🕹️ Mini Games</button>
    </div>
    <div id="app"></div>
</div>

<div class="confetti-container" id="confetti"></div>

<script>

function toggleMenu(){
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('overlay').classList.toggle('open');
}

// --- AUDIO (iOS compatible) ---
// On iOS, Audio elements must be played once during a user gesture to unlock.
// We create them, and on first touch we play them silently to unlock.
function makeWav(freq, duration, type){
    const sampleRate=8000;
    const samples=Math.floor(sampleRate*duration);
    const buffer=new ArrayBuffer(44+samples*2);
    const view=new DataView(buffer);
    const str=(s,o)=>{for(let i=0;i<s.length;i++)view.setUint8(o+i,s.charCodeAt(i));};
    str('RIFF',0);view.setUint32(4,36+samples*2,true);str('WAVE',8);
    str('fmt ',12);view.setUint32(16,16,true);view.setUint16(20,1,true);
    view.setUint16(22,1,true);view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);
    str('data',36);view.setUint32(40,samples*2,true);
    for(let i=0;i<samples;i++){
        const t=i/sampleRate;
        const env=Math.max(0,1-t/duration);
        let val=0;
        if(type==='sine') val=Math.sin(2*Math.PI*freq*t);
        else if(type==='square') val=Math.sin(2*Math.PI*freq*t)>0?1:-1;
        else val=2*(freq*t%1)-1;
        view.setInt16(44+i*2,val*env*16000,true);
    }
    return URL.createObjectURL(new Blob([buffer],{type:'audio/wav'}));
}

// Pre-create Audio elements (reusable)
const dingAudio=new Audio(makeWav(1000,.25,'sine'));
const boopAudio=new Audio(makeWav(180,.2,'square'));
const fanfareAudios=[
    new Audio(makeWav(523,.35,'sine')),
    new Audio(makeWav(659,.35,'sine')),
    new Audio(makeWav(784,.35,'sine')),
    new Audio(makeWav(1047,.4,'sine'))
];

// iOS unlock: on first user interaction, play all audio elements at volume 0 to unlock them
let _iosUnlocked=false;
function iosUnlock(){
    if(_iosUnlocked) return;
    _iosUnlocked=true;
    [dingAudio,boopAudio,...fanfareAudios].forEach(a=>{
        a.volume=0;
        a.play().then(()=>{a.pause();a.currentTime=0;a.volume=1;}).catch(()=>{});
    });
    // Restore volume after a tick
    setTimeout(()=>{
        [dingAudio,boopAudio,...fanfareAudios].forEach(a=>{a.volume=1;});
    },200);
}
document.addEventListener('touchstart',iosUnlock,{once:true});
document.addEventListener('click',iosUnlock,{once:true});

function playDing(){
    dingAudio.currentTime=0;
    dingAudio.play().catch(()=>{});
}

function playBoop(){
    boopAudio.currentTime=0;
    boopAudio.play().catch(()=>{});
}

function playFanfare(){
    fanfareAudios.forEach((a,i)=>{
        setTimeout(()=>{a.currentTime=0;a.play().catch(()=>{});},i*120);
    });
}

// --- DATA ---
const avatarOptions = ['🦁','🐸','🦄','🐱','🐶','🦊','🐼','🐨','🦋','🐯','🦸','🧙'];
const defaultAvatars = ['🦁','🐸','🦄','🐱','🐶','🦊'];
let kids = JSON.parse(localStorage.getItem('quest_kids') || 'null');
let avatars = JSON.parse(localStorage.getItem('quest_avatars') || '{}');
let db, prev, history, streaks, initialized = false;
let currentTab = 'quest';

const defaultTasks = [
    "🪥 Teeth","📚 Reading","🧸 Tidy Toys","🤝 Help Brother",
    "🕌 Prayer","🧹 Clean House","👂 Listen to Parents"
];

let tasks = JSON.parse(localStorage.getItem('quest_tasks') || 'null') || [...defaultTasks];

function addCustomTask(){
    const name = prompt('Enter new good deed:');
    if(!name || !name.trim()) return;
    tasks.push('⭐ ' + name.trim());
    localStorage.setItem('quest_tasks', JSON.stringify(tasks));
    render();
}

const rewards = [
    {at:15, prize:"🍦 Ice cream!"},
    {at:30, prize:"🎬 Movie night!"},
    {at:50, prize:"🎁 Special surprise!"}
];

const challengePool = [
    {task:"🧑‍🍳 Help cook dinner", points:3},
    {task:"🌱 Water the plants", points:2},
    {task:"✏️ Draw a picture for someone", points:2},
    {task:"🧓 Call a grandparent", points:3},
    {task:"📖 Read an extra story", points:2},
    {task:"🎵 Sing a song for the family", points:2},
    {task:"🧹 Clean your room without being asked", points:3},
    {task:"💌 Write a nice note for a family member", points:2}
];

const milestones = [15, 30, 50];

function level(p){
    if(p>=50) return "👑 Hero";
    if(p>=30) return "🐉 Dragon Rider";
    if(p>=15) return "🦸 Super Helper";
    return "🚀 Explorer";
}

function nextGoal(p){
    if(p<15) return 15;
    if(p<30) return 30;
    if(p<50) return 50;
    return 100;
}

function todayStr(){ return new Date().toISOString().slice(0,10); }

function getDailyChallenge(){
    const seed = todayStr().split('-').join('');
    const idx = parseInt(seed) % challengePool.length;
    return challengePool[idx];
}

// --- STREAK ---
function updateStreak(k){
    const today = todayStr();
    if(!streaks[k]) streaks[k] = {last:'', count:0};
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    if(streaks[k].last === today) return;
    if(streaks[k].last === yesterday){
        streaks[k].count++;
    } else if(streaks[k].last !== today){
        streaks[k].count = 1;
    }
    streaks[k].last = today;
    localStorage.setItem('quest_streaks', JSON.stringify(streaks));
}

// --- HISTORY ---
function recordHistory(k, points){
    const today = todayStr();
    if(!history[k]) history[k] = {};
    history[k][today] = db[k];
    localStorage.setItem('quest_history', JSON.stringify(history));
}

// --- SETUP ---
function addNameInput(){
    const div = document.getElementById('name-inputs');
    const count = div.querySelectorAll('.avatar-row').length;
    const row = document.createElement('div');
    row.className = 'avatar-row';
    row.style.animation = 'fadeInUp .3s ease forwards';
    row.innerHTML = `
        <span class="avatar-pick selected" onclick="pickAvatar(this,${count})">${defaultAvatars[count % defaultAvatars.length]}</span>
        <input type="text" class="name-input" placeholder="Kid's name" maxlength="15">
    `;
    div.appendChild(row);
    row.querySelector('input').focus();
}

function pickAvatar(el, idx){
    const current = avatarOptions.indexOf(el.textContent);
    const next = (current+1) % avatarOptions.length;
    el.textContent = avatarOptions[next];
}

function init(){
    if(kids && kids.length >= 2){
        loadGame();
    } else {
        document.getElementById('setup').style.display = 'block';
        addNameInput();
        addNameInput();
    }
}

function startGame(){
    const rows = document.querySelectorAll('.avatar-row');
    const names = [], avs = {};
    rows.forEach(row=>{
        const name = row.querySelector('input').value.trim();
        const av = row.querySelector('.avatar-pick').textContent;
        if(name){ names.push(name); avs[name] = av; }
    });
    if(names.length < 2){ alert('Please enter at least 2 names!'); return; }
    if(new Set(names).size !== names.length){ alert('Each name must be unique!'); return; }
    kids = names;
    avatars = avs;
    localStorage.setItem('quest_kids', JSON.stringify(kids));
    localStorage.setItem('quest_avatars', JSON.stringify(avatars));
    loadGame();
}

function resetNames(){
    localStorage.removeItem('quest_kids');
    localStorage.removeItem('quest_avatars');
    localStorage.removeItem('quest_data');
    localStorage.removeItem('quest_history');
    localStorage.removeItem('quest_streaks');
    localStorage.removeItem('quest_challenge');
    localStorage.removeItem('quest_last_date');
    localStorage.removeItem('quest_tasks');
    location.reload();
}

function loadGame(){
    document.getElementById('setup').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    document.getElementById('title').textContent = kids.join(' & ');

    db = JSON.parse(localStorage.getItem('quest_data') || '{}');
    history = JSON.parse(localStorage.getItem('quest_history') || '{}');
    streaks = JSON.parse(localStorage.getItem('quest_streaks') || '{}');
    kids.forEach(k=>{ if(!(k in db)) db[k] = 0; });

    // Daily reset: if last played date is not today, save scores to history and reset
    const lastDate = localStorage.getItem('quest_last_date') || '';
    const today = todayStr();
    if(lastDate && lastDate !== today){
        kids.forEach(k=>{
            if(!history[k]) history[k] = {};
            history[k][lastDate] = db[k];
            db[k] = 0;
        });
        localStorage.setItem('quest_history', JSON.stringify(history));
        localStorage.setItem('quest_data', JSON.stringify(db));
    }
    localStorage.setItem('quest_last_date', today);

    prev = {...db};

    showTab('quest');
}

// --- TABS ---
function showTab(tab){
    currentTab = tab;
    document.querySelectorAll('.nav-tabs button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.nav-tabs button').forEach(b=>{
        if(
            (tab==='quest' && b.textContent.includes('Quest')) ||
            (tab==='calendar' && b.textContent.includes('History')) ||
            (tab==='leaderboard' && b.textContent.includes('Leaderboard')) ||
            (tab==='minigames' && b.textContent.includes('Mini Games'))
        ) b.classList.add('active');
    });
    if(tab==='quest') render();
    else if(tab==='calendar') renderCalendar();
    else if(tab==='leaderboard') renderLeaderboard();
    else if(tab==='minigames') renderMiniGames();
}

// --- ACTIONS ---
function add(k){
    prev[k] = db[k];
    db[k]++;
    updateStreak(k);
    recordHistory(k, db[k]);
    playDing();
    update(k,'good');
}

function remove(k){
    prev[k] = db[k];
    db[k] = Math.max(0, db[k]-1);
    recordHistory(k, db[k]);
    playBoop();
    update(k,'bad');
}

function teamWork(){
    kids.forEach(k=>{ prev[k] = db[k]; db[k]+=2; updateStreak(k); recordHistory(k,db[k]); });
    playDing();
    kids.forEach(k=> update(k,'good'));
}

function completeChallenge(k){
    const ch = getDailyChallenge();
    const done = JSON.parse(localStorage.getItem('quest_challenge')||'{}');
    const today = todayStr();
    if(!done[today]) done[today] = [];
    if(done[today].includes(k)) return;
    done[today].push(k);
    localStorage.setItem('quest_challenge', JSON.stringify(done));
    prev[k] = db[k];
    db[k] += ch.points;
    updateStreak(k);
    recordHistory(k, db[k]);
    playFanfare();
    update(k,'good');
}

function isChallengeComplete(k){
    const done = JSON.parse(localStorage.getItem('quest_challenge')||'{}');
    const today = todayStr();
    return done[today] && done[today].includes(k);
}

// --- CONFETTI ---
function fireConfetti(){
    const container = document.getElementById('confetti');
    const colors = ['#667eea','#764ba2','#f093fb','#43e97b','#ffd700','#ff5252'];
    for(let i=0;i<25;i++){
        const piece = document.createElement('div');
        piece.className='confetti-piece';
        piece.style.left=(30+Math.random()*40)+'%';
        piece.style.top=(20+Math.random()*30)+'%';
        piece.style.background=colors[Math.floor(Math.random()*colors.length)];
        piece.style.setProperty('--dx',(Math.random()*250-125)+'px');
        piece.style.setProperty('--dy',(Math.random()*350+100)+'px');
        piece.style.borderRadius=Math.random()>.5?'50%':'2px';
        container.appendChild(piece);
    }
    setTimeout(()=>{container.innerHTML='';},1600);
}

// --- RIPPLE ---
document.addEventListener('click',function(e){
    const btn=e.target.closest('button');
    if(!btn)return;
    btn.classList.remove('ripple');
    void btn.offsetWidth;
    btn.classList.add('ripple');
    setTimeout(()=>btn.classList.remove('ripple'),500);
});

// --- UPDATE ---
function update(k,type){
    if(!initialized||currentTab!=='quest'){render();return;}

    const p=db[k];
    const el=document.getElementById('card-'+CSS.escape(k));
    if(!el){render();return;}

    const pts=el.querySelector('.points');
    pts.textContent='⭐ '+p;
    pts.classList.remove('points-pulse','points-bad');
    void pts.offsetWidth;
    pts.classList.add(type==='good'?'points-pulse':'points-bad');

    const newLevel=level(p);
    const badgeEl=el.querySelector('.badge');
    const oldLevel=badgeEl.textContent;
    badgeEl.textContent=newLevel;

    if(newLevel!==oldLevel){
        badgeEl.classList.remove('glow');
        void badgeEl.offsetWidth;
        badgeEl.classList.add('glow');
        playFanfare();
    }

    const runnerEl=document.getElementById('runner-'+CSS.escape(k));
    if(runnerEl){
        runnerEl.style.left=Math.min((p/50)*100,100)+'%';
        const label=runnerEl.querySelector('.runner-label');
        if(label) label.textContent=k+' ('+p+'⭐)';
    }
    el.querySelector('.goal-text').innerHTML='🎯 Next Goal: <strong>'+nextGoal(p)+' points</strong>';

    // Streak display
    const streakEl=el.querySelector('.streak');
    if(streakEl&&streaks[k]) streakEl.textContent='🔥 '+streaks[k].count+' day streak';

    milestones.forEach(m=>{
        if(prev[k]<m&&p>=m){fireConfetti();playFanfare();}
    });

    updateLeader();
    localStorage.setItem('quest_data',JSON.stringify(db));
}

// --- RENDER QUEST ---
function render(){
    let out="";
    const trackHeight=60+kids.length*44;
    const today=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'short',year:'numeric'});
    const ch=getDailyChallenge();

    out+=`
    <div class="card" id="card-race">
        <h3>📅 Daily Progress — ${today}</h3>
        <div class="milestone-container">
            <div class="track" style="height:${trackHeight}px">
                ${kids.map((k,i)=>`
                <div class="runner runner-${i}" id="runner-${CSS.escape(k)}" style="left:${Math.min((db[k]/50)*100,100)}%">
                    <span class="runner-emoji">${avatars[k]||defaultAvatars[i%defaultAvatars.length]}</span>
                    <span class="runner-label">${k} (${db[k]}⭐)</span>
                </div>`).join('')}
                <div class="milestone m15">🦸<span>15</span></div>
                <div class="milestone m30">🐉<span>30</span></div>
                <div class="milestone m50">👑<span>50</span></div>
            </div>
        </div>
        <h4>🎁 Rewards</h4>
        <div>${rewards.map(r=>`<span class="reward">${r.at} pts → ${r.prize}</span> `).join('')}</div>
    </div>`;

    // Daily Challenge
    out+=`
    <div class="card">
        <h3>⚡ Daily Challenge</h3>
        <div class="challenge">
            <div>${ch.task} (+${ch.points}⭐)</div>
            ${kids.map(k=>
                isChallengeComplete(k)
                ? `<button disabled style="opacity:.5;margin-top:8px">✅ ${k} done!</button>`
                : `<button onclick="completeChallenge('${k.replace(/'/g,"\\'")}')" style="margin-top:8px">${avatars[k]||'⭐'} ${k}</button>`
            ).join('')}
        </div>
    </div>`;

    // Kid cards
    kids.forEach((k,i)=>{
        const p=db[k];
        const streak=streaks[k]?streaks[k].count:0;
        out+=`
        <div class="card" id="card-${CSS.escape(k)}">
            <div class="name">
                <h3>${avatars[k]||defaultAvatars[i%defaultAvatars.length]} ${k}</h3>
                <div class="points">⭐ ${p}</div>
            </div>
            ${streak>0?`<div class="streak">🔥 ${streak} day streak</div>`:''}
            <div class="badge">${level(p)}</div>
            <p class="goal-text">🎯 Next Goal: <strong>${nextGoal(p)} points</strong></p>

            <h4>✅ Good Deeds</h4>
            ${tasks.map(t=>`<button class="good" onclick="add('${k.replace(/'/g,"\\'")}')">+ ${t}</button>`).join("")}
            <button class="good" style="opacity:.7;border:2px dashed #1a5c3a" onclick="addCustomTask()">➕ Other</button>

            <h4>😈 Oops</h4>
            ${tasks.map(t=>`<button class="bad" onclick="remove('${k.replace(/'/g,"\\'")}')">− ${t}</button>`).join("")}
        </div>`;
    });

    out+=`
    <div class="card">
        <h3>🤝 Team Quest</h3>
        <button class="team" onclick="teamWork()">⚡ +2 Both Worked Together!</button>
        <br><br>
        <span class="reset-link" onclick="resetNames()">⚙️ Change names & reset</span>
    </div>`;

    document.getElementById("app").innerHTML=out;
    updateLeader();
    localStorage.setItem('quest_data',JSON.stringify(db));
    initialized=true;
}

function updateLeader(){
    const maxPts=Math.max(...kids.map(k=>db[k]));
    const el=document.getElementById('leader');
    if(maxPts===0){el.textContent='';return;}
    const leaders=kids.filter(k=>db[k]===maxPts);
    const tied=leaders.length>1;
    el.textContent='🏆 '+(tied?'Tied: ':'Leading: ')+leaders.map(k=>(avatars[k]||'⭐')+' '+k).join(' & ')+' ('+maxPts+'⭐)';
}

// --- RENDER CALENDAR ---
function renderCalendar(){
    let out='<div class="card"><h3>📅 Weekly Performance</h3>';
    const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const colors=['#667eea','#43e97b','#e17055','#fdcb6e','#a29bfe','#00cec9'];

    const last7=[];
    for(let i=6;i>=0;i--){
        last7.push(new Date(Date.now()-i*86400000));
    }

    // Collect all data
    const allData=kids.map((k,ki)=>{
        const pts7=last7.map(d=>{
            const key=d.toISOString().slice(0,10);
            return history[k]&&history[k][key]?history[k][key]:(key===todayStr()?db[k]:0);
        });
        return {name:k, pts7, color:colors[ki%colors.length], avatar:avatars[k]||'⭐'};
    });

    const globalMax=Math.max(...allData.flatMap(d=>d.pts7),1);
    const w=280,h=90,padX=25,padY=10;
    const graphW=w-padX*2, graphH=h-padY*2;

    function makeSVG(datasets,max,showLabels){
        let svg=`<svg viewBox="0 0 ${w} ${h+18}">`;
        // Day labels
        if(showLabels){
            for(let i=0;i<7;i++){
                const x=padX+i*(graphW/6);
                svg+=`<text x="${x}" y="${h+12}" text-anchor="middle" font-size="8" fill="#888">${dayNames[last7[i].getDay()]} ${last7[i].getDate()}</text>`;
            }
        }
        datasets.forEach(ds=>{
            const points=ds.pts7.map((p,i)=>({
                x:padX+i*(graphW/6),
                y:padY+graphH-(p/max)*graphH,
                p
            }));
            const line=points.map((pt,i)=>((i===0?'M':'L')+pt.x+','+pt.y)).join(' ');
            const area=line+` L${points[6].x},${h-padY} L${points[0].x},${h-padY} Z`;
            svg+=`<path d="${area}" fill="${ds.color}" fill-opacity=".12"/>`;
            svg+=`<path d="${line}" fill="none" stroke="${ds.color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
            points.forEach(pt=>{
                svg+=`<circle cx="${pt.x}" cy="${pt.y}" r="3" fill="${ds.color}"/>`;
                if(pt.p) svg+=`<text x="${pt.x}" y="${pt.y-6}" text-anchor="middle" font-size="8" font-weight="bold" fill="${ds.color}">${pt.p}</text>`;
            });
        });
        svg+=`</svg>`;
        return svg;
    }

    out+=`<div class="history-layout">`;

    // Left: individual graphs
    out+=`<div class="history-individual">`;
    allData.forEach(ds=>{
        const max=Math.max(...ds.pts7,1);
        out+=`<div><span class="history-label">${ds.avatar} ${ds.name}</span>
            <div class="line-graph">${makeSVG([ds],max,true)}</div></div>`;
    });
    out+=`</div>`;

    // Right: combined graph
    out+=`<div class="history-combined">
        <span class="history-label">📊 Combined</span>
        <div class="line-graph">${makeSVG(allData,globalMax,true)}</div>
        <div class="legend">${allData.map(ds=>`<span class="legend-item"><span class="legend-dot" style="background:${ds.color}"></span>${ds.name}</span>`).join('')}</div>
    </div>`;

    out+=`</div></div>`;
    document.getElementById("app").innerHTML=out;
}

// --- RENDER LEADERBOARD ---
function allTimeTotal(k){
    let total = db[k]; // today's points
    if(history[k]){
        Object.values(history[k]).forEach(v=>{ total += v; });
    }
    // subtract today's from history if already recorded there to avoid double count
    const today = todayStr();
    if(history[k] && history[k][today]) total -= history[k][today];
    return total;
}

function renderLeaderboard(){
    const sorted=[...kids].sort((a,b)=>allTimeTotal(b)-allTimeTotal(a));
    let out='<div class="card"><h3>🏆 All-Time Leaderboard</h3>';

    sorted.forEach((k,i)=>{
        const rank=i===0?'🥇':i===1?'🥈':i===2?'🥉':(i+1);
        const streak=streaks[k]?streaks[k].count:0;
        out+=`
        <div class="lb-row">
            <span class="lb-rank">${rank}</span>
            <span class="lb-name">${avatars[k]||'⭐'} ${k}</span>
            <span class="lb-stat">
                ⭐ ${allTimeTotal(k)} pts<br>
                🔥 ${streak} day streak<br>
                ${level(allTimeTotal(k))}
            </span>
        </div>`;
    });

    // Stats
    out+=`<h4 style="margin-top:20px">📊 Stats</h4>`;
    const totalPts=kids.reduce((s,k)=>s+allTimeTotal(k),0);
    const bestStreak=Math.max(...kids.map(k=>streaks[k]?streaks[k].count:0));
    out+=`
    <div class="lb-row">
        <span class="lb-name">Total points earned</span>
        <span class="lb-stat">⭐ ${totalPts}</span>
    </div>
    <div class="lb-row">
        <span class="lb-name">Best streak</span>
        <span class="lb-stat">🔥 ${bestStreak} days</span>
    </div>`;

    out+='</div>';
    document.getElementById("app").innerHTML=out;
}

// MINI GAMES

function renderMiniGames(){
    let out = `<div class="card"><h3>🕹️ Mini Games</h3>

// --- Player selector for games ---
function playerSelector(gameId){
    return `<div style="margin:10px 0">
        <label style="font-size:13px;font-weight:bold;color:#4a1a7a">Playing as: </label>
        <select id="${gameId}-player" style="padding:8px 12px;border-radius:10px;border:2px solid #e0d4f5;font-size:14px;background:#fff">
            ${kids.map((k,i)=>`<option value="${k}">${avatars[k]||'⭐'} ${k}</option>`).join('')}
        </select>
    </div>`;
}

function getSelectedPlayer(gameId){
    const sel = document.getElementById(gameId+'-player');
    return sel ? sel.value : kids[0];
}

function awardGamePoints(k, pts){
    if(!db[k] && db[k]!==0) return;
    prev[k] = db[k];
    db[k] += pts;
    updateStreak(k);
    recordHistory(k, db[k]);
    localStorage.setItem('quest_data', JSON.stringify(db));
}

// ============================
// 1. REACTION SPEED GAME
// ============================
let reactionState = 'idle'; // idle, waiting, ready
let reactionTimeout = null;
let reactionStartTime = 0;
let reactionBest = JSON.parse(localStorage.getItem('quest_reaction_best')||'{}');

function renderReactionGame(){
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>⚡ Reaction Speed</h3>
        <p style="color:#666;font-size:13px">When the circle turns <strong style="color:#27ae60">GREEN</strong>, tap it as fast as you can!</p>
        ${playerSelector('reaction')}
        <div class="reaction-box waiting" id="reaction-circle" onclick="reactionClick()">
            Tap to Start
        </div>
        <div class="reaction-results" id="reaction-results">
            ${renderReactionBests()}
        </div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    reactionState = 'idle';
}

function renderReactionBests(){
    let html = '';
    kids.forEach(k=>{
        if(reactionBest[k]){
            html += `<div>${avatars[k]||'⭐'} ${k}: <span class="best">${reactionBest[k]}ms</span></div>`;
        }
    });
    return html || '<div style="color:#888">No records yet!</div>';
}

function reactionClick(){
    const circle = document.getElementById('reaction-circle');
    const results = document.getElementById('reaction-results');

    if(reactionState === 'idle'){
        // Start - wait for random time
        reactionState = 'waiting';
        circle.className = 'reaction-box waiting';
        circle.textContent = 'Wait for green...';
        const delay = 1500 + Math.random() * 3000;
        reactionTimeout = setTimeout(()=>{
            reactionState = 'ready';
            reactionStartTime = Date.now();
            circle.className = 'reaction-box ready';
            circle.textContent = 'TAP NOW!';
        }, delay);
    } else if(reactionState === 'waiting'){
        // Too early!
        clearTimeout(reactionTimeout);
        circle.className = 'reaction-box clicked';
        circle.textContent = '❌ Too early! Tap to retry';
        playBoop();
        reactionState = 'idle';
    } else if(reactionState === 'ready'){
        // Got it!
        const time = Date.now() - reactionStartTime;
        const player = getSelectedPlayer('reaction');
        circle.className = 'reaction-box clicked';
        circle.textContent = time + 'ms!';
        playDing();

        // Check best
        if(!reactionBest[player] || time < reactionBest[player]){
            reactionBest[player] = time;
            localStorage.setItem('quest_reaction_best', JSON.stringify(reactionBest));
            circle.textContent = time + 'ms! 🎉 New Best!';
            playFanfare();
            fireConfetti();
        }

        // Award points based on speed
        let pts = 0;
        if(time < 250) pts = 3;
        else if(time < 400) pts = 2;
        else if(time < 600) pts = 1;

        if(pts > 0){
            awardGamePoints(player, pts);
            results.innerHTML = `<div style="color:#27ae60;font-weight:bold;margin-bottom:8px">+${pts}⭐ for ${player}!</div>` + renderReactionBests();
        } else {
            results.innerHTML = renderReactionBests();
        }

        reactionState = 'idle';
        setTimeout(()=>{
            circle.className = 'reaction-box waiting';
            circle.textContent = 'Tap to Play Again';
        }, 1500);
    }
}

const scrambleWords = [
    {word:'KINDNESS', hint:'Being nice to others'},
    {word:'PATIENCE', hint:'Waiting calmly'},
    {word:'HONESTY', hint:'Always telling the truth'},
    {word:'COURAGE', hint:'Being brave'},
    {word:'RESPECT', hint:'Treating others well'},
    {word:'SHARING', hint:'Giving to others'},
    {word:'HELPFUL', hint:'Lending a hand'},
    {word:'POLITE', hint:'Good manners'},
    {word:'GENTLE', hint:'Soft and careful'},
    {word:'FRIEND', hint:'Someone you play with'},
    {word:'CLEAN', hint:'Tidy and neat'},
    {word:'LISTEN', hint:'Using your ears'},
    {word:'PRAYER', hint:'Talking to Allah'},
    {word:'FAMILY', hint:'People you love at home'},
    {word:'SMILE', hint:'A happy face'},
    {word:'THANKS', hint:'Being grateful'},
    {word:'BRAVE', hint:'Not afraid'},
    {word:'TRUTH', hint:'What is real and honest'}
];

let scrambleCurrent = null;
let scrambleScore = 0;
let scrambleUsed = [];

function renderScrambleGame(){
    scrambleScore = 0;
    scrambleUsed = [];
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>🔤 Word Scramble</h3>
        <p style="color:#666;font-size:13px">Unscramble the word! Earn points for good character traits.</p>
        ${playerSelector('scramble')}
        <div id="scramble-area"></div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    nextScrambleWord();
}

function shuffleWord(word){
    let arr = word.split('');
    for(let i = arr.length-1; i > 0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    // Make sure it's actually scrambled
    if(arr.join('')===word && word.length>1) return shuffleWord(word);
    return arr.join('');
}

function nextScrambleWord(){
    const available = scrambleWords.filter(w => !scrambleUsed.includes(w.word));
    if(available.length === 0){
        document.getElementById('scramble-area').innerHTML = `
            <div style="margin:30px 0">
                <div style="font-size:48px;margin-bottom:10px">🎉</div>
                <h4>All words complete!</h4>
                <div class="scramble-score">Final Score: ${scrambleScore} words solved</div>
                <button class="good" onclick="scrambleScore=0;scrambleUsed=[];nextScrambleWord()" style="margin-top:15px">🔄 Play Again</button>
            </div>`;
        return;
    }
    scrambleCurrent = available[Math.floor(Math.random()*available.length)];
    const scrambled = shuffleWord(scrambleCurrent.word);

    document.getElementById('scramble-area').innerHTML = `
        <div class="scramble-word">${scrambled}</div>
        <input type="text" class="scramble-input" id="scramble-guess"
            placeholder="Type the word..." maxlength="${scrambleCurrent.word.length}"
            onkeyup="checkScrambleGuess(event)" autocomplete="off" autocapitalize="characters">
        <div class="scramble-hint">💡 Hint: ${scrambleCurrent.hint}</div>
        <div class="scramble-score">Solved: ${scrambleScore} | Remaining: ${available.length}</div>
        <button class="bad" onclick="skipScrambleWord()" style="margin-top:10px;font-size:12px">Skip →</button>
    `;
    document.getElementById('scramble-guess').focus();
}

function checkScrambleGuess(e){
    const guess = document.getElementById('scramble-guess').value.toUpperCase().trim();
    if(guess === scrambleCurrent.word){
        playDing();
        scrambleScore++;
        scrambleUsed.push(scrambleCurrent.word);

        const player = getSelectedPlayer('scramble');
        awardGamePoints(player, 2);

        document.getElementById('scramble-area').innerHTML = `
            <div style="font-size:48px;margin:20px 0">✅</div>
            <h4 style="color:#27ae60">Correct! "${scrambleCurrent.word}"</h4>
            <div style="color:#27ae60;font-weight:bold">+2⭐ for ${player}!</div>
            <div class="scramble-score">Solved: ${scrambleScore}</div>
        `;
        fireConfetti();
        setTimeout(nextScrambleWord, 1500);
    }
}

function skipScrambleWord(){
    playBoop();
    scrambleUsed.push(scrambleCurrent.word);
    document.getElementById('scramble-area').innerHTML = `
        <div style="font-size:48px;margin:20px 0">⏭️</div>
        <h4>The word was: <strong style="color:#764ba2">${scrambleCurrent.word}</strong></h4>
    `;
    setTimeout(nextScrambleWord, 1200);
}

// 3. ROCK PAPER SCISSORS
// ============================
let rpsPlayerScore = 0;
let rpsComputerScore = 0;
let rpsRound = 0;
const rpsBestOf = 5;
const rpsChoices = ['🪨','📄','✂️'];
const rpsNames = ['Rock','Paper','Scissors'];

function renderRPSGame(){
    rpsPlayerScore = 0;
    rpsComputerScore = 0;
    rpsRound = 0;
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>✊ Rock Paper Scissors</h3>
        <p style="color:#666;font-size:13px">Best of ${rpsBestOf} — beat the computer to earn points!</p>
        ${playerSelector('rps')}
        <div id="rps-area">
            <div class="rps-scoreboard">
                <span>You: <strong id="rps-p-score">0</strong></span>
                <span>Round: <strong id="rps-round">0</strong>/${rpsBestOf}</span>
                <span>Computer: <strong id="rps-c-score">0</strong></span>
            </div>
            <div class="rps-round" id="rps-display">
                <span>❓</span>
                <span class="rps-vs">VS</span>
                <span>❓</span>
            </div>
            <div class="rps-result" id="rps-result">Choose your weapon!</div>
            <div class="rps-choices">
                <button class="rps-btn" onclick="playRPS(0)">🪨</button>
                <button class="rps-btn" onclick="playRPS(1)">📄</button>
                <button class="rps-btn" onclick="playRPS(2)">✂️</button>
            </div>
        </div>
    </div>`;
    document.getElementById("app").innerHTML = out;
}

function playRPS(playerChoice){
    if(rpsRound >= rpsBestOf) return;

    const computerChoice = Math.floor(Math.random()*3);
    rpsRound++;

    // Determine winner
    let result;
    if(playerChoice === computerChoice){
        result = 'draw';
    } else if(
        (playerChoice===0 && computerChoice===2)||
        (playerChoice===1 && computerChoice===0)||
        (playerChoice===2 && computerChoice===1)
    ){
        result = 'win';
        rpsPlayerScore++;
    } else {
        result = 'lose';
        rpsComputerScore++;
    }

    // Update display
    document.getElementById('rps-display').innerHTML = `
        <span style="font-size:48px">${rpsChoices[playerChoice]}</span>
        <span class="rps-vs">VS</span>
        <span style="font-size:48px">${rpsChoices[computerChoice]}</span>
    `;

    const resultEl = document.getElementById('rps-result');
    if(result==='win'){ resultEl.className='rps-result win'; resultEl.textContent='You win this round! 🎉'; playDing(); }
    else if(result==='lose'){ resultEl.className='rps-result lose'; resultEl.textContent='Computer wins! 😤'; playBoop(); }
    else{ resultEl.className='rps-result draw'; resultEl.textContent='Draw! 🤝'; }

    document.getElementById('rps-p-score').textContent = rpsPlayerScore;
    document.getElementById('rps-c-score').textContent = rpsComputerScore;
    document.getElementById('rps-round').textContent = rpsRound;

    // Check if game over
    if(rpsRound >= rpsBestOf){
        setTimeout(()=>{
            const player = getSelectedPlayer('rps');
            let pts = 0;
            let msg = '';
            if(rpsPlayerScore > rpsComputerScore){
                pts = 3;
                msg = `🏆 You won ${rpsPlayerScore}-${rpsComputerScore}! +${pts}⭐ for ${player}!`;
                playFanfare();
                fireConfetti();
            } else if(rpsPlayerScore < rpsComputerScore){
                msg = `😢 Computer won ${rpsComputerScore}-${rpsPlayerScore}. Better luck next time!`;
            } else {
                pts = 1;
                msg = `🤝 It's a tie! +${pts}⭐ for ${player}!`;
            }
            if(pts > 0) awardGamePoints(player, pts);
            resultEl.innerHTML = `${msg}<br><button class="good" onclick="renderRPSGame()" style="margin-top:10px">🔄 Play Again</button>`;
        }, 800);
    }
}

    ]
};

function getCharData(player){
    if(!charData[player]) charData[player] = {owned:[], hat:null, pet:null, bg:null};
    return charData[player];
}

function saveCharData(){
    localStorage.setItem('quest_character', JSON.stringify(charData));
}

function renderCharacterGame(){
    let out = `<div class="card">
        <button class="game-back-btn" onclick="renderMiniGames()">← Back to Games</button>
        <h3>🎨 Build-a-Character</h3>
        <p style="color:#666;font-size:13px">Spend your all-time points to buy accessories!</p>
        ${playerSelector('character')}
        <button class="good" onclick="renderCharacterShop()" style="margin-top:5px;font-size:13px">🔄 Refresh</button>
        <div id="character-area"></div>
    </div>`;
    document.getElementById("app").innerHTML = out;
    renderCharacterShop();
}

function renderCharacterShop(){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    const totalPts = allTimeTotal(player);

    // Calculate spent points
    let spent = 0;
    data.owned.forEach(itemId=>{
        Object.values(charShop).forEach(category=>{
            const item = category.find(i=>i.id===itemId);
            if(item) spent += item.cost;
        });
    });
    const available = totalPts - spent;

    // Build character display
    const avatar = avatars[player] || '🦁';
    const bgItem = data.bg ? charShop.backgrounds.find(b=>b.id===data.bg) : null;
    const bgStyle = bgItem ? `background:${bgItem.color}` : '';

    let charHTML = `
        <div class="char-points">${avatars[player]||'⭐'} ${player} — 💰 ${available} points to spend (${totalPts} earned total)</div>
        <div class="character-display">
            <div class="char-bg" style="${bgStyle}"></div>
            ${data.hat ? `<span class="char-accessory char-hat">${charShop.hats.find(h=>h.id===data.hat)?.emoji||''}</span>` : ''}
            <span class="char-body" style="font-size:80px">${avatar}</span>
            ${data.pet ? `<span class="char-accessory char-pet">${charShop.pets.find(p=>p.id===data.pet)?.emoji||''}</span>` : ''}
        </div>
    `;

    // Shop sections
    charHTML += renderShopSection('🎩 Hats', charShop.hats, 'hats', data, available);
    charHTML += renderShopSection('🐾 Pets', charShop.pets, 'pets', data, available);
    charHTML += renderShopSection('🎨 Backgrounds', charShop.backgrounds, 'backgrounds', data, available);

    document.getElementById('character-area').innerHTML = charHTML;
}

function renderShopSection(title, items, category, data, available){
    let html = `<div class="char-category">${title}</div><div class="char-shop">`;
    items.forEach(item=>{
        const owned = data.owned.includes(item.id);
        const equipped = (category==='hats'&&data.hat===item.id) ||
                        (category==='pets'&&data.pet===item.id) ||
                        (category==='backgrounds'&&data.bg===item.id);
        const canAfford = available >= item.cost;

        let cls = 'shop-item';
        let label = `${item.emoji} ${item.name} (${item.cost}⭐)`;
        let action = '';

        if(equipped){
            cls += ' equipped owned';
            label = `${item.emoji} ${item.name} ✓`;
            action = `onclick="unequipItem('${category}','${item.id}')"`;
        } else if(owned){
            cls += ' owned';
            label = `${item.emoji} ${item.name}`;
            action = `onclick="equipItem('${category}','${item.id}')"`;
        } else if(!canAfford){
            cls += ' locked';
            label = `🔒 ${item.name} (${item.cost}⭐)`;
        } else {
            action = `onclick="buyItem('${category}','${item.id}','${item.cost}')"`;
        }

        html += `<button class="${cls}" ${action}>${label}</button>`;
    });
    html += `</div>`;
    return html;
}

function buyItem(category, itemId, cost){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    const totalPts = allTimeTotal(player);
    let spent = 0;
    data.owned.forEach(id=>{
        Object.values(charShop).forEach(cat=>{
            const item = cat.find(i=>i.id===id);
            if(item) spent += item.cost;
        });
    });
    const available = totalPts - spent;

    if(available < cost){ playBoop(); return; }

    data.owned.push(itemId);
    // Auto-equip
    if(category==='hats') data.hat = itemId;
    else if(category==='pets') data.pet = itemId;
    else if(category==='backgrounds') data.bg = itemId;

    saveCharData();
    playDing();
    renderCharacterShop();
}

function equipItem(category, itemId){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    if(category==='hats') data.hat = itemId;
    else if(category==='pets') data.pet = itemId;
    else if(category==='backgrounds') data.bg = itemId;
    saveCharData();
    playDing();
    renderCharacterShop();
}

function unequipItem(category, itemId){
    const player = getSelectedPlayer('character');
    const data = getCharData(player);
    if(category==='hats') data.hat = null;
    else if(category==='pets') data.pet = null;
    else if(category==='backgrounds') data.bg = null;
    saveCharData();
    renderCharacterShop();
}
